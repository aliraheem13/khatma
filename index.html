ndex"></section> <section class="view" id="v-set"></section> <section class="view" id="v-reg"></section> <section class="view" id="v-tsb"></section> <section class="view" id="v-duas"></section> <nav> <button data-v="wird"><span>🌙</span>الورد</button> <button data-v="read"><span>📖</span>المصحف</button> <button data-v="index"><span>📑</span>الفهرس</button> <button data-v="tsb"><span>📿</span>التسبيح</button> <button data-v="duas"><span>🕌</span>الأدعية</button> <button data-v="set"><span>⚙️</span>الإعدادات</button> </nav> <script> const $ = id => document.getElementById(id); const AR = n => Number(n).toLocaleString('ar-EG'); const TOTAL = 604; const NUDGE = 'لا تدع الدنيا تلهيك، هيّا لنكمل قراءة القرآن 🌙'; const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); const nudge = () => (st.profile && st.profile.name ? st.profile.name + '، ' : '') + NUDGE; const JUZ = [1,22,42,62,82,102,121,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582]; // ---------- التخزين ---------- const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } }; const DEF = { plan: null, done: 0, todayDate: '', todayStart: 0, todayDone: false, todayRead: 0, todayDeferred: false, streak: 0, lastDate: '', khatmat: 0, last: 1, fs: 30, theme: 'light', remind: { on: false, time: '20:00' }, notifDate: '', profile: null, tsb: { mode: 'free', i: 0, count: 0, target: 33, phase: 0, rounds: 0, day: '', today: 0, total: 0, custom: '' } }; let st = Object.assign({}, DEF, LS.get('khatm_state', {})); st.remind = Object.assign({}, DEF.remind, st.remind || {}); st.tsb = Object.assign({}, DEF.tsb, st.tsb || {}); if (st.todayRead < st.todayStart) st.todayRead = st.todayStart; const save = () => LS.set('khatm_state', st); // ---------- التاريخ ---------- const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); const today = () => ymd(new Date()); const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); }; const pagesTxt = n => n === 1 ? 'صفحة واحدة' : n === 2 ? 'صفحتان' : n <= 10 ? AR(n) + ' صفحات' : AR(n) + ' صفحة'; // ---------- قاعدة البيانات المحلية (للقراءة بدون إنترنت) ---------- let dbp = null; function db() { if (dbp) return dbp; dbp = new Promise((res, rej) => { if (!window.indexedDB) { rej(new Error('no idb')); return; } const q = indexedDB.open('khatm-quran', 1); q.onupgradeneeded = () => q.result.createObjectStore('pages'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); return dbp; } async function idbGet(k) { try { const d = await db(); return await new Promise(res => { const r = d.transaction('pages').objectStore('pages').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); } catch (e) { return undefined; } } async function idbSet(k, v) { try { const d = await db(); d.transaction('pages', 'readwrite').objectStore('pages').put(v, k); } catch (e) {} } async function idbCount() { try { const d = await db(); return await new Promise(res => { const r = d.transaction('pages').objectStore('pages').count(); r.onsuccess = () => res(r.result); r.onerror = () => res(0); }); } catch (e) { return 0; } } // ---------- جلب النص ---------- const mem = new Map(); async function getPage(n) { if (mem.has(n)) return mem.get(n); let p = await idbGet(n); if (!p) { const r = await fetch('
