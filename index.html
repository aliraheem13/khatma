<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ختمة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--fs:30px;--pri:#0f5c4d;--gold:#c9a24b;--bg:#f6f1e7;--card:#fffdf8;--txt:#1d2a26;--mut:#6b7a74;--line:#e4dccb}
[data-theme=dark]{--bg:#12171a;--card:#1b2226;--txt:#e8ece9;--mut:#93a39c;--line:#2b363b;--pri:#1f8a6e}
[data-theme=sepia]{--bg:#efe3c8;--card:#f6ecd5;--txt:#3b2f1b;--mut:#7d6b49;--line:#dccaa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,Tahoma,Arial,sans-serif;padding-bottom:84px;line-height:1.6}
header{background:var(--pri);color:#fff;padding:14px 16px;text-align:center;font-size:20px;font-weight:700;letter-spacing:.5px}
header small{display:block;font-weight:400;font-size:12px;opacity:.85}
.view{display:none;max-width:720px;margin:0 auto;padding:14px}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.center{text-align:center}
h2{margin:0 0 6px;font-size:20px}
.mut{color:var(--mut);font-size:14px}
.hero{background:linear-gradient(135deg,var(--pri),#13795f);color:#fff;border:0;text-align:center}
.hero .lbl{opacity:.85;font-size:14px}
.hero .big{font-size:30px;font-weight:700;margin:6px 0}
.hero .sub{opacity:.9;font-size:14px}
.big{font-size:44px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.gold{background:var(--gold);color:#2a2105}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
.btn.sm{width:auto;margin:0;padding:9px 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=number],input[type=time],input[type=text]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:16px;margin-top:6px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--pri))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}
.rbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.rbar .mid{text-align:center;flex:1;font-size:13px;color:var(--mut)}
.rbar input{width:70px;display:inline-block;text-align:center;margin:0;padding:6px}
.page{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;font-family:'Amiri Quran','Scheherazade New',serif;font-size:var(--fs);line-height:2.35;text-align:justify;min-height:300px}
.page.loading{display:flex;align-items:center;justify-content:center;font-family:Cairo,sans-serif;font-size:16px;color:var(--mut)}
.ayat{margin:0 0 6px}
.sura{margin:14px 0 8px;padding:6px;text-align:center;border:2px solid var(--gold);border-radius:12px;color:var(--pri);font-size:calc(var(--fs) * .85);background:var(--bg)}
.bism{text-align:center;margin-bottom:6px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .2em;border:1.5px solid var(--gold);border-radius:50%;font-family:Cairo,sans-serif;font-size:.5em;line-height:1;vertical-align:middle;color:var(--pri)}
.pnav{display:flex;gap:10px;margin-top:12px}
.pnav .btn{margin:0}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer}
.item .n{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.item .t{flex:1}
.item .t small{display:block;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;padding:9px 0 7px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
#toast{position:fixed;z-index:50;top:12px;left:12px;right:12px;max-width:600px;margin:0 auto;background:#222;color:#fff;border-radius:14px;padding:12px 16px;text-align:center;display:none}
.note{font-size:13px;color:var(--mut);margin-top:8px}
#modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--card);color:var(--txt);border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center}
.mbox p{margin:8px 0 4px;line-height:1.9}
select,input[type=email],input[type=tel]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:16px;margin-top:6px}
body.reg nav{display:none}
nav button{font-size:11px}
.ring{width:min(72vw,290px);aspect-ratio:1;border-radius:50%;margin:14px auto;padding:10px;background:conic-gradient(var(--gold) calc(var(--p,0) * 1%),var(--line) 0)}
.tsb{width:100%;height:100%;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,#1f8a6e,var(--pri));color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tsb:active{transform:scale(.97)}
.tsb span{font-size:64px;font-weight:700;line-height:1.1}
.tsb small{font-size:14px;opacity:.9;margin-top:6px}
.dhikr{font-size:24px;text-align:center;margin:6px 0;font-family:'Amiri Quran',serif;min-height:40px}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.scrollx .chip{white-space:nowrap}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.lnk .t{flex:1}
.lnk .t b{display:block}
.lnk .t small{display:block;color:var(--mut)}
.lnk.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
a.btn{text-decoration:none;text-align:center}
textarea{width:100%;min-height:220px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:'Amiri Quran',serif;font-size:20px;line-height:2;margin-top:8px;direction:rtl}
.lnk .acts{display:flex;gap:6px;flex:none}
.txt{direction:rtl;white-space:pre-wrap;text-align:right;font-family:'Amiri Quran',serif;font-size:var(--fs);line-height:2.2;max-height:60vh;overflow:auto}
.pcard{cursor:pointer;border-color:var(--gold)}
nav button{padding-left:0;padding-right:0}
nav button em{font-size:10px}
select{max-width:100%}

[data-theme=sepia]{--bg:#ebdfbd;--card:#f6ecd2;--txt:#3a2f1c;--mut:#76653f;--line:#d6c48e;--gsoft:rgba(160,120,40,.45)}
body{background:var(--bg) var(--pat-b) 0 0/56px 56px;font-family:Cairo,Tahoma,Arial,sans-serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* الترويسة: لوح لازوردي بزخرفة نجمية وحافة عقود */
header{position:relative;z-index:6;background:var(--pat-g) 0 0/56px 56px,linear-gradient(180deg,var(--lapis),var(--hb));color:var(--gold2);padding:9px 16px 20px;margin-bottom:12px;box-shadow:0 3px 10px rgba(10,26,48,.25)}
header::after{content:'';position:absolute;left:0;right:0;bottom:-11px;height:12px;pointer-events:none;background:radial-gradient(circle at 50% 0,var(--hb) 0 7.5px,var(--gold) 8px 9.5px,transparent 10px) 0 0/20px 12px repeat-x}
.bsm{font-family:'Amiri Quran','Scheherazade New',serif;font-size:17px;line-height:1.8;color:var(--gold2)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
header #lg{width:40px!important;height:40px!important;margin:0!important;vertical-align:initial!important;border-radius:50% 50% 9px 9px!important;border:1.5px solid var(--gold)}
#hT{font-family:'Reem Kufi',Cairo,sans-serif;font-size:31px;font-weight:700;line-height:1.3;background:linear-gradient(180deg,#fff3c4,#d9b25a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header small{color:#b8c9de;opacity:1;font-size:12.5px;margin-top:1px}

/* البطاقات: إطار مزدوج كحواف الكاشي */
.card{border-radius:12px;border:1px solid var(--gsoft);padding:20px 18px;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px rgba(195,154,62,.24),0 2px 10px rgba(15,45,82,.07)}
h2{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:19px;color:var(--lapis2)}
[data-theme=dark] h2{color:var(--gold2)}
.card h2::before{content:'';display:inline-block;width:15px;height:15px;margin-inline-end:8px;vertical-align:-2px;background:var(--star) center/contain no-repeat}
.mut{color:var(--mut)}

/* ورد اليوم: محراب */
.hero{position:relative;background:var(--pat-g) 0 0/56px 56px,linear-gradient(165deg,#0d2a4e 0%,#14506b 62%,#1a6f80 100%);border:0;border-radius:50% 50% 12px 12px/64px 64px 12px 12px;padding:38px 20px 20px;box-shadow:inset 0 0 0 2px rgba(236,209,131,.85),0 8px 20px rgba(15,45,82,.28)}
.hero::before{content:'';position:absolute;inset:7px;border:1px solid rgba(236,209,131,.35);border-radius:inherit;pointer-events:none}
.hero .lbl{color:var(--gold2);opacity:1;font-family:'Reem Kufi',Cairo,sans-serif;font-size:15px}
.hero .big{font-family:'Reem Kufi',Cairo,sans-serif;color:#fff6d6;font-weight:700}
.hero .sub{color:#d6e2ef;opacity:1}

/* الأزرار */
.btn{border-radius:10px;background:var(--pri);background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 80%,#fff),var(--pri));border:1px solid rgba(236,209,131,.6);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.gold{background:linear-gradient(180deg,#f1d98f,#c9a24b);color:#2a1d02;border-color:#9b7623;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--gsoft);box-shadow:none}
.hero .btn.ghost{color:#fff6d6;border-color:rgba(236,209,131,.6)}
.chip,.seg button{border-radius:9px;border-color:var(--gsoft)}
.chip.on,.seg button.on{background:var(--pri);color:#fff;border-color:var(--gold)}
input[type=number],input[type=time],input[type=text],input[type=email],input[type=tel],select,textarea{border-radius:9px;border-color:var(--gsoft)}
.bar{height:11px;border:1px solid var(--gsoft);background:var(--bg)}
.bar>div{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat{border:1px solid var(--line);border-radius:10px}
.stat b{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--lapis2)}
[data-theme=dark] .stat b{color:var(--gold2)}
.lnk,.item{border-radius:10px;border-color:var(--line)}
.lnk.today{border-color:var(--gold)}
.item .n{width:42px;height:42px;border:0;border-radius:0;background:linear-gradient(135deg,#f1d98f,#c39a3e);color:#2a1d02;font-weight:700;clip-path:polygon(50.0% 0.0%, 65.3% 13.0%, 85.4% 14.6%, 87.0% 34.7%, 100.0% 50.0%, 87.0% 65.3%, 85.4% 85.4%, 65.3% 87.0%, 50.0% 100.0%, 34.7% 87.0%, 14.6% 85.4%, 13.0% 65.3%, 0.0% 50.0%, 13.0% 34.7%, 14.6% 14.6%, 34.7% 13.0%)}
.pcard{border-color:var(--gold)}
.pcard .big{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--lapis2)}
[data-theme=dark] .pcard .big{color:var(--gold2)}

/* المصحف: إطار مزدوج وعنوان السورة */
.page{border:1px solid var(--gold);border-radius:6px;padding:26px 22px;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--gsoft),inset 0 0 0 9px var(--card),inset 0 0 0 10px rgba(195,154,62,.25)}
.sura{font-family:'Amiri Quran','Scheherazade New',serif;background:linear-gradient(180deg,var(--lapis),#14506b);color:var(--gold2);border:1px solid var(--gold);border-radius:6px;padding:8px 6px;box-shadow:inset 0 0 0 3px #0f2d52,inset 0 0 0 4px rgba(236,209,131,.5)}
.sura::before{content:'\FD3E\00A0'}
.sura::after{content:'\00A0\FD3F'}
.num{border:1.5px solid var(--gold);background:radial-gradient(circle,#fff9e3,#f0dca0);color:var(--lapis)}
[data-theme=dark] .num{background:#18294a;color:var(--gold2)}

/* السبحة */
.tsb{background:var(--pat-g) 0 0/44px 44px,radial-gradient(circle at 30% 25%,#1f8397,#0f2d52);box-shadow:inset 0 0 0 3px rgba(236,209,131,.6),0 10px 26px rgba(15,45,82,.38)}
.tsb span{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--gold2)}
.tsb small{color:#d6e2ef}
.dhikr{color:var(--lapis2)}
[data-theme=dark] .dhikr{color:var(--gold2)}

/* الشريط السفلي */
nav{background:linear-gradient(180deg,var(--hb),var(--lapis));border-top:2px solid var(--gold);box-shadow:0 -4px 14px rgba(10,26,48,.22)}
nav button{position:relative;color:#9db3cc;padding:8px 0 6px}
nav button span{display:flex;justify-content:center;height:24px;font-size:0}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button em{font-size:10.5px}
nav button.on{color:var(--gold2)}
nav button.on::before{content:'';position:absolute;top:-2px;left:26%;right:26%;height:3px;background:var(--gold2);border-radius:0 0 3px 3px}

input[type=checkbox]{accent-color:var(--pri);width:20px;height:20px}
/* نافذة التنبيه والرسائل */
.mbox{border-radius:14px;border:1px solid var(--gold);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--gsoft)}
#toast{background:var(--lapis);color:#fff6d6;border:1px solid var(--gold)}
</style>
</head>

  <button data-v="read"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.2C9.8 4.6 6.6 4.1 3.5 4.7v13.1c3.1-.6 6.3-.1 8.5 1.5 2.2-1.6 5.4-2.1 8.5-1.5V4.7c-3.1-.6-6.3-.1-8.5 1.5z"/><path d="M12 6.2v13.1"/></svg></span><em data-k="المصحف" style="font-style:normal">المصحف</em></button>
  <button data-v="index"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.6" cy="7" r="1.1"/><circle cx="4.6" cy="12" r="1.1"/><circle cx="4.6" cy="17" r="1.1"/></svg></span><em data-k="الفهرس" style="font-style:normal">الفهرس</em></button>
  <button data-v="pray"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.6l8-3.9 8 3.9v9.2l-8 3.9-8-3.9z"/><path d="M4 8.6l8 3.9 8-3.9M12 12.5v9.2"/><path d="M4 11.4l8 3.9 8-3.9" stroke-opacity=".55"/></svg></span><em data-k="الصلاة" style="font-style:normal">الصلاة</em></button>
  <button data-v="tsb"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="1.3"/><circle cx="7.4" cy="10.9" r="1.3"/><circle cx="16.6" cy="10.9" r="1.3"/><circle cx="5.6" cy="15.5" r="1.3"/><circle cx="18.4" cy="15.5" r="1.3"/><circle cx="12" cy="4.6" r="1.3"/><path d="M8.4 6.6A8 8 0 0 0 5 9M15.6 6.6A8 8 0 0 1 19 9" stroke-opacity=".0"/><path d="M12 17.5v4M10.6 19.5h2.8"/></svg></span><em data-k="التسبيح" style="font-style:normal">التسبيح</em></button>
  <button data-v="duas"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20.5v-6.8h14v6.8M3 20.5h18"/><path d="M7 13.7c0-3.6 2.4-5.6 5-7.4 2.6 1.8 5 3.8 5 7.4"/><path d="M12 6.3V3.3M11 4.6h2"/></svg></span><em data-k="الأدعية" style="font-style:normal">الأدعية</em></button>
  <button data-v="set"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-opacity=".0"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></svg></span><em data-k="الإعدادات" style="font-style:normal">الإعدادات</em></button>
</nav>

<script>
const $ = id => document.getElementById(id);
const AR = n => Number(n).toLocaleString(st.lang === 'en' ? 'en-US' : 'ar-EG');
const TOTAL = 604;
const ICON = (document.querySelector('link[rel=icon]') || {}).href || '';
const NUDGE_AR = 'لا تدع الدنيا تلهيك، هيّا لنكمل قراءة القرآن 🌙';
const NUDGE = () => (st.lang === 'en' ? EN[NUDGE_AR] : NUDGE_AR);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nudge = () => (st.profile && st.profile.name ? st.profile.name + tl('، ') : '') + NUDGE();
const JUZ = [1,22,42,62,82,102,121,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];

// ---------- التخزين ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const DEF = { plan: null, done: 0, todayDate: '', todayStart: 0, todayDone: false, todayRead: 0, todayDeferred: false, streak: 0, lastDate: '', khatmat: 0, last: 1, fs: 30, theme: 'light', remind: { on: false, time: '20:00' }, notifDate: '', profile: null, lang: 'ar', tsb: { mode: 'free', i: 0, count: 0, target: 33, phase: 0, rounds: 0, day: '', today: 0, total: 0, custom: '' } };
let st = Object.assign({}, DEF, LS.get('khatm_state', {}));
st.remind = Object.assign({}, DEF.remind, st.remind || {});
st.tsb = Object.assign({}, DEF.tsb, st.tsb || {});
if (st.todayRead < st.todayStart) st.todayRead = st.todayStart;
const save = () => { LS.set('khatm_state', st); if (typeof pushSyncSoon === 'function') pushSyncSoon(); };

// ---------- التاريخ ----------
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
const pagesTxt = n => n === 1 ? tl('صفحة واحدة') : n === 2 ? tl('صفحتان') : n <= 10 ? AR(n) + tl(' صفحات') : AR(n) + tl(' صفحة');

// ---------- قاعدة البيانات المحلية (للقراءة بدون إنترنت) ----------
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no idb')); return; }
    const q = indexedDB.open('khatm-quran', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('pages');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
  return dbp;
}
async function idbGet(k) {
  try { const d = await db(); return await new Promise(res => { const r = d.transaction('pages').objectStore('pages').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); }
  catch (e) { return undefined; }
}
async function idbSet(k, v) { try { const d = await db(); d.transaction('pages', 'readwrite').objectStore('pages').put(v, k); } catch (e) {} }
async function idbCount() {
  try { const d = await db(); return await new Promise(res => { const r = d.transaction('pages').objectStore('pages').count(); r.onsuccess = () => res(r.result); r.onerror = () => res(0); }); }
  catch (e) { return 0; }
}

// ---------- جلب النص ----------
const mem = new Map();
async function getPage(n) {
  if (mem.has(n)) return mem.get(n);
  let p = await idbGet(n);
  if (!p) {
    const r = await fetch('https://api.alquran.cloud/v1/page/' + n + '/quran-uthmani');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.code !== 200 || !j.data || !Array.isArray(j.data.ayahs) || !j.data.ayahs.length) throw new Error(tl('بيانات غير صالحة'));
    if (j.data.ayahs.some(a => a.page !== n)) throw new Error(tl('صفحة غير مطابقة'));
    p = j.data.ayahs.map(a => [a.surah.number, a.surah.name, a.numberInSurah, a.text, a.juz]);
    idbSet(n, p);
  }
  mem.set(n, p);
  return p;
}
let BISM = null;
async function getBism() {
  if (BISM) return BISM;
  const p = await getPage(1);
  BISM = p[0][3];
  return BISM;
}
async function getChapters() {
  let c = LS.get('khatm_chapters', null);
  if (c) return c;
  const r = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  c = j.chapters.map(x => ({ n: x.id, name: x.name_arabic, v: x.verses_count, p: x.pages[0], place: x.revelation_place }));
  LS.set('khatm_chapters', c);
  return c;
}

// ---------- أدوات ----------
let toastT;
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = 'none', 5000); }
function applyLook() {
  document.documentElement.setAttribute('data-theme', st.theme);
  document.documentElement.style.setProperty('--fs', st.fs + 'px');
}
function rollover() {
  const t = today();
  if (st.todayDate !== t) {
    if (st.todayRead > st.done) st.done = Math.min(TOTAL, st.todayRead);
    st.todayDate = t; st.todayStart = st.done; st.todayRead = st.done; st.todayDone = false; st.todayDeferred = false; save();
  }
}
const ppd = () => !st.plan ? 0 : (st.plan.ppd || Math.ceil(TOTAL / st.plan.days));
const wirdEnd = () => Math.min(TOTAL, st.todayStart + ppd());

function bumpStreak() {
  const t = today();
  if (st.lastDate !== t) { st.streak = (st.lastDate === yesterday()) ? st.streak + 1 : 1; st.lastDate = t; }
}
function markDone() {
  rollover();
  if (st.todayDone || !st.plan) return;
  st.done = Math.max(st.done, wirdEnd());
  st.todayRead = st.done;
  st.todayDone = true; st.todayDeferred = false;
  bumpStreak();
  if (st.done >= TOTAL) st.khatmat++;
  save();
}
// قرأ جزءاً من الورد وأجّل الباقي: يُحتسب ما قرأه، وغداً يبدأ من الصفحة التالية
function deferRest() {
  rollover();
  if (st.todayDone || !st.plan || st.todayRead <= st.todayStart) return;
  st.done = Math.max(st.done, st.todayRead);
  st.todayDone = true; st.todayDeferred = true;
  bumpStreak();
  if (st.done >= TOTAL) st.khatmat++;
  save();
}
const hasPartial = () => !!(st.plan && !st.todayDone && st.done < TOTAL && st.todayRead > st.todayStart && st.todayRead < wirdEnd());
function askPartial() {
  const total = wirdEnd() - st.todayStart, got = st.todayRead - st.todayStart, rest = total - got;
  const m = $('modal');
  m.innerHTML = '<div class="mbox"><h2>' + esc(nudge()) + tl('</h2><p>قرأت ') + pagesTxt(got) + tl(' من ') + pagesTxt(total) + tl('، وبقي ') + pagesTxt(rest) + tl('.<br>هل تريد إكمالها الآن أم تأجيلها إلى الغد؟</p>') +
    tl('<p class="mut">إذا أجّلتها يُحتسب ما قرأته، ويبدأ ورد الغد من الصفحة التالية.</p>') +
    tl('<button class="btn" id="mNow">إكمال الآن</button><button class="btn gold" id="mTom">إلى الغد</button><button class="btn ghost" id="mLater">ليس الآن</button></div>');
  m.classList.add('on');
  $('mNow').onclick = () => { m.classList.remove('on'); openPage(st.todayRead + 1); };
  $('mTom').onclick = () => { deferRest(); m.classList.remove('on'); go(curView); toast(tl('بارك الله فيك، يبدأ ورد الغد من صفحة ') + AR(Math.min(TOTAL, st.done + 1))); };
  $('mLater').onclick = () => m.classList.remove('on');
}
function openPage(p) { st.last = p; save(); go('read'); }

// ---------- التنقل ----------
let curView = 'wird';
function go(v) {
  const leaving = curView === 'read' && v !== 'read';
  curView = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0, 0);
  if (v === 'wird') renderWird();
  if (v === 'read') renderPage(st.last);
  if (v === 'index') renderIndex();
  if (v === 'set') renderSettings();
  if (v === 'reg') renderReg();
  if (v === 'tsb') renderTasbih();
  if (v === 'duas') renderDuas();
  if (v === 'pray') renderPray();
  if (v !== 'pray' && cmp.on) compassStop();
  document.body.classList.toggle('reg', v === 'reg');
  if (leaving && hasPartial()) askPartial();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));

// ---------- شاشة الورد ----------
let selPages = 5;
function chooserHTML() {
  const opts = [1, 2, 5, 10, 20];
  const first = st.done === 0;
  return '<div class="card"><h2>' + (first ? tl('ابدأ ختمتك') : tl('عدد الصفحات اليومية')) + tl('</h2><p class="mut">اختر كم صفحة تريد أن تقرأ كل يوم، وسنحسب لك مدة الختمة.</p>') +
    '<div class="chips">' + opts.map(d => '<button class="chip' + (d === selPages ? ' on' : '') + '" data-d="' + d + '">' + pagesTxt(d) + '</button>').join('') + '</div>' +
    tl('<label class="mut">أو أدخل عدداً آخر من الصفحات يومياً</label><input id="cd" type="number" min="1" max="604" inputmode="numeric" value="') + selPages + '">' +
    '<p class="mut" id="cp"></p><button class="btn" id="cs">' + (first ? tl('ابدأ الختمة') : tl('حفظ')) + '</button></div>';
}
function bindChooser() {
  const upd = () => {
    const days = Math.ceil(Math.max(1, TOTAL - st.done) / selPages);
    $('cp').textContent = tl('تختم القرآن في ') + (days === 1 ? tl('يوم واحد') : days === 2 ? tl('يومين') : days <= 10 ? AR(days) + tl(' أيام') : AR(days) + tl(' يوماً')) + tl(' تقريباً');
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.d === selPages));
  };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { selPages = +c.dataset.d; $('cd').value = selPages; upd(); });
  $('cd').oninput = () => { const v = parseInt($('cd').value, 10); selPages = isNaN(v) ? 5 : Math.min(604, Math.max(1, v)); upd(); };
  $('cs').onclick = () => { st.plan = { ppd: selPages }; rollover(); if (st.todayRead < st.todayStart) st.todayRead = st.todayStart; save(); renderWird(); };
  upd();
}
function statsHTML() {
  const pc = Math.floor(st.done / TOTAL * 100);
  const sk = (st.lastDate === today() || st.lastDate === yesterday()) ? st.streak : 0;
  let fin = '';
  if (st.plan && st.done < TOTAL) {
    const k = Math.ceil((TOTAL - st.done) / ppd());
    const d = new Date(); d.setDate(d.getDate() + k - (st.todayDone ? 0 : 1));
    fin = tl('<p class="mut">التاريخ المتوقع لإتمام الختمة: <b>') + d.toLocaleDateString(st.lang === 'en' ? 'en-GB' : 'ar', { day: 'numeric', month: 'long', year: 'numeric' }) + '</b></p>';
  }
  return tl('<div class="card"><h2>تقدمك</h2><div class="bar"><div style="width:') + pc + '%"></div></div>' +
    tl('<div class="mut">أتممت ') + AR(st.done) + tl(' من ') + AR(TOTAL) + tl(' صفحة (') + AR(pc) + tl('٪)</div>') + fin +
    '<div class="grid"><div class="stat"><b>' + AR(TOTAL - st.done) + tl('</b><span>صفحة متبقية</span></div>') +
    '<div class="stat"><b>🔥 ' + AR(sk) + tl('</b><span>أيام متتالية</span></div>') +
    '<div class="stat"><b>' + AR(st.khatmat) + tl('</b><span>ختمات مكتملة</span></div>') +
    '<div class="stat"><b>' + (st.plan ? AR(ppd()) : '-') + tl('</b><span>صفحات يومياً</span></div></div></div>');
}
function renderWird() {
  rollover();
  const v = $('v-wird');
  if (!st.plan) { v.innerHTML = chooserHTML(); bindChooser(); return; }
  if (st.done >= TOTAL) {
    v.innerHTML = tl('<div class="card center"><div class="big">🎉</div><h2>تقبّل الله ختمتك</h2><p class="mut">أتممت ختمة كاملة، بارك الله فيك وجعل القرآن ربيع قلبك.</p><button class="btn" id="nk">ابدأ ختمة جديدة</button></div>') + statsHTML();
    $('nk').onclick = () => { st.done = 0; st.todayStart = 0; st.todayRead = 0; st.todayDone = false; st.todayDeferred = false; save(); renderWird(); };
    return;
  }
  const start = st.todayStart + 1, end = wirdEnd(), cnt = end - start + 1;
  let h = '<div class="card hero"><div class="lbl">' + (st.todayDone ? (st.todayDeferred ? tl('أجّلت الباقي إلى الغد') : tl('أتممت ورد اليوم ✓')) : tl('ورد اليوم')) + '</div>';
  h += '<div class="big" style="font-size:30px">' + (start === end ? tl('صفحة ') + AR(start) : tl('من صفحة ') + AR(start) + tl(' إلى ') + AR(end)) + '</div>';
  h += '<div class="sub">' + pagesTxt(cnt) + (hasPartial() ? tl('<br>قرأت ') + pagesTxt(st.todayRead - st.todayStart) + tl('، وبقي ') + pagesTxt(end - st.todayRead) : '') + '<br><span id="wS"></span></div>';
  h += '<button class="btn gold" id="wRead">' + (st.todayDone ? tl('اقرأ ما تيسّر') : hasPartial() ? tl('أكمل من صفحة ') + AR(st.todayRead + 1) : tl('ابدأ القراءة')) + '</button>';
  if (!st.todayDone) h += tl('<button class="btn ghost" id="wDone">أتممت ورد اليوم ✓</button>');
  h += '</div>';
  if (st.todayDone) h += tl('<div class="card center"><p>بارك الله فيك. ورد الغد إن شاء الله يبدأ من صفحة ') + AR(Math.min(TOTAL, st.done + 1)) + '.</p></div>';
  const greet = st.profile ? tl('<div class="mut" style="margin:0 4px 8px">أهلاً بك، <b>') + esc(st.profile.name) + '</b> 🌙</div>' : '';
  const tz = WEEK[new Date().getDay()];
  const zi = tl('<div class="card"><h2>زيارة اليوم - ') + tl(tz[0]) + '</h2><p class="mut">' + esc(tl(tz[1])) + tl('</p><button class="btn ghost" id="wZ">أعمال الأيام والزيارات</button></div>');
  v.innerHTML = greet + prayCardHTML() + h + zi + statsHTML();
  if ($('pcard')) $('pcard').onclick = () => go('pray');
  $('wZ').onclick = () => { duasTab = 'week'; go('duas'); };
  $('wRead').onclick = () => openPage(st.todayDone ? Math.min(TOTAL, st.last) : Math.min(end, Math.max(start, st.todayRead + 1)));
  if ($('wDone')) $('wDone').onclick = () => { markDone(); renderWird(); };
  getPage(start).then(p => { const e = $('wS'); if (e) e.textContent = tl('تبدأ في ') + p[0][1]; }).catch(() => {});
}

// ---------- المصحف ----------
let cur = 1;
async function renderPage(n) {
  n = Math.min(TOTAL, Math.max(1, parseInt(n, 10) || 1));
  cur = n; st.last = n; save();
  $('pgNo').value = n; $('pgTot').textContent = '/ ' + AR(TOTAL);
  const box = $('page'); box.className = 'page loading'; box.textContent = tl('جاري التحميل…');
  $('endcard').innerHTML = '';
  try {
    const [ayahs, bism] = await Promise.all([getPage(n), getBism()]);
    if (cur !== n) return;
    box.className = 'page'; box.textContent = '';
    let p = null;
    const ensureP = () => { if (!p) { p = document.createElement('p'); p.className = 'ayat'; box.appendChild(p); } return p; };
    ayahs.forEach(a => {
      const sn = a[0], num = a[2];
      let t = a[3];
      if (num === 1) {
        const h = document.createElement('div'); h.className = 'sura'; h.textContent = a[1]; box.appendChild(h);
        if (sn !== 1 && sn !== 9) {
          const b = document.createElement('div'); b.className = 'bism'; b.textContent = bism; box.appendChild(b);
          if (t.startsWith(bism)) t = t.slice(bism.length).trim();
        }
        p = null;
      }
      const par = ensureP();
      const s = document.createElement('span'); s.textContent = t + ' ';
      const m = document.createElement('span'); m.className = 'num'; m.textContent = AR(num);
      par.appendChild(s); par.appendChild(m); par.appendChild(document.createTextNode(' '));
    });
    $('meta').textContent = tl('الجزء ') + AR(ayahs[0][4]) + ' • ' + ayahs[0][1].replace('سُورَةُ ', tl('سورة '));
    if (st.plan && !st.todayDone && n > st.todayStart && n <= wirdEnd() && n > st.todayRead) { st.todayRead = n; save(); }
    if (n < TOTAL) getPage(n + 1).catch(() => {});
    if (st.plan && !st.todayDone && st.done < TOTAL && n >= wirdEnd() && n > st.todayStart) {
      $('endcard').innerHTML = tl('<div class="card center"><p>وصلت إلى نهاية ورد اليوم. هل أتممته؟</p><button class="btn" id="ecb">نعم، أتممت الورد ✓</button></div>');
      $('ecb').onclick = () => { markDone(); go('wird'); };
    }
  } catch (e) {
    if (cur !== n) return;
    box.className = 'page loading'; box.textContent = '';
    const d = document.createElement('div'); d.className = 'center';
    d.innerHTML = tl('<p>تعذر تحميل الصفحة. تأكد من الاتصال بالإنترنت.</p><button class="btn sm" id="rt">إعادة المحاولة</button>');
    box.appendChild(d); $('rt').onclick = () => renderPage(n);
  }
}
$('pv').onclick = $('pv2').onclick = () => { if (cur > 1) { renderPage(cur - 1); window.scrollTo(0, 0); } };
$('nx').onclick = $('nx2').onclick = () => { if (cur < TOTAL) { renderPage(cur + 1); window.scrollTo(0, 0); } };
$('pgNo').onchange = () => renderPage($('pgNo').value);
let tx = null;
$('page').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('page').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) < 70) return;
  if (dx > 0 && cur < TOTAL) { renderPage(cur + 1); window.scrollTo(0, 0); }
  if (dx < 0 && cur > 1) { renderPage(cur - 1); window.scrollTo(0, 0); }
}, { passive: true });

function prSun(jd) {

// تُرجع الزمن بالدقائق UTC من بداية يوم (y,m,d) لحدث عند ارتفاع alt (درجات، سالب = تحت الأفق)، dir=-1 صباحاً، +1 مساءً
function prCalc(y, m, d, lat, lon, P) {

  const P = PRAY_METHODS[method] || PRAY_METHODS.jafari;
  adj = adj || {};

  const A = k => (+adj[k] || 0) * 60000;
  const r = {
    fajr: ceilM(align(c.fajr)), sunrise: floorM(align(c.sunrise)), dhuhr: ceilM(align(c.noon)),
    sunset: ceilM(align(c.sunset)), maghrib: ceilM(align(c.maghrib))

}

function downloadICS() {
  const t = st.remind.time.split(':');
  const d = new Date(); d.setHours(+t[0], +t[1], 0, 0);
  const e = new Date(d.getTime() + 15 * 60000);
  const f = x => x.getFullYear() + String(x.getMonth() + 1).padStart(2, '0') + String(x.getDate()).padStart(2, '0') + 'T' + String(x.getHours()).padStart(2, '0') + String(x.getMinutes()).padStart(2, '0') + '00';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Khatm//AR', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:khatm-wird-daily@local', 'DTSTAMP:' + stamp,
    'DTSTART:' + f(d), 'DTEND:' + f(e), 'RRULE:FREQ=DAILY', tl('SUMMARY:ختمة - ورد القرآن اليومي'), 'DESCRIPTION:' + NUDGE(),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + NUDGE(), 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'khatm-reminder.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

async function downloadAll() {
  const btn = $('dl'); btn.disabled = true;
  const todo = [];
  for (let i = 1; i <= TOTAL; i++) { if (!(await idbGet(i))) todo.push(i); }
  const total = todo.length; let n = 0, fail = 0;
  const w = async () => {
    while (todo.length) {
      const i = todo.shift();
      try { await getPage(i); } catch (e) { fail++; }
      n++; $('dls').textContent = tl('جاري التحميل: ') + AR(n) + ' / ' + AR(total);
    }
  };
  await Promise.all([w(), w(), w(), w()]);
  btn.disabled = false;
  $('dls').textContent = fail ? tl('تعذر تحميل ') + AR(fail) + tl(' صفحة، أعد المحاولة.') : tl('تم تحميل المصحف كاملاً ✓');
}

const ADHKAR = [

  ['أستغفر الله ربي وأتوب إليه', 100], ['لا حول ولا قوة إلا بالله', 100],

  ['سبحان الله والحمد لله ولا إله إلا الله والله أكبر', 33]
];
const ZAHRA = [['الله أكبر', 34], ['الحمد لله', 33], ['سبحان الله', 33]];
let hapEl = null;
function hapTick() {
  try {
    if (!hapEl) {
      hapEl = document.createElement('label'); hapEl.setAttribute('aria-hidden', 'true');
      hapEl.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); hapEl.appendChild(i); document.body.appendChild(hapEl);
    }
    hapEl.click();
  } catch (e) {}
}
// اهتزاز: أندرويد عبر navigator.vibrate، والآيفون عبر نقرة لمس (haptic) لأن Safari لا يدعم vibrate
const buzz = x => {
  try {
    if (navigator.vibrate) { navigator.vibrate(x); return; }
    const p = Array.isArray(x) ? x : [x]; let t = 0;
    p.forEach((ms, i) => { if (i % 2 === 0) { setTimeout(hapTick, t); if (ms >= 100) setTimeout(hapTick, t + Math.min(ms, 400) / 2); } t += ms; });
  } catch (e) {}
};
function doneChime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume();
    [[0, 659.25], [0.18, 880]].forEach(x => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + x[0];
      o.type = 'sine'; o.frequency.value = x[1]; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.65);
    });
  } catch (e) {}
}
// عند إكمال الذكر: اهتزاز الجهاز كاملاً (أندرويد). الآيفون لا يسمح بالاهتزاز الحقيقي من المواقع، فنستعمل نقرات لمس متتابعة مع نغمة قصيرة
const buzzDone = () => {
  buzz([250, 90, 250, 90, 450]);
  if (!navigator.vibrate) { [0, 130, 260, 390, 520, 650].forEach(ms => setTimeout(hapTick, ms)); }
  if (st.tsb.snd !== false) doneChime();
};
function tsbCur() {
  const t = st.tsb;
  if (t.mode === 'zahra') return { text: ZAHRA[t.phase][0], target: ZAHRA[t.phase][1] };
  if (t.i === -1) return { text: t.custom || tl('ذكر مخصص'), target: t.target };
  return { text: ADHKAR[t.i][0], target: t.target };
}
function tsbTap() {
  const t = st.tsb, d = today();
  if (t.day !== d) { t.day = d; t.today = 0; }
  t.count++; t.today++; t.total++;
  buzz(12);
  const c = tsbCur();
  if (c.target > 0 && t.count >= c.target) {
    buzzDone();
    if (t.mode === 'zahra') {
      if (t.phase < 2) { t.phase++; t.count = 0; toast(tl('انتقل إلى: ') + ZAHRA[t.phase][0]); }
      else { t.phase = 0; t.count = 0; t.rounds++; toast(tl('تقبّل الله، أتممت تسبيح الزهراء (ع) 🤍')); }
    } else { t.count = 0; t.rounds++; toast(tl('أتممت ') + AR(c.target) + ' ✓'); }
  }
  save(); tsbUpdate();
}
function tsbUpdate() {
  if (!$('tsbN')) return;
  const t = st.tsb, c = tsbCur();
  $('tsbN').textContent = AR(t.count);
  $('tsbT').textContent = c.target > 0 ? tl('من ') + AR(c.target) : tl('بدون حد');
  $('tsbD').textContent = dk(c.text);
  $('tsbR').style.setProperty('--p', c.target > 0 ? Math.min(100, t.count / c.target * 100) : 0);
  $('tsbS').textContent = tl('اليوم: ') + AR(t.day === today() ? t.today : 0) + tl('  •  الدورات: ') + AR(t.rounds) + tl('  •  المجموع: ') + AR(t.total);
}
function renderTasbih() {
  const t = st.tsb, v = $('v-tsb');
  v.innerHTML = '<div class="seg"><button data-m="free" class="' + (t.mode === 'free' ? 'on' : '') + tl('">تسبيح حر</button><button data-m="zahra" class="') + (t.mode === 'zahra' ? 'on' : '') + tl('">تسبيح الزهراء (ع)</button></div>') +
    '<div class="card center"><div class="dhikr" id="tsbD"></div>' +
    tl('<div class="ring" id="tsbR"><button class="tsb" id="tsbB"><span id="tsbN">٠</span><small id="tsbT"></small></button></div>') +
    tl('<div class="row" style="justify-content:center"><button class="btn sm ghost" id="tsbU">تراجع</button><button class="btn sm ghost" id="tsbZ">تصفير</button></div>') +
    '<p class="mut" id="tsbS"></p><div class="row"><span>' + PT('نغمة واهتزاز عند إكمال الذكر', 'Sound & vibration when a dhikr completes') + '</span><input type="checkbox" id="tsbSnd"' + (t.snd !== false ? ' checked' : '') + '></div></div>' +
    (t.mode === 'free'
      ? tl('<div class="card"><h2>الأذكار</h2><div class="scrollx" id="adk"></div>') +
        tl('<label class="mut">الهدف (عدد التسبيحات)</label><div class="scrollx" id="tgt"></div>') +
        tl('<input id="tgi" type="number" min="0" max="100000" inputmode="numeric" placeholder="أو اكتب عدداً آخر (٠ = بدون حد)">') +
        tl('<label class="mut">أو اكتب ذكرك الخاص</label><input id="cus" type="text" maxlength="60" placeholder="اكتب الذكر هنا"></div>')
      : tl('<div class="card"><p class="note">تسبيح الزهراء (ع): الله أكبر ٣٤، ثم الحمد لله ٣٣، ثم سبحان الله ٣٣. ينتقل العداد تلقائياً من ذكر لآخر.</p></div>'));
  v.querySelectorAll('.seg button').forEach(b => b.onclick = () => { t.mode = b.dataset.m; t.count = 0; t.phase = 0; save(); renderTasbih(); });
  $('tsbB').onclick = tsbTap;
  $('tsbSnd').onchange = e => { t.snd = e.target.checked; save(); };
  $('tsbU').onclick = () => { if (t.count > 0) { t.count--; if (t.day === today() && t.today > 0) t.today--; if (t.total > 0) t.total--; save(); tsbUpdate(); } };
  $('tsbZ').onclick = () => { t.count = 0; t.phase = 0; save(); tsbUpdate(); };
  if (t.mode === 'free') {
    ADHKAR.forEach((a, i) => {
      const b = document.createElement('button'); b.className = 'chip' + (t.i === i ? ' on' : ''); b.textContent = dk(a[0]);
      b.onclick = () => { t.i = i; t.target = a[1]; t.count = 0; save(); renderTasbih(); };
      $('adk').appendChild(b);
    });
    [33, 34, 100, 500, 1000, 0].forEach(n => {
      const b = document.createElement('button'); b.className = 'chip' + (t.target === n ? ' on' : ''); b.textContent = n ? AR(n) : tl('بدون حد');
      b.onclick = () => { t.target = n; t.count = 0; save(); renderTasbih(); };
      $('tgt').appendChild(b);
    });
    $('tgi').onchange = () => { const n = parseInt($('tgi').value, 10); if (!isNaN(n) && n >= 0) { t.target = n; t.count = 0; save(); renderTasbih(); } };
    $('cus').value = t.i === -1 ? t.custom : '';

  }
  tsbUpdate();
}

  "دعاء يوم الأحد": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ بِسْمِ اللَّهِ الَّذِي لا أَرْجُو إِلاَّ فَضْلَهُ، وَلا أَخْشَى إِلاَّ عَدْلَهُ، وَلا أْتَمِنُ إِلاَّ قَوْلَهُ، وَلا أُمْسِكُ إِلاَّ بِحَبْلِهِ. بِكَ أُعِيذُ يَا ذَا المَنِّ وَالطَّوْلِ مِنْ نَفْسِي وَمَالِي، وَمِنْ شَرِّ كُلِّ ذِي شَرٍّ أُعْذِرُهُ وَمَنْ لا أُعْذِرُهُ، يَا حَيُّ يَا قَيُّومُ، يَا مُحْيِيَ المَوْتَى وَمُمِيتَ الأَحْياءِ، يَا حَيُّ لا إِلَهَ إِلاَّ أَنْتَ، صَلِّ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَارْحَمْنِي وَاسْتَجِبْ لِي، وَعَجِّلْ فَرَجِي يَا كَرِيمُ.",
  "دعاء يوم الاثنين": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الحَمْدُ لِلَّهِ الَّذِي لَمْ يُشْهِدْ أَحَداً حِينَ فَطَرَ السَّمَاوَاتِ وَالأَرْضَ، وَلا اتَّخَذَ مُعِيناً حِينَ بَرَأَ النَّسَمَاتِ، لَمْ يُشارَكْ فِي الإِلَهِيَّةِ، وَلَمْ يُظَاهَرْ فِي الوَحْدَانِيَّةِ، كَلَّتِ الأَلْسُنُ عَنْ غَايَةِ صِفَتِهِ، وَالعُقُولُ عَنْ كُنْهِ مَعْرِفَتِهِ، وَتَوَاضَعَتِ الجَبَابِرَةُ لِهَيْبَتِهِ، وَعَنَتِ الوُجُوهُ لِخَشْيَتِهِ، وَانْقَادَ كُلُّ عَظِيمٍ لِعَظَمَتِهِ، فَلَكَ الحَمْدُ مُتَواتِراً مُتَّسِقاً، وَسَلامُكَ عَلَى رَسُولِهِ أَبَداً دَائِماً. اللَّهُمَّ اجْعَلْ أَوَّلَ يَوْمِي هَذَا صَلاحاً، وَأَوْسَطَهُ فَلاحاً، وَآخِرَهُ نَجاحاً، وَأَعُوذُ بِكَ مِنْ يَوْمٍ أَوَّلُهُ فَزَعٌ، وَأَوْسَطُهُ جَزَعٌ، وَآخِرُهُ وَجَعٌ. اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ نَذْرٍ نَذَرْتُهُ وَكُلِّ وَعْدٍ وَعَدْتُهُ، وَكُلِّ عَهْدٍ عَاهَدْتُهُ ثُمَّ لَمْ أَفِ بِهِ لَكَ، وَأَسْأَلُكَ فِي مَظَالِمِ عِبَادِكَ عِنْدِي، فَأَيُّمَا عَبْدٍ مِنْ عَبِيدِكَ أَوْ أَمَةٍ مِنْ إِمَائِكَ كانَتْ لَهُ قِبَلِي مَظْلِمَةٌ ظَلَمْتُهَا إِيَّاهُ فِي نَفْسِهِ أَوْ فِي عِرْضِهِ أَوْ فِي مَالِهِ أَوْ فِي أَهْلِهِ وَوَلَدِهِ... فَلَمْ أَسْتَطِعْ رَدَّهَا إِلَيْهِ وَلا اسْتِحْلَالَهُ مِنْهَا، فَأَسْأَلُكَ يَا مَنْ يَمْلِكُ الحَاجَاتِ وَهِيَ مُسْتَجِيبَةٌ لِمَشِيَّتِهِ وَعَاجِلَةٌ لِإِرَادَتِهِ أَنْ تُصَلِّيَ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَأَنْ تُرْضِيَهُ عَنِّي بِمَا شِئْتَ، وَتَهَبَ لِي مِنْ لَدُنْكَ رَحْمَةً، إِنَّكَ لا تَنْقُصُكَ المَغْفِرَةُ وَلا تَضُرُّكَ المَوْهِبَةُ، يَا أَرْحَمَ الرَّاحِمِينَ.",
  "دعاء يوم الثلاثاء": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الحَمْدُ لِلَّهِ وَالحَمْدُ حَقُّهُ كَمَا يَسْتَحِقُّهُ، حَمْداً كَثِيراً، وَأَعُوذُ بِهِ مِنْ شَرِّ نَفْسِي، إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلاَّ مَا رَحِمَ رَبِّي. وَأَعُوذُ بِهِ مِنْ شَرِّ الشَّيْطَانِ الَّذِي يَزِيدُنِي ذَنْباً إِلَى ذَنْبِي، وَأَحْتَرِزُ بِهِ مِنْ كُلِّ جَبَّارٍ فَاجِرٍ، وَسُلْطَانٍ جَائِرٍ، وَعَدُوٍّ قَاهِرٍ. اللَّهُمَّ اجْعَلْنِي مِنْ جُنْدِكَ فَإِنَّ جُنْدَكَ هُمُ الغَالِبُونَ، وَاجْعَلْنِي مِنْ حِزْبِكَ فَإِنَّ حِزْبَكَ هُمُ المُفْلِحُونَ، وَاجْعَلْنِي مِنْ أَوْلِيَائِكَ فَإِنَّ أَوْلِيَاءَكَ لا خَوْفٌ عَلَيْهِمْ وَلا هُمْ يَحْزَنُونَ. اللَّهُمَّ أَصْلِحْ لِي دِينِي فَإِنَّهُ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي آخِرَتِي فَإِنَّهَا دَارُ مَقَرِّي، وَإِلَيْهَا مِنْ مُجَاوَرَةِ اللِّئَامِ مَفَرِّي، وَاجْعَلِ الحَياةَ زِيادَةً لِي فِي كُلِّ خَيْرٍ، وَالمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ.",
  "دعاء يوم الأربعاء": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الحَمْدُ لِلَّهِ الَّذِي جَعَلَ اللَّيْلَ لِبَاساً وَالنَّوْمَ سُبَاتاً، وَجَعَلَ النَّهَارَ نُشُوراً. لَكَ الحَمْدُ أَنْ بَعَثْتَنِي مِنْ مَرْقَدِي وَلَوْ شِئْتَ جَعَلْتَهُ سَرْمَداً، حَمْداً دائِماً لا يَنْقَطِعُ أَبَداً وَلا يُحْصِي لَهُ الخَلائِقُ عَدَداً. اللَّهُمَّ لَكَ الحَمْدُ أَنْ خَلَقْتَ فَسَوَّيْتَ، وَقَدَّرْتَ وَقَضَيْتَ، وَأَمَتَّ وَأَحْيَيْتَ، وَأَمْرَضْتَ وَشَفَيْتَ، وَعَافَيْتَ وَأَبْلَيْتَ، وَعَلَى العَرْشِ اسْتَوَيْتَ وَعَلَى المُلْكِ احْتَوَيْتَ. أَدْعُوكَ دُعَاءَ مَنْ ضَعُفَتْ وَسِيلَتُهُ، وَانْقَطَعَتْ حِيلَتُهُ، وَاقْتَرَبَ أَجَلُهُ، وَتَدَانَى فِي الدُّنْيَا أَمَلُهُ، وَاشْتَدَّتْ إِلَى رَحْمَتِكَ فَاقْرَتُهُ، وَعَظُمَتْ لِتَفْرِيطِهِ حَسْرَتُهُ، وَكَثُرَتْ زَلَّتُهُ وَعَثْرَتُهُ، وَخَلَصَتْ لِوَجْهِكَ تَوْبَتُهُ. فَصَلِّ عَلَى مُحَمَّدٍ خَاتَمِ النَّبِيِّينَ وَعَلَى أَهْلِ بَيْتِهِ الطَّاهِرِينَ، وَارْزُقْنِي شَفَاعَةَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ، وَلا تَحْرِمْنِي صُحْبَتَهُ، إِنَّكَ أَنْتَ أَرْحَمُ الرَّاحِمِينَ.",
  "دعاء يوم الخميس": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ اللَّهُمَّ إِنِّي أَسْأَلُكَ فِي يَوْمِ الخَمِيسِ بَطْناً طَيِّباً، وَظَهْراً نَقِيّاً، وَقَلْباً خَاشِعاً، وَعِلْماً نَافِعاً، وَيَقِيناً صَادِقاً، وَرِزْقاً حَلالاً طَيِّباً. اللَّهُمَّ يا دائِمَ الفَضْلِ، يا جَزِيلَ العَطَاءِ، يا باسِطَ اليَدَيْنِ بِالعَطِيَّاتِ، صَلِّ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ خَيْرِ الوَرَى سَجِيَّةً، وَاغْفِرْ لَنَا يَا ذَا العُلَى فِي هَذِهِ العَشِيَّةِ. إِلَهِي أَسْأَلُكَ التُّقَى وَالهُدَى وَالعَفَافَ وَالغِنَى، وَالعَمَلَ بِمَا تُحِبُّ وَتَرْضَى.",
  "دعاء يوم الجمعة": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الحَمْدُ لِلَّهِ الأَوَّلِ قَبْلَ الإِنشاءِ وَالإِحْياءِ، وَالآخِرِ بَعْدَ فَنَاءِ الأَشْياءِ، العَلِيمِ الَّذِي لا يَنْسَى مَنْ ذَكَرَهُ، وَلا يَنْقُصُ مَنْ شَكَرَهُ، وَلا يَخِيبُ مَنْ دَعَاهُ. اللَّهُمَّ إِنِّي أُشْهِدُكَ وَكَفَى بِكَ شَهِيداً، وَأُشْهِدُ مَلائِكَتَكَ وَسُكَّانَ سَمَاوَاتِكَ... أَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لا شَرِيكَ لَكَ. اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَنَبِيِّكَ وَأَمِينِكَ عَلَى وَحْيِكَ، أَفْضَلَ مَا صَلَّيْتَ وَبارَكْتَ وَرَحِمْتَ عَلَى أَحَدٍ مِنْ خَلْقِكَ. اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاةِ القَائِمَةِ، آتِ مُحَمَّداً الوَسِيلَةَ وَالفَضِيلَةَ وَالدَّرَجَةَ الرَّفِيعَةَ، وَابْعَثْهُ مَقْحَماً مَحْمُوداً الَّذِي وَعَدْتَهُ.",
  "دعاء الفرج": "اللَّهُمَّ كُنْ لِوَلِيِّكَ الحُجَّةِ بْنِ الحَسَنِ صَلَوَاتُكَ عَلَيْهِ وَعَلَى آبَائِهِ، فِي هَذِهِ السَّاعَةِ وَفِي كُلِّ سَاعَةٍ، وَلِيّاً وَحَافِظاً، وَقَائِداً وَنَاصِراً، وَدَلِيلًا وَعَيْناً، حَتَّى تُسْكِنَهُ أَرْضَكَ طَوْعاً وَتُمَتِّعَهُ فِيهَا طَوِيلاً، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.",
  'دعاء القبور': "عن أمير المؤمنين ـ عليه السلام ـ تقول عند زيارة المقبرة :\nاَلسَّلامُ عَلَى أَهْلِ لَا إِلَهَ إِلَّا اللهُ ، مِنْ أَهْلِ لَا إِلَهَ إِلَّا اللهُ ، يَا أَهْلَ لَا إِلَهَ إِلَّا اللهُ !.. كَيْفَ وَجَدتُّمْ كَلِمَةَ لَا إِلَهَ إِلَّا اللهُ ؟ . . يَا لَا إِلَهَ إِلَّا اللهُ ! . . بِحَقِّ لَا إِلَهَ إِلَّا اللهُ اِغْفِرْ لِمَنْ قَالَ : لَا إِلَهَ إلَّا اللهُ ، وَاحْشِرْنَا فِي زُمْرَةِ مَنْ قَالَ : لَا إِلَهَ إِلَّا اللهُ مُحَمَّدٌ رَسُولُ اللهِ عَلِيٌّ وَّلِيُّ اللهِ .\n\nرواية اخرى عن الإمام الصادق ـ عليه السلام ـ :\nاَلسَّلامُ عَلَى أَهْلِ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ ، أَنْتُمْ لَنَا فَرَطٌ وَنَحْنُ إِنْ شَاءَ اللهُ بِكُمْ لَاحِقُونَ .",
  'دعاء الجوشن الكبير': "هذا الدعاء يحتوي على مائة فصل وكلّ فصل يحتوي على عشرة أسماء من أسماء الله تعالى، وتقول في آخر كلّ فصل: سُبحانَكَ يا لا إلهَ إلاّ أنتَ، الغَوثَ الغَوثَ الغَوثَ، خَلِّصنا مِنَ النّارِ يا رَبِّ.\n\nوهو هذا الدّعاء:\n\n(1) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا اللهُ، يا رَحمنُ، يا رَحيمُ، يا كَريمُ، يا مُقيمُ، يا عَظيمُ، يا قَديمُ، يا عَليمُ، يا حَليمُ، يا حَكيمُ، سُبحانَكَ، يا لا إلهَ إلاّ أنتَ، الغَوثَ الغَوثَ الغَوثَ، خَلِّصنا مِنَ النّارِ، يا رَبِّ.\n\n(2) يا سَيِّدَ السّاداتِ، يا مُجيبَ الدَّعَواتِ، يا رافعَ الدَّرَجاتِ، يا وَليَّ الحَسَناتِ، يا غافِرَ الخَطيئاتِ، يا مُعطيَ المَسألاتِ، يا قابِلَ التَّوباتِ، يا سامعَ الأصواتِ، يا عالِمَ الخَفياتِ، يا دافعَ البَلياتِ.\n\n(3) يا خَيرَ الغافِرينَ، يا خَيرَ الفاتِحينَ، يا خَيرَ النّاصِرينَ، يا خَيرَ الحاكِمينَ، يا خَيرَ الرّازِقينَ، يا خَيرَ الوارِثينَ، يا خَيرَ الحامِدينَ، يا خَيرَ الذَّاكِرينَ، يا خَيرَ المُنزِلينَ، يا خَيرَ المُحسِنينَ.\n\n(4) يا مَن لَهُ العِزَّةُ وَالجَمالُ، يا مَن لَهُ القُدرَةُ وَالكَمالُ، يا مَن لَهُ المُلكُ وَالجَلالُ، يا مَن هُوَ الكَبيرُ المُتَعالِ، يا مُنشئَ السَّحابِ الثِّقالِ، يا مَن هُوَ شَديدُ المِحالِ، يا مَن هُوَ سَريعُ الحِسابِ، يا مَن هُوَ شَديدُ العِقابِ، يا مَن عِندَهُ حُسنُ الثَّوابِ، يا مَن عِندَهُ اُمُّ الكِتابِ.\n\n(5) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا حَنَّانُ، يا مَنَّانُ، يا دَيانُ، يا بُرهانُ، يا سُلطانُ، يا رِضوانُ، يا غُفرانُ، يا سُبحانُ، يا مُستَعانُ، يا ذا المَنِّ وَالبَيانِ.\n\n(6) يا مَن تَواضَعَ كُلُّ شيءٍ لِعَظَمَتِهِ، يا مَن استسلّم كُلُّ شيءٍ لِقُدرَتِهِ، يا مَن ذَلَّ كُلُّ شيءٍ لِعِزَّتِهِ، يا مَن خَضَعَ كُلُّ شيءٍ لِهَيبَتِهِ، يا مَن انقادَ كُلُّ شيءٍ مِن خَشيَتِهِ، يا مَن تَشَقَّقَتِ الجِبالُ مِن مَخافَتِهِ، يا مَن قامَتِ السَّماواتُ بِأمرِهِ، يا مَن استَقَرَّتِ الأرَضونَ بِإذنِهِ، يا مَن يُسَبِّحُ الرَّعدُ بِحَمدِهِ، يا مَن لا يَعتَدي عَلى أهلِ مَملَكَتِهِ.\n\n(7) يا غافِرَ الخطايا، يا كاشِفَ البَلايا، يا مُنتَهى الرَّجايا، يا مُجزِلَ العَطايا، يا واهِبَ الهَدايا، يا رازِقَ البَرايا، يا قاضيَ المَنايا، يا سامِعَ الشَّكايا، يا باعِثَ البَرايا، يا مُطلِقَ الاُسارى.\n\n(8) يا ذا الحَمدِ وَالثَّناءِ، يا ذا الفَخرِ وَالبَهاءِ، يا ذا المَجدِ وَالسَّناءِ، يا ذا العَهدِ وَالوَفاءِ، يا ذا العَفوِ وَالرِّضاءِ، يا ذا المَنِّ وَالعَطاءِ، يا ذا الفَصلِ وَالقَضاءِ، يا ذا العِزِّ وَالبَقاءِ، يا ذا الجودِ وَالسَّخاءِ، يا ذا الآلاء وَالنَّعماءِ.\n\n(9) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا مانِعُ، يا دافِعُ، يا رافِعُ، يا صانِعُ، يا نافِعُ، يا سامِعُ، يا جامِعُ، يا شافِعُ، يا واسِعُ، يا موسِعُ.\n\n(10) يا صانِعَ كُلِّ مَصنوعٍ، يا خالِقَ كُلِّ مَخلوقٍ، يا رازِقَ كُلِّ مَرزوقٍ، يا مالِكَ كُلِّ مَملوكٍ، يا كاشِفَ كُلِّ مَكروبٍ، يا فارِجَ كُلِّ مَهمومٍ، يا راحِمَ كُلِّ مَرحومٍ، يا ناصِرَ كُلِّ مَخذولٍ، يا ساتِرَ كُلِّ مَعيوبٍ، يا مَلجَأَ كُلِّ مَطرودٍ.\n\n(11) يا عُدَّتي عِندَ شِدَّتي، يا رَجائي عِندَ مُصيبَتي، يا مؤنِسي عِندَ وَحشَتي، يا صاحِبي عِندَ غُربَتي، يا وَليّي عِندَ نِعمَتي، يا غياثي عِندَ كُربَتي، يا دَليلي عِندَ حَيرَتي، يا غَنائي عِندَ افتِقاري، يا مَلجَأي عِندَ اضطِراري، يا مُعيني عِندَ مَفزَعي.\n\n(12) يا عَلّامَ الغُيوبِ، يا غَفَّارَ الذُّنوبِ، يا سَتَّارَ العُيوبِ، يا كاشِفَ الكُروبِ، يا مُقَلِّبَ القُلوبِ، يا طَبيبَ القُلوبِ، يا مُنَوِّرَ القُلوبِ، يا أنيسَ القُلوبِ، يا مُفَرِّجَ الهُمومِ، يا مُنَفِّسَ الغُمومِ.\n\n(13) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا جَليلُ، يا جَميلُ، يا وَكيلُ، يا كَفيلُ، يا دَليلُ، يا قَبيلُ ، يا مُديلُ، يا مُنيلُ، يا مُقيلُ، يا مُحيلُ.\n\n(14) يا دَليلَ المُتَحَيِّرينَ، يا غيا ثَ المُستَغيثينَ، يا صَريخَ المُستَصرِخينَ، يا جارَ المُستَجيرينَ، يا أمانَ الخائِفينَ، يا عَونَ المُؤمِنينَ، يا راحِمَ المَساكينَ، يا مَلجأ العاصينَ، يا غافِرَ المُذنِبينَ، يا مُجيبَ دَعوَةِ المُضطَرّينَ.\n\n(15) يا ذا الجودِ وَالإحسانِ، يا ذا الفَضلِ وَالامتِنانِ، يا ذا الأمنِ وَالأمانِ، يا ذا القُدسِ وَالسُّبحانِ، يا ذا الحِكمَةِ وَالبَيانِ، يا ذا الرَّحمَةِ وَالرِّضوانِ، يا ذا الحُجَّةِ وَالبُرهانِ، يا ذا العَظَمَةِ وَالسُّلطانِ، يا ذا الرَأفَةِ وَالمُستَعانِ، يا ذا العَفوِ وَالغُفرانِ.\n\n(16) يا مَن هُوَ رَبُّ كُلِّ شيءٍ، يا مَن هُوَ إلهُ كُلِّ شيءٍ، يا مَن هُوَ خالِقُ كُلِّ شيءٍ، يا مَن هُوَ صانِعُ كُلِّ شيءٍ، يا مَن هُوَ قَبلَ كُلِّ شيءٍ، يا مَن هُوَ بَعدَ كُلِّ شيءٍ، يا مَن هُوَ فَوقَ كُلِّ شيءٍ، يا مَن هُوَ عالِمٌ بكُلِّ شيءٍ، يا مَن هُوَ قادِرٌ عَلى كُلِّ شيءٍ، يا مَن هُوَ يَبقى وَيَفنى كُلُّ شيءٍ.\n\n(17) اللهُمَّ إنّي أسألُكَ، بِاسْمِكَ يا مُؤمِنُ، يا مُهَيمِنُ، يا مُكَوِّنُ، يا مُلَقِّنُ، يا مُبيّنُ، يا مُهَوِّنُ، يا مُمَكِّنُ، يا مُزَيِّنُ، يا مُعلِنُ، يا مُقَسِّمُ.\n\n(18) يا مَن هُوَ في مُلكِهِ مُقيمٌ، يا مَن هُوَ في سُلطانِهِ قَديمٌ، يا مَن هُوَ في جَلالِهِ عَظيمٌ، يا مَن هُوَ عَلى عِبادِهِ رَحيمٌ، يا مَن هُوَ بكُلِّ شيءٍ عَليمٌ، يا مَن هُوَ بِمَن عَصاهُ حَليمٌ، يا مَن هُوَ بِمَن رَجاهُ كَريمٌ، يا مَن هُوَ في صُنعِهِ حَكيمٌ، يا مَن هُوَ في حِكمَتِهِ لَطيفٌ، يا مَن هُوَ في لُطفِهِ قَديمٌ.\n\n(19) يا مَن لا يُرجى إلاّ فَضلُهُ، يا مَن لا يُسألُ إلاّ عَفوُهُ، يا مَن لا يُنظَرُ إلاّ بِرُّهُ، يا مَن لا يُخافُ إلاّ عَدلُهُ، يا مَن لا يَدومُ إلاّ مُلكُهُ، يا مَن لا سُلطانَ إلاّ سُلطانُهُ، يا مَن وَسِعَت كُلَّ شيءٍ رحمَتُهُ، يا مَن سَبَقَت رَحمَتُهُ غَضَبَهُ، يا مَن أحاطَ بِكُلِّ شيءٍ عِلمُهُ، يا مَن لَيسَ أحَدٌ مِثلَهُ.\n\n(20) يا فارِجَ الهَمِّ، يا كاشِفَ الغَمِّ، يا غافِرَ الذَّنبِ، يا قابِلَ التَّوبِ، يا خالِقَ الخَلقِ، يا صادِقَ الوَعدِ، يا مُوفِي العَهدِ، يا عالِمَ السِّرِّ، يا فالِقَ الحَبِّ، يا رازِقَ الأنامِ.\n\n(21) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا عَليُّ، يا وَفيُّ، يا غَنيُّ، يا مَليُّ، يا حَفيُّ، يا رَضيُّ، يا زَكيُّ ، يا بَديُّ، يا قَويُّ، يا وَليُّ.\n\n(22) يا مَن أظهَرَ الجَميلَ، يا مَن سَتَرَ القَبيحَ، يا مَن لَم يُؤاخِذ بِالجَريرَةِ، يا مَن لَم يَهتِكِ السِّترَ، يا عَظيمَ العَفوِ، يا حَسَنَ التَّجاوُزِ، يا واسِعَ المَغفِرَةِ، يا باسِطَ اليَّدَينِ بِالرَّحمَةِ، يا صاحِبَ كُلِّ نَجوى، يا مُنتَهى كُلِّ شَكوى.\n\n(23) يا ذا النِّعمَةِ السَّابِغَةِ، يا ذا الرَّحمَةِ الواسِعَةِ، يا ذا المِنَّةِ السَّابِقَةِ، يا ذا الحِكمَةِ البالِغَةِ، يا ذا القُدرَةِ الكامِلَةِ، يا ذا الحُجَّةِ القاطِعَةِ، يا ذا الكَرامَةِ الظاهِرَةِ، يا ذا العِزَّةِ الدَّائِمَةِ، يا ذا القوَّةِ المَتينَةِ، يا ذا العَظَمَةِ المَنيعَةِ.\n\n(24) يا بَديعَ السَّماواتِ، يا جاعِلَ الظُّلُماتِ، يا راحِم العَبَراتِ، يا مُقيلَ العَثَراتِ، يا ساتِرَ العَوراتِ، يا مُحييَ الأمواتِ، يا مُنزِلَ الآيات، يا مُضَعِّفَ الحَسَناتِ، يا ماحي السَّيِّئاتِ، يا شَديدَ النَّقَماتِ.\n\n(25) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا مُصَوِّرُ، يا مُقَدِّرُ، يا مُدَبِّرُ، يا مُطَهِّرُ، يا مُنَوِّرُ، يا مُيَسِّرُ، يا مُبَشِّرُ، يا مُنذِرُ، يا مُقَدِّمُ، يا مُؤَخِّرُ.\n\n(26) يا رَبَّ البَيتِ الحَرامِ، يا رَبَّ الشَّهرِ الحَرامِ، يا رَبَّ البَلَدِ الحَرامِ، يا رَبَّ الرُّكنِ وَالمَقامِ، يا رَبَّ المَشعَرِ الحَرامِ، يا رَبَّ المَسجِدِ الحَرامِ، يا رَبَّ الحِلِّ وَالحَرامِ، يا رَبَّ النّورِ وَالظَّلامِ، يا رَبَّ التَّحيَّةِ وَالسَّلامِ، يا رَبَّ القُدرَةِ في الأنامِ.\n\n(27) يا أحكَمَ الحاكِمينَ، يا أعدَلَ العادِلينَ، يا أصدَقَ الصَّادِقينَ، يا أطهَرَ الطَّاهِرِينَ، يا أحسَنَ الخالِقينَ، يا أسرَعَ الحاسِبينَ، يا أسمَعَ السَّامِعينَ، يا أبصَرَ النَّاظِرينَ، يا أشفَعَ الشَّافِعينَ، يا أكرَمَ الأكرَمينَ.\n\n(28) يا عِمادَ مَن لا عِمادَ لَهُ، يا سَنَدَ مَن لا سَنَدَ لَهُ، يا ذُخرَ مَن لا ذُخرَ لَهُ، يا حِرزَ مَن لا حِرزَ لَهُ، يا غياثَ مَن لا غياثَ لَهُ، يا فَخرَ مَن لا فَخرَ لَهُ، يا عِزَّ مَن لا عِزَّ لَهُ، يا مُعينَ مَن لا مُعينَ لَهُ ، يا أنيسَ مَن لا أنيسَ لَهُ، يا أمانَ مَن لا أمانَ لَهُ.\n\n(29) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا عاصِمُ، يا قائِمُ، يا دائِمُ، يا راحِمُ، يا سالِمُ، يا حاكِمُ، يا عالِمُ، يا قاسِمُ، يا قابِضُ، يا باسِطُ.\n\n(30) يا عاصِمَ مَنِ استَعصَمَهُ ، يا راحِمَ مَن استَرحَمَهُ، يا غافِرَ مَنِ استَغفَرَهُ، يا ناصِرَ مَنِ استَنصَرَهُ، يا حافِظَ مَنِ استَحفَظَهُ، يا مُكرِمَ مَنِ استَكرَمَهُ، يا مُرشِدَ مَنِ استَرشَدَهُ، يا صِريخَ مَنِ استَصرَخَهُ، يا مُعينَ مَنِ استَعانَهُ، يا مُغيثَ مَنِ استَغاثَهُ.\n\n(31) يا عَزيزاً لا يُضامُ، يا لَطيفاً لا يُرامُ، يا قَيّوماً لا يَنامُ، يا دائِماً لا يَفوتُ، يا حَيا لا يَموتُ ، يا مَلِكاً لا يَزولُ، يا باقياً لا يَفنى، يا عالِماً لا يَجهَلُ، يا صَمَداً لا يُطعَمُ، يا قَويا لا يَضعُفُ.\n\n(32) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا أحَدُ، يا واحِدُ، يا شاهِدُ، يا ماجِدُ، يا حامِدُ، يا راشِدُ، يا باعِثُ، يا وارِثُ، يا ضارُّ، يا نافِعُ.\n\n(33) يا أعظَمَ مِن كُلِّ عَظيمٍ، يا أكرَمَ مِن كُلِّ كَريمٍ، يا أرحَمَ مِن كُلِّ رَحيمٍ، يا أعلَمَ مِن كُلِّ عَليمٍ، يا أحكَمَ مِن كُلِّ حَكيمٍ، يا أقدَمَ مِن كُلِّ قَديمٍ، يا أكبَرَ مِن كُلِّ كَبيرٍ، يا ألطَفَ مِن كُلِّ لَطيفٍ، يا أجَلَّ مِن كُلِّ جَليلٍ، يا أعَزَّ مِن كُلِّ عَزيزٍ.\n\n(34) يا كَريمَ الصَّفحِ، يا عَظيمَ المَنِّ، يا كَثيرَ الخَيرِ، يا قَديمَ الفَضلِ، يا دائِمَ اللُّطفِ، يا لَطيفَ الصُّنعِ، يا مُنَفِّسَ الكَربِ، يا كاشِفَ الضُّرِّ، يا مالِكَ المُلكِ، يا قاضيَ الحَقِّ.\n\n(35) يا مَن هُوَ في عَهدِهِ وَفيُّ، يا مَن هُوَ في وَفائِهِ قَويُّ، يا مَن هُوَ في قوَّتِهِ عَليُّ، يا مَن هُوَ في عُلوِّهِ قَريبٌ، يا مَن هُوَ في قُربِهِ لَطيفٌ، يا مَن هُوَ في لُطفِهِ شَريفٌ، يا مَن هُوَ في شَرَفِهِ عَزيزٌ ، يا مَن هُوَ في عِزِّهِ عَظيمٌ، يا مَن هُوَ في عَظَمَتِهِ مَجيدٌ، يا مَن هُوَ في مَجدِهِ حَميدٌ.\n\n(36) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا كافي، يا شافي، يا وافي، يا مُعافي، يا هادي، يا داعي، يا قاضي، يا راضي، يا عالي، يا باقي.\n\n(37) يا مَن كُلُّ شيءٍ خاضِعٌ لَهُ، يا مَن كُلُّ شيءٍ خاشِعٌ لَهُ، يا مَن كُلُّ شيءٍ كائِنٌ لَهُ، يا مَن كُلُّ شيءٍ مَوجودٌ بِهِ، يا مَن كُلُّ شيءٍ مُنيبٌ إلَيهِ، يا مَن كُلُّ شيءٍ خائِفٌ مِنهُ، يا مَن كُلُّ شيءٍ قائِمٌ بِهِ ، يا مَن كُلُّ شيءٍ صائِرٌ إلَيهِ، يا مَن كُلُّ شيءٍ يُسَبِّح بِحَمدِهِ يا مَن كُلُّ شيءٍ هالِكٌ إلاّ وَجهَهُ.\n\n(38) يا مَن لا مَفَرَّ إلاّ إلَيهِ، يا مَن لا مَقصَدَ إلاّ إلَيهِ، يا مَن لا مَنجى مِنهُ إلاّ إلَيهِ، يا مَن لا يُرغَبُ إلاّ إلَيهِ، يا مَن لاحَولَ وَلا قوَّةَ إلاّ بِهِ، يا مَن لا يُستَعانُ إلاّ بِهِ، يا مَن لا يُتَوَكَّلُ إلاّ عَلَيهِ، يا مَن لا يُرجى إلاّ هوَ، يا مَن لا يُعبَدُ إلاّ هوَ.\n\n(39) يا خَيرَ المَرهوبينَ، يا خَيرَ المَرغوبينَ، يا خَيرَ المَطلوبينَ، يا خَيرَ المَسؤولينَ، يا خَيرَ المَقصودينَ، يا خَيرَ المَذكورينَ، يا خَيرَ المَشكورينَ، يا خَيرَ المَحبوبينَ، يا خَيرَ المَدعُوِّينَ، يا خَيرَ المُستَأنِسينَ.\n\n(40) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا غافِرُ، يا ساتِرُ، يا قادِرُ، يا قاهِرُ، يا فاطِرُ، يا كاسِرُ، يا جابِرُ، يا ذاكِرُ، يا ناظِرُ، يا ناصِرُ.\n\n(41) يا مَن خَلَقَ فَسَوَّى، يا مَن قَدَّرَ فَهَدى، يا مَن يَكشِفُ البَلوى، يا مَن يَسمَعُ النَّجوى، يا مَن يُنقِذُ الغَرقى، يا مَن يُنجي الهَلكى، يا مَن يَشفي المَرضى، يا مَن أضحَكَ وَأبكى، يا مَن أماتَ وَأحيى، يا مَن خَلَقَ الزَّوجَينِ الذَّكَرَ وَالاُنثى.\n\n(42) يا مَن في البَرِّ وَالبَحرِ سَبيلُهُ، يا مَن في الآفاقِ آياتُهُ، يا مَن في الآيات بُرهانُهُ، يا مَن في المَماتِ قُدرَتُهُ، يا مَن في القُبورِ عِبرَتُهُ، يا مَن في القيامة مُلكُهُ، يا مَن في الحِسابِ هَيبَتُهُ، يا مَن في الميزانِ قَضاؤُهُ، يا مَن في الجَنَّةِ ثَوابُهُ، يا مَن في النّارِ عِقابُهُ.\n\n(43) يا مَن إلَيهِ يَهرُبُ الخائِفونَ، يا مَن إلَيهِ يَفزَعُ المُذنِبونَ، يا مَن إلَيهِ يَقصِدُ المُنيبونَ، يا مَن إلَيهِ يَرغَبُ الزَّاهِدونَ، يا مَن إلَيهِ يَلجَأُ المُتَحَيِّرونَ، يا مَن بِهِ يَستَأنِسُ المُريدونَ، يا مَن بِهِ يَفتَخِرُ المُحِبّونَ، يا مَن في عَفوِهِ يَطمَعُ الخاطِئونَ، يا مَن إلَيهِ يَسكُنُ الموقِنونَ، يا مَن عَلَيهِ يَتَوَكَّلُ المُتَوَكِّلونَ.\n\n(44) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا حَبيبُ، يا طَبيبُ، يا قَريبُ، يا رَقيبُ، يا حَسيبُ، يا مَهِيبُ، يا مُثيبُ، يا مُجيبُ، يا خَبيرُ، يا بَصيرُ.\n\n(45) يا أقرَبَ مِن كُلِّ قَريبٍ، يا أحَبَّ مِن كُلِّ حَبيبٍ، يا أبصَرَ مِن كُلِّ بَصيرٍ، يا أخبَرَ مِن كُلِّ خَبيرٍ، يا أشرَفَ مِن كُلِّ شَريفٍ، يا أرفَعَ مِن كُلِّ رَفيعٍ، يا أقوى مِن كُلِّ قَويٍّ، يا أغنى مِن كُلِّ غَنيٍّ، يا أجوَدَ مِن كُلِّ جَوادٍ، يا أرأفَ مِن كُلِّ رَؤوفٍ.\n\n(46) يا غالِباً غَيرَ مَغلوبٍ، يا صانِعاً غَيرَ مَصنوعٍ، يا خالِقاً غَيرَ مَخلوقٍ، يا مالِكاً غَيرَ مَملوكٍ، يا قاهِراً غَيرَ مَقهورٍ، يا رافِعاً غَيرَ مَرفوعٍ، يا حافِظاً غَيرَ مَحفوظٍ، يا ناصِراً غَيرَ مَنصورٍ، يا شاهِداً غَيرَ غائِبٍ، يا قَريباً غَيرَ بَعيدٍ.\n\n(47) يا نورَ النّورِ، يا مُنَوِّرَ النّورِ، يا خالِقَ النّورِ، يا مُدَبِّرَ النّورِ، يا مُقَدِّرَ النّورِ، يا نورَ كُلِّ نورٍ، يا نوراً قَبلَ كُلِّ نورٍ، يا نوراً بَعدَ كُلِّ نورٍ، يا نوراً فَوقَ كُلِّ نورٍ، يا نوراً لَيسَ كَمِثلِهِ نورٌ.\n\n(48) يا مَن عَطاؤُهُ شَريفٌ ، يا مَن فِعلُهُ لَطيفٌ، يا مَن لُطفُهُ مُقيمٌ، يا مَن إحسانُهُ قَديمٌ، يا مَن قَولُهُ حَقٌّ، يا مَن وَعدُهُ صِدقٌ، يا مَن عَفوُهُ فَضلٌ، يا مَن عَذابُهُ عَدلٌ، يا مَن ذِكرُهُ حُلوٌ، يا مَن فَضلُهُ عَميمٌ.\n\n(49) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا مُسَهِّلُ، يا مُفَصِّلُ، يا مُبَدِّلُ، يا مُذَلِّلُ، يا مُنَزِّلُ، يا مُنَوِّلُ، يا مُفضِلُ، يا مُجزِلُ، يا مُمهِلُ، يا مُجمِلُ.\n\n(50) يا مَن يَرى وَلا يُرى، يا مَن يَخلُقُ وَلا يُخلَقُ، يا مَن يَهدي وَلا يُهدى، يا مَن يُحيي وَلا يُحيى، يا مَن يَسألُ وَلا يُسألُ، يا مَن يُطعِمُ وَلا يُطعَمُ، يا مَن يُجيرُ وَلا يُجارُ عَلَيهِ، يا مَن يَقضي وَلا يُقضى عَلَيهِ، يا مَن يَحكُمُ وَلا يُحكَمُ عَلَيهِ، يا مَن لَم يَلِد وَلَم يولَد وَلَم يَكُن لَهُ كُفُواً أحَدٌ.\n\n(51) يا نِعمَ الحَسيبُ، يا نِعمَ الطَّبيبُ، يا نِعمَ الرَّقيبُ، يا نِعمَ القَريبُ، يا نِعمَ المُجيبُ، يا نِعمَ الحَبيبُ، يا نِعمَ الكَفيلُ، يا نِعمَ الوَكيلُ، يا نِعمَ المَولى، يا نِعمَ النَّصيرُ.\n\n(52) يا سُرورَ العارِفينَ، يا مُنى المُحِبّينَ، يا أنيسَ المُريدينَ، يا حَبيبَ التَّوَّابينَ، يا رازِقَ المُقِلّينَ، يا رَجاءَ المُذنِبينَ، يا قُرَّةَ عَينِ العابِدينَ، يا مُنَفِّسَ عَنِ المَكروبينَ، يا مُفَرِّجَ عَنِ المَغمومينَ، يا إلهَ الأوَّلينَ وَالآخِرينَ.\n\n(53) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا رَبَّنا، يا إلهَنا، يا سَيِّدِنا، يا مَولانا، يا ناصِرَنا، يا حافِظَنا، يا دَليلَنا، يا مُعينَنا، يا حَبيبَنا، يا طَبيبَنا.\n\n(54) يا رَبَّ النَّبيّينَ وَالأبرارِ، يا رَبَّ الصِّدّيقينَ وَالأخيارِ، يا رَبَّ الجَنَّةِ وَالنّارِ، يا رَبَّ الصِّغارِ وَالكِبارِ، يا رَبَّ الحُبُوبِ وَالثِّمارِ، يا رَبَّ الأنهارِ وَالأشجارِ، يا رَبَّ الصَّحاري وَالقِفارِ، يا رَبَّ البَراري وَالبِحارِ، يا رَبَّ اللَّيلِ وَالنَّهارِ، يا رَبَّ الإعلانِ وَالاَسرارِ.\n\n(55) يا مَن نَفَذَ في كُلِّ شيءٍ أمرُهُ، يا مَن لَحِقَ بِكُلِّ شيءٍ عِلمُهُ، يا مَن بَلَغَت إلى كُلِّ شيءٍ قُدرَتُهُ، يا مَن لا تُحصي العِبادُ نِعَمَهُ، يا مَن لا تَبلُغُ الخَلائِقُ شُكرَهُ، يا مَن لا تُدرِكُ الأفهامُ جَلالَهُ، يا مَن لا تَنالُ الأوهامُ كُنهَهُ، يا مَن العَظَمَةُ وَالكِبرياءُ رِداؤُهُ، يا مَن لا تَرُدُّ العِبادُ قَضاءَهُ، يا مَن لا مُلكَ إلاّ مُلكُهُ، يا مَن لا عَطاءَ إلاّ عَطاؤُهُ.\n\n(56) يا مَن لَهُ المَثَلُ الأعلى، يا مَن لَهُ الصِّفاتُ العُليا، يا مَن لَهُ الآخرةُ وَالاُولى، يا مَن لَهُ الجَنَّةُ المَأوى، يا مَن لَهُ الآياتُ الكُبرى، يا مَن لَهُ الأسماءُ الحُسنى، يا مَن لَهُ الحُكمُ وَالقَضاءُ، يا مَن لَهُ الهَواءُ وَالفَضاءُ، يا مَن لَهُ العَرشُ وَالثَّرى، يا مَن لَهُ السَّماواتُ العُلى.\n\n(57) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا عَفوُّ، يا غَفورُ، يا صَبورُ، يا شَكورُ، يا رَؤوفُ، يا عَطوفُ، يا مَسؤولُ، يا وَدودُ، يا سُبّوحُ، يا قُدّوسُ.\n\n(58) يا مَن في السَّماءِ عَظَمَتُهُ، يا مَن في الأرضِ آياتُهُ، يا مَن في كُلِّ شيءٍ دَلائِلُهُ، يا مَن في البِحارِ عَجائِبُهُ، يا مَن في الجِبالِ خَزائِنُهُ، يا مَن يَبْدَأُ الخَلقَ ثمّ يُعيدُهُ، يا مَن إلَيهِ يَرجِعُ الأمرُ كُلُّهُ، يا مَن أظهَرَ في كُلِّ شيءٍ لُطفَهُ، يا مَن أحسَنَ كُلَّ شيءٍ خَلقَهُ، يا مَن تَصَرَّفَ في الخَلائِقِ قُدرَتُهُ.\n\n(59) يا حَبيبَ مَن لاحَبيبَ لَهُ، يا طَبيبَ مَن لا طَبيبَ لَهُ، يا مُجيبَ مَن لا مُجيبَ لَهُ، يا شَفيقَ مَن لا شَفيقَ لَهُ، يا رَفيقَ مَن لا رَفيقَ لَهُ، يا مُغيثَ مَن لا مُغيثَ لَهُ، يا دَليلَ مَن لا دَليلَ لَهُ، يا أنيسَ مَن لا أنيسَ لَهُ، يا راحِمَ مَن لا راحِمَ لَهُ، يا صاحِبَ مَن لا صاحِبَ لَهُ.\n\n(60) يا كافيَ مَن استَكفاهُ، يا هاديَ مَن استَهداهُ، يا كالئ مَن استَكلّاهُ، يا راعيَ مَنِ استَرعاهُ، يا شافيَ مَن استَشفاهُ، يا قاضيَ مَنِ استَقضاهُ، يا مُغنيَ مَنِ استَغناهُ، يا موفيَ مَنِ استَوفاهُ، يا مُقَوّيَ مَنِ استَقواهُ، يا وَليَّ مَنِ استَولاهُ.\n\n(61) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا خالِقُ، يا رازِقُ، يا ناطِقُ، يا صادِقُ، يا فالِقُ، يا فارِقُ، يا فاتِقُ، يا راتِقُ، يا سابِقُ، يا سامِقُ.\n\n(62) يا مَن يُقَلِّبُ اللَّيلَ وَالنَّهارَ، يا مَن جَعَلَ الظُّلُماتِ وَالأنوارَ، يا مَن خَلَقَ الظِّلَّ وَالحَرورَ، يا مَن سَخَّرَ الشَّمسَ وَالقَمَرَ، يا مَن قَدَّرَ الخَيرَ وَالشَّرَّ، يا مَن خَلَقَ المَوتَ وَالحياةَ، يا مَن لَهُ الخَلقُ وَالأمرُ، يا مَن لَم يَتَّخِذ صاحِبَةً وَلا وَلَداً، يا مَن لَيسَ لَهُ شَريكٌ في المُلكِ، يا مَن لَم يَكُن لَهُ وَليُّ مِنَ الذُّلِّ.\n\n(63) يا مَن يَعلَمُ مُرادَ المُريدينَ، يا مَن يَعلَمُ ضَميرَ الصَّامِتينَ، يا مَن يَسمَعُ أنينَ الواهِنينَ، يا مَن يَرى بُكاءَ الخائِفينَ، يا مَن يَملِكُ حَوائِجَ السَّائِلينَ، يا مَن يَقبَلُ عُذرَ التَّائِبينَ، يا مَن لا يُصلِحُ عَمَلَ المُفسِدينَ، يا مَن لا يُضيعُ أجرَ المُحسِنينَ، يا مَن لا يَبعُدُ عَن قُلوبِ العارِفينَ، يا أجوَدَ الأجوَدينَ.\n\n(64) يا دائِمَ البَقاءِ، يا سامِعَ الدُّعاءِ، يا واسِعَ العَطاءِ، يا غافِرَ الخَطاءِ، يا بَديعَ السَّماءِ، يا حَسَنَ البَلاءِ، يا جَميلَ الثَّناءِ، يا قَديمَ السَّناءِ، يا كَثيرَ الوَفاءِ، يا شَريفَ الجَزاءِ.\n\n(65) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا سَتَّارُ، يا غَفَّارُ، يا قَهَّارُ، يا جَبَّارُ، يا صَبَّارُ، يا بارُّ، يا مُختارُ، يا فَتَّاحُ، يا نَفَّاحُ، يا مُرتاحُ.\n\n(66) يا مَن خَلَقَني وَسَوَّاني، يا مَن رَزَقَني وَرَبَّاني، يا مَن أطعَمَني وَسَقاني، يا مَن قَرَّبَني وَأدناني، يا مَن عَصَمَني وَكَفاني، يا مَن حَفِظَني وَكَلاني ، يا مَن أعَزَّني وَأغناني، يا مَن وَفَّقَني وَهَداني، يا مَن آنَسَني وَآواني، يا مَن أماتَني وَأحياني.\n\n(67) يا مَن يُحِقُّ الحَقَّ بِكَلِماتِهِ، يا مَن يَقبَلُ التَّوبَةَ عَن عِبادِهِ، يا مَن يَحولُ بَينَ المَرءِ وَقَلبِهِ، يا مَن لا تَنفَعُ الشَّفاعَةُ إلاّ بِإذنِهِ، يا مَن هُوَ أعلَمُ بِمَن ضَلَّ عَن سَبيلِهِ، يا مَن لا مُعَقِّبَ لِحُكمِهِ، يا مَن لا رادَّ لِقَضائِهِ، يا مَن انقادَ كُلُّ شيءٍ لأمرِهِ، يا مَن السَّماواتُ مَطوياتٌ بيَمينِهِ، يا مَن يُرسِلُ الرياحَ بُشراً بَينَ يَدَي رَحمَتِهِ.\n\n(68) يا مَن جَعَلَ الأرضَ مِهاداً، يا مَن جَعَلَ الجِبالَ أوتاداً، يا مَن جَعَلَ الشَّمسَ سِراجاً، يا مَن جَعَلَ القَمَرَ نوراً، يا مَن جَعَلَ اللَّيلَ لِباساً، يا مَن جَعَلَ النَّهارَ مَعاشاً، يا مَن جَعَلَ النَّومَ سُباتاً، يا مَن جَعَلَ السَّماء بِناءً، يا مَن جَعَلَ الأشياءَ أزواجاً، يا مَن جَعَلَ النّارَ مِرصادًا.\n\n(69) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا سَميعُ، يا شَفيعُ، يا رَفيعُ، يا مَنيعُ، يا سَريعُ، يا بَديعُ، يا كَبيرُ، يا قَديرُ، يا خَبيرُ، يا مُجيرُ.\n\n(70) يا حَيا قَبلَّ كُلِّ حَيٍّ، يا حَيا بَعدَ كُلِّ حَيٍّ، يا حَيُّ الَّذي لَيسَ كَمِثلِهِ حَيُّ، يا حَيُّ الَّذي لا يُشارِكُهُ حَيُّ، يا حَيُّ الَّذي لا يَحتاجُ إلى حَيٍّ، يا حَيُّ الَّذي يُميتُ كُلَّ حَيٍّ، يا حَيُّ الَّذي يَرزُقُ كُلَّ حَيٍّ، يا حَيا لَم يَرِثِ الحياةَ مِن حَيٍّ، يا حَيُّ الَّذي يُحيي المَوتى، يا حَيُّ يا قَيّومُ لا تَأخُذُهُ سِنَةٌ وَلا نَومٌ.\n\n(71) يا مَن لَهُ ذِكرٌ لا يُنسى، يا مَن لَهُ نورٌ لا يُطفأُ، يا مَن لَهُ نِعَمٌ لا تُعَدُّ، يا مَن لَهُ مُلكٌ لا يَزولُ، يا مَن لَهُ ثَناءٌ لا يُحصى، يا مَن لَهُ جَلالٌ لا يُكَيَّفُ، يا مَن لَهُ كَمالٌ لا يُدرَكُ، يا مَن لَهُ قَضاءٌ لا يُرَدُّ، يا مَن لَهُ صِفاتٌ لا تُبَدَّلُ، يا مَن لَهُ نُعوتٌ لا تُغَيَّرُ.\n\n(72) يا رَبَّ العالَمينَ، يا مالِكَ يَومِ الدّينِ، يا غايَةَ الطَّالِبينَ، يا ظَهرَ اللّاجِينَ، يا مُدرِكَ الهارِبينَ، يا مَن يُحِبُّ الصَّابِرينَ، يا مَن يُحِبُّ التَّوَّابينَ، يا مَن يُحِبُّ المُتَطَهِّرينَ، يا مَن يُحِبُّ المُحسِنينَ، يا مَن هُوَ أعلَمُ بِالمُهتَدينَ.\n\n(73) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا شَفيقُ، يا رَفيقُ، يا حَفيظُ ، يا مُحيطُ، يا مُقيتُ، يا مُغيثُ، يا مُعِزُّ، يا مُذِلُّ، يا مُبدئُ، يا مُعيدُ.\n\n(74) يا مَن هُوَ أحَدٌ بِلا ضِدٍّ، يا مَن هُوَ فَردٌ بِلا نِدٍّ، يا مَن هُوَ صَمَدٌ بِلا عَيبٍ، يا مَن هُوَ وِترٌ بِلا كَيفٍ، يا مَن هُوَ قاضٍ بِلا حَيفٍ، يا مَن هُوَ رَبٌّ بِلا وَزيرٍ، يا مَن هُوَ عَزيزٌ بِلا ذُلٍّ، يا مَن هُوَ غَنيٌّ بِلا فَقرٍ، يا مَن هُوَ مَلِكٌ بِلا عَزلٍ، يا مَن هُوَ مَوصوفٌ بِلا شَبيهٍ.\n\n(75) يا مَن ذِكرُهُ شَرَفٌ لِلذَّاكِرينَ، يا مَن شُكرُهُ فَوزٌ لِلشَّاكِرينَ، يا مَن حَمدُهُ عِزٌّ لِلحامِدينَ، يا مَن طاعَتُهُ نَجاةٌ لِلمُطيعينَ، يا مَن بابُهُ مَفتوحٌ لِلطَّالِبينَ، يا مَن سَبيلُهُ وَاضِحٌ لِلمُنيبينَ، يا مَن آياتُهُ بُرهانٌ لِلنَّاظِرينَ، يا مَن كِتابُهُ تَذكِرَةٌ لِلمُتَّقينَ، يا مَن رِزقُهُ عُموم لِلطَّائِعينَ وَالعاصينَ، يا مَن رَحمَتُهُ قَريبٌ مِنَ المُحسِنينَ.\n\n(76) يا مَن تَبارَكَ اسمُهُ، يا مَن تَعالى جَدُّهُ، يا مَن لا إلهَ غَيرُهُ، يا مَن جَلَّ ثَناؤُهُ، يا مَن تَقَدَّسَت أسماؤُهُ، يا مَن يَدومُ بَقاؤُهُ، يا مَن العَظَمَةُ بَهاؤُهُ، يا مَن الكِبرياءُ رِداؤُهُ، يا مَن لا تُحصَى آلاؤُهُ، يا مَن لا تُعَدُّ نَعماؤُهُ.\n\n(77) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا مُعينُ، يا أمينُ، يا مُبينُ، يا مَتينُ، يا مَكينُ، يا رَشيدُ، يا حَميدُ، يا مَجيدُ، يا شَديدُ، يا شَهيدُ.\n\n(78) يا ذا العَرشِ المَجيدِ، يا ذا القَولِ السَّديدِ، يا ذا الفِعلِ الرَّشيدِ، يا ذا البَطشِ الشَّديدِ، يا ذا الوَعدِ وَالوَعيدِ، يا مَن هُوَ الوَليُّ الحَميدُ ، يا مَن هُوَ فَعَّالٌ لِما يُريدُ، يا مَن هُوَ قَريبٌ غَيرُ بَعيدٍ، يا مَن هُوَ عَلى كُلِّ شيء شَهيدٌ، يا مَن هُوَ لَيسَ بِظَلّامٍ لِلعَبيدِ.\n\n(79) يا مَن لا شَريكَ لَهُ وَلا وَزيرَ، يا مَن لا شَبيهَ لَهُ وَلا نَظيرَ، يا خالِقَ الشَّمسِ وَالقَمَرِ المُنيرِ، يا مُغنيَ البائِسِ الفَقيرِ، يا رازِقَ الطِّفلِ الصَّغيرِ، يا راحِمَ الشَّيخِ الكَبيرِ، يا جابِرَ العَظمِ الكَسيرِ، يا عِصمَةَ الخائِفِ المُستَجيرِ، يا مَن هُوَ بِعِبادِهِ خَبيرٌ بَصيرٌ، يا مَن هُوَ عَلى كُلِّ شيء قَديرٌ.\n\n(80) يا ذا الجودِ وَالنِّعَمِ، يا ذا الفَضلِ وَالكَرَمِ، يا خالِقَ اللَّوحِ وَالقَلَمِ، يا بارئَ الذَّرِّ وَالنَّسَمِ، يا ذا البَأسِ وَالنِّقَمِ، يا مُلهِمَ العَرَبِ وَالعَجَمِ، يا كاشِفَ الضُّرِّ وَالألَمِ، يا عالِمَ السِّرِّ وَالهِمَمِ، يا رَبَّ البَيتِ وَالحَرَمِ، يا مَن خَلَقَ الأشياءَ مِنَ العَدَمِ.\n\n(81) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا فاعِلُ، يا جاعِلُ، يا قابِلُ، يا كامِلُ، يا فاصِلُ، يا واصِلُ، يا عادِلُ، يا غالِبُ، يا طالِبُ، يا واهِبُ.\n\n(82) يا مَن أنعَمَ بِطَولِهِ، يا مَن أكرَمَ بِجودِهِ، يا مَن جادَ بِلُطفِهِ، يا مَن تَعَزَّزَ بِقُدرَتِهِ، يا مَن قَدَّرَ بِحِكمَتِهِ، يا مَن حَكَمَ بِتدبيرِهِ، يا مَن دَبَّرَ بِعِلمِهِ، يا مَن تَجاوَزَ بِحِلمِهِ، يا مَن دَنا في عُلوِّهِ، يا مَن عَلا في دُنوِّهِ.\n\n(83) يا مَن يَخلُقُ ما يَشاءُ، يا مَن يَفعَلُ ما يَشاءُ، يا مَن يَهدي مَن يَشاءُ، يا مَن يُضِلُّ مَن يَشاءُ، يا مَن يُعَذِّبُ مَن يَشاءُ، يا مَن يَغفِرُ لِمَن يَشاءُ، يا مَن يُعِزُّ مَن يَشاءُ، يا مَن يُذِلُّ مَن يَشاءُ، يا مَن يُصَوِّرُ في الأرحامِ ما يَشاءُ، يا مَن يَختَصُّ بِرَحمَتِهِ مَن يَشاءُ.\n\n(84) يا مَن لَم يَتَّخِذ صاحِبَةً وَلا وَلَداً، يا مَن جَعَلَ لكلّ شيء قَدراً، يا مَن لا يُشرِكُ في حُكمِهِ أحَداً، يا مَن جَعَلَ المَلائِكَةَ رُسُلاً، يا مَن جَعَلَ في السَّماءِ بُروجاً، يا مَن جَعَلَ الأرضَ قَراراً، يا مَن خَلَقَ مِنَ الماءِ بَشَراً، يا مَن جَعَلَ لكلّ شيء أمَداً، يا مَن أحاطَ بِكُلِّ شيء عِلماً، يا مَن أحصى كُلَّ شيء عَدَد.\n\n(85) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا أوَّلُ، يا آخِرُ، يا ظاهِرُ، يا باطِنُ، يا بَرُّ، يا حَقُّ، يا فَردُ، يا وِترُ، يا صَمَدُ، يا سَرمَدُ.\n\n(86) يا خَيرَ مَعروفٍ عُرِفَ، يا أفضَلَ مَعبودٍ عُبِدَ، يا أجَلَّ مَشكورٍ شُكِرَ، يا أعَزَّ مَذكورٍ ذُكِرَ، يا أعلى مَحمودٍ حُمِدَ، يا أقدَمَ مَوجودٍ طُلِبَ، يا أرفَعَ مَوصوفٍ وُصِفَ، يا أكبَرَ مَقصودٍ قُصِدَ، يا أكرَمَ مَسؤولٍ سُئِلَ، يا أشرَفَ مَحبوبٍ عُلِمَ.\n\n(87) يا حَبيبَ الباكينَ، يا سَيِّدَ المُتَوَكِّلينَ، يا هاديَ المُضِلّينَ، يا وَليَّ المُؤمِنينَ، يا أنيسَ الذَّاكِرينَ، يا مَفزَعَ المَلهوفينَ، يا مُنجيَ الصَّادِقينَ، يا أقدَرَ القادِرينَ، يا أعلَمَ العالِمينَ، يا إلهَ الخَلقِ أجمَعينَ.\n\n(88) يا مَن عَلا فَقَهَرَ، يا مَن مَلَكَ فَقَدَرَ، يا مَن بَطَنَ فَخَبَرَ، يا مَن عُبِدَ فَشَكَرَ، يا مَن عُصيَ فَغَفَرَ، يا مَن لا تَحويهِ الفِكَرُ، يا مَن لا يُدرِكُهُ بَصَرٌ، يا مَن لا يَخفى عَلَيهِ أثَرٌ، يا رازِقَ البَشَرِ، يا مُقَدِّرَ كُلِّ قَدَرٍ.\n\n(89) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا حافِظُ، يا بارئُ، يا ذارئُ، يا باذِخُ، يا فارِجُ، يا فاتِحُ، يا كاشِفُ، يا ضامِنُ، يا آمِرُ، يا ناهي.\n\n(90) يا مَن لا يَعلَمُ الغَيبَ إلاّ هوَ، يا مَن لا يَصرِفُ السّوءَ إلاّ هوَ، يا مَن لا يَخلُقُ الخَلقَ إلاّ هوَ، يا مَن لا يَغفِرُ الذَّنبَ إلاّ هوَ، يا مَن لا يُتِمُّ النِّعمَةَ إلاّ هوَ، يا مَن لا يُقَلِّبُ القُلوبَ إلاّ هوَ، يا مَن لا يُدَبِّرُ الأمرَ الاّ هوَ، يا مَن لا يُنَزِّلُ الغَيثَ إلاّ هوَ، يا مَن لا يَبسُطُ الرِّزقَ إلاّ هوَ، يا مَن لا يُحيِي المَوتى إلاّ هوَ.\n\n(91) يا مُعينَ الضُّعَفاءِ، يا صاحِبَ الغُرَباءِ، يا ناصِرَ الأولياءِ، يا قاهِرَ الأعداءِ، يا رافِعَ السَّماءِ، يا أنيسَ الأصفياءِ، يا حَبيبَ الأتقياءِ، يا كَنزَ الفُقَراءِ، يا إلهَ الأغنياءِ، يا أكرَمَ الكُرَماءِ.\n\n(92) يا كافياً مِن كُلِّ شيءٍ، يا قائِماً عَلى كُلِّ شيءٍ، يا مَن لا يَشبَهُهُ شيءٌ، يا مَن لا يَزيدُ في مُلكِهِ شيءٌ. يا مَن لا يَخفى عَلَيهِ شيءٌ، يا مَن لا يَنقُصُ مِن خَزائِنِهِ شيءٌ، يا مَن لَيسَ كَمِثلِهِ شيءٌ، يا مَن لا يَعزُبُ عَن عِلمِهِ شيءٌ، يا مَن هُوَ خَبيرٌ بِكُلِّ شيءٍ، يا مَن وَسِعَت رَحمَتُهُ كُلَّ شيءٍ.\n\n(93) اللهُمَّ إنّي أسألُكَ بِاسمِكَ، يا مُكرِمُ، يا مُطعِمُ، يا مُنعِمُ، يا مُعطي، يا مُغني، يا مُقني، يا مُفني، يا مُحيي، يا مُرضي، يا مُنجي.\n\n(94) يا أوَّلَ كُلِّ شيء وَآخِـرَهُ، يا إلهَ كُلِّ شيء وَمَليكَهُ، يا رَبَّ كُلِّ شيء وَصانِعَهُ، يا بارئَ كُلِّ شيء وَخالِقَهُ، يا قابِضَ كُلِّ شيء وَباسِطَهِ، يا مُبدئَ كُلِّ شيء وَمُعيدَهُ، يا مُنشئَ كُلِّ شيء وَمُقَدِّرَهُ، يا مُكَوِّنَ كُلِّ شيء وَمُحَوِّلَهُ، يا مُحيي كُلِّ شيء وَمُميتَهُ، يا خالِقَ كُلِّ شيءٍ وَوارِثَهُ.\n\n(95) يا خَيرَ ذاكِرٍ وَمَذكورٍ، يا خَيرَ شاكِرٍ وَمَشكورٍ، يا خَيرَ حامِدٍ وَمَحمودٍ، يا خَيرَ شاهِدٍ وَمَشهودٍ، يا خَيرَ داعٍ وَمَدعوٍّ، يا خَيرَ مُجيبٍ وَمُجابٍ، يا خَيرَ مُؤنِسٍ وَأنيسٍ، يا خَيرَ صاحِبٍ وَجَليسٍ، يا خَيرَ مَقصودٍ وَمَطلوبٍ، يا خَيرَ حَبيبٍ وَمَحبوبٍ.\n\n(96) يا مَن هُوَ لِمَن دَعاهُ مُجيبٌ، يا مَن هُوَ لِمَن أطاعَهُ حَبيبٌ، يا مَن هُوَ إلى مَن أحَبَّهُ قَريبٌ، يا مَن هُوَ بِمَن استَحفَظَهُ رَقيبٌ، يا مَن هُوَ بِمَن رَجاهُ كَريمٌ، يا مَن هُوَ بِمَن عَصاهُ حَليمٌ، يا مَن هُوَ في عَظَمَتِهِ رَحيمٌ ، يا مَن هُوَ في حِكمَتِهِ عَظيمٌ، يا مَن هُوَ في إحسانِهِ قَديمٌ، يا مَن هُوَ بِمَن أرادَهُ عَليمٌ.\n\n(97) اللهُمَّ إنّي اسألُكَ بِاسمِكَ، يا مُسَبِّبُ، يا مُرَغِّبُ، يا مُقَلِّبُ، يا مُعَقِّبُ، يا مُرَتِّبُ، يا مُخَوِّفُ، يا مُحَذِّرُ، يا مُذَكِّرُ، يا مُسَخِّرُ، يا مُغَيِّرُ.\n\n(98) يا مَن عِلمُهُ سابِقٌ، يا مَن وَعدُهُ صادِقٌ، يا مَن لُطفُهُ ظاهِرٌ، يا مَن أمرُهُ غالِبٌ، يا مَن كِتابُهُ مُحكَمٌ، يا مَن قَضاؤُهُ كائِنٌ، يا مَن قَرآنُهُ مَجيدٌ، يا مَن مُلكُهُ قَديمٌ، يا مَن فَضلُهُ عَميمٌ، يا مَن عَرشُهُ عَظيم.\n\n(99) يا مَن لا يَشغَلُهُ سَمعٌ عَن سَمعٍ، يا مَن لا يَمنَعُهُ فِعلٌ عَن فِعلٍ، يا مَن لا يُلهيهِ قَولٌ عَن قَولٍ، يا مَن لا يُغلِّطُهُ سُؤالٌ عَن سُؤالٍ، يا مَن لا يَحجُبُهُ شيءٌ عَن شيءٍ، يا مَن لا يُبرِمُهُ إلحاحُ المُلِحّينَ، يا مَن هُوَ غايَةُ مُرادِ المُريدينَ، يا مَن هُوَ مُنتَهى هِمَمِ العارِفينَ، يا مَن هُوَ مُنتَهى طَلَبِ الطَّالِبينَ، يا مَن لا يَخفى عَلَيهِ ذَرَّةٌ في العالَمينَ.\n\n(100) يا حَليماً لا يعجَلُ، يا جَواداً لا يَبخَلُ، يا صادِقاً لا يُخلِفُ، يا وَهَّاباً لا يَمَلُّ، يا قاهِراً لا يُغلَبُ، يا عَظيماً لا يوصَفُ، يا عَدلاً لا يَحيفُ، يا غَنيا لا يَفتَقِرُ، يا كَبيراً لا يَصغُرُ، يا حافِظاً لا يَغفَلُ سُبحانَكَ، يا لا إلهَ إلاّ أنتَ الغَوثَ الغَوثَ خَلِّصنا مِنَ النّارِ يا رَبِّ.\n\nالمصدر: مفاتيح الجنان، القمي، ص 117، دار الأضواء، ط 3.",
  'دعاء التوسل': "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ : اَللَّهُمَّ إنِّي أسْأَلُكَ وَأتَوَجَّهُ إِلَيْكَ بِنَبِيِّكَ نَبِيِّ الرَّحْمَةِ مُحَمَّدٍ ـ صَلَّى اللهُ عَلَيْهِ وَآلِهِ ـ ، يَا أَبَا الْقَاسِمِ يَا رَسُولَ اللهِ ، يَا إِمَامَ الرَّحْمَةِ يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ .  يَا أَبَا الْحَسَنِ يَا أَمِيرَ الْمُؤْمِنِينَ يَا عَلِيَّ بْنَ أَبِي طَالِبٍ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا فَاطِمَةُ الزَّهْراءُ يَا بِنْتَ مُحَمَّدٍ يَا قُرَّةَ عَيْنِ الرَّسُولِ يا سَيِّدَتَنَا وَمَوْلاتَنَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكِ إِلَى اللهِ ، وَقَدَّمْنَاكِ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهَةً عِنْدَ اللهِ اِشْفَعِي لَنَا عِنْدَ اللهِ . يَا أَبَا مُحَمَّدٍ يَا حَسَنَ بْنَ عَلِيٍّ أَيُّهَا الْمُجْتَبَى يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا عَبْدِ اللهِ يَا حُسَيْنَ بْنَ عَلِيٍّ أَيُّهَا الشَّهِيدُ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا الْحَسَنِ يَا عَلِيَّ بْنَ الْحُسَيْنِ يَا زَيْنَ الْعَابِدِينَ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا جَعْفَرٍ يَا مُحَمَّدَ بْنَ عَلِيٍّ ، أَيُّها الْبَاقِرُ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا عَبْدِ اللهِ يَا جَعْفَرَ بْنَ مُحَمَّدٍ ، أَيُّها الصَّادِقُ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا الْحَسَنِ يَا مُوسَى بْنَ جَعْفَرٍ ، أَيُّهَا الْكَاظِمُ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا الْحَسَنِ يَا عَلِيَّ بْنَ مُوسَى ، أَيُّهَا الرِّضَا يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا جَعْفِرٍ يَا مُحَمَّدَ بْنَ عَلِيٍّ ، أَيُّهَا التَّقِيُّ الْجَوادُ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يا أَبَا الْحَسَنِ يَا عَلِيَّ بْنَ مُحَمَّدٍ ، أَيُّهَا الْهَادِي النَّقِي يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا أَبَا مُحَمَّدٍ يَا حَسَنَ بْنَ عَلِيٍّ ، أَيُّهَا الزَّكِيُّ الْعَسْكَرِيُّ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ . يَا وَصِيَّ الْحَسَنِ وَالْخَلَفَ الْحُجَّةَ ، أَيُّهَا الْقَائِمُ الْمُنْتَظَرُ الْمَهْدِيُّ يَا بْنَ رَسُولِ اللهِ يَا حُجَّةَ اللهِ عَلَى خَلْقِهِ  يَا سَيِّدَنَا وَمَوْلانَا ، إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللهِ ، وَقَدَّمْنَاكَ بَيْنَ يَدَيْ حَاجَاتِنَا ، يَا وَجِيهاً عِنْدَ اللهِ ، اِشْفَعْ لَنَا عِنْدَ اللهِ .\nثم سل حوائجك فإنّها تقضى إن شاء الله تعالى . وعلى رواية أخرى قل بعد ذلك : يَا سَادَتِي وَمَوَالِيَّ إِنِّي تَوَجَّهْتُ بِكُمْ أَئِمَّتِي لِيَوْمِ فَقْرِي وَحاجَتِي إِلَى اللهِ ، وَتَوَسَّلْتُ بِكُمْ إِلَى اللهِ ، وَاسْتَشْفَعْتُ بِكُمْ إِلَى اللهِ ، فَاشْفَعُوا لِي عِنْدَ اللهِ ، وَاسْتَنْقِذُونِي مِنْ ذُنُوبِي عِنْدَ اللهِ ، فَإنَّكُمْ وَسِيلَتِي إِلَى اللهِ ، وَبِحُبِّكُمْ وَبِقُرْبِكُمْ أَرْجُو نَجاةً مِنَ اللهِ ، فَكُونُوا عِنْدَ اللهِ رَجَائِي يا سادَتي يَا أَوْلِيَاءَ اللهِ ، صَلَّى اللهُ عَلَيْهِمْ أَجْمَعِينَ وَلَعَنَ اللهُ أعْداءَ اللهِ ظَالِمِيهِم مِنَ الأوَّلِينَ وَالآخِرِينَ ، آمِينَ رَبَّ العالَمِينَ .",
