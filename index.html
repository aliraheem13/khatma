  "زيارة آل ياسين": "سَلامٌ عَلَى آلِ يس، السَّلامُ عَلَيْكَ يا داعِيَ اللهِ وَرَبَّانِيَّ آياتِهِ، السَّلامُ عَلَيْكَ يا بابَ اللهِ وَدَيَّانَ دِينِهِ، السَّلامُ عَلَيْكَ يا خَلِيفَةَ اللهِ وَنافِذَ حُكْمِهِ، السَّلامُ عَلَيْكَ يا تالِيَ كِتابِ اللهِ وَتَرْجُمانَهُ، السَّلامُ عَلَيْكَ فِي آناءِ لَيْلِكَ وَأَطْرافِ نَهارِكَ، السَّلامُ عَلَيْكَ يا بَقِيَّةَ اللهِ فِي أَرْضِهِ.\n\nالسَّلامُ عَلَيْكَ يا مِيثاقَ اللهِ الَّذِي أَخَذَهُ وَوَثَّقَهُ، السَّلامُ عَلَيْكَ يا وَعْدَ اللهِ الَّذِي ضَمِنَهُ، السَّلامُ عَلَيْكَ أَيُّهَا العَلَمُ المَنْصُوبُ، وَالعِلْمُ المَصْبُوبُ، وَالغَوْثُ وَالرَّحْمَةُ الواسِعَةُ، وَعْداً غَيْرَ مَكْذُوبٍ.\n\nالسَّلامُ عَلَيْكَ فِي اللَّيْلِ إِذا يَغْشَى وَالنَّهارِ إِذا تَجَلَّى، السَّلامُ عَلَيْكَ أَيُّهَا الإِمامُ المَأْمُونُ، السَّلامُ عَلَيْكَ أَيُّهَا المُقَدَّمُ المَأْمُولُ، السَّلامُ عَلَيْكَ بِجَوامِعِ السَّلامِ.\n\nالسَّلامُ عَلَيْكَ حِينَ تَقُومُ، السَّلامُ عَلَيْكَ حِينَ تَقْعُدُ، السَّلامُ عَلَيْكَ حِينَ تَقْرَأُ وَتُبَيِّنُ، السَّلامُ عَلَيْكَ حِينَ تُصَلِّي وَتَقْنُتُ، السَّلامُ عَلَيْكَ حِينَ تَرْكَعُ وَتَسْجُدُ، السَّلامُ عَلَيْكَ حِينَ تُهَلِّلُ وَتُكَبِّرُ، السَّلامُ عَلَيْكَ حِينَ تَحْمَدُ وَتَسْتَغْفِرُ، السَّلامُ عَلَيْكَ حِينَ تُصْبِحُ وَتُمْسِي، السَّلامُ عَلَيْكَ فِي اللَّيْلِ إِذا يَغْشَى وَالنَّهارِ إِذا تَجَلَّى.\n\nالسَّلامُ عَلَيْكَ أَيُّهَا الإِمامُ المَأْمُونُ، السَّلامُ عَلَيْكَ أَيُّهَا المُقَدَّمُ المَأْمُولُ، السَّلامُ عَلَيْكَ بِجَوامِعِ السَّلامِ.\n\nأُشْهِدُكَ يا مَوْلاَيَ أَنِّي أَشْهَدُ أَنْ لا إِلَهَ إِلاَّ اللهُ وَحْدَهُ لا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، لا حَبِيبَ إِلاَّ هُوَ وَأَهْلُ بَيْتِهِ، وَأُشْهِدُكَ يا مَوْلاَيَ أَنَّ عَلِيّاً أَمِيرَ المُؤْمِنِينَ حُجَّتُهُ، وَالحَسَنَ حُجَّتُهُ، وَالحُسَيْنَ حُجَّتُهُ، وَعَلِيَّ بْنَ الحُسَيْنِ حُجَّتُهُ، وَمُحَمَّدَ بْنَ عَلِيٍّ حُجَّتُهُ، وَجَعْفَرَ بْنَ مُحَمَّدٍ حُجَّتُهُ، وَمُوسَى بْنَ جَعْفَرٍ حُجَّتُهُ، وَعَلِيَّ بْنَ مُوسَى حُجَّتُهُ، وَمُحَمَّدَ بْنَ عَلِيٍّ حُجَّتُهُ، وَعَلِيَّ بْنَ مُحَمَّدٍ حُجَّتُهُ، وَالحَسَنَ بْنَ عَلِيٍّ حُجَّتُهُ، وَأَشْهَدُ أَنَّكَ حُجَّةُ اللهِ.\n\nالدعاء الملحق بزيارة آل يس\n\nاللَّهُمَّ إِنِّي أَسْأَلُكَ أَنْ تُصَلِّيَ عَلَى مُحَمَّدٍ نَبِيِّ رَحْمَتِكَ وَكَلِمَةِ نُورِكَ، وَأَنْ تَمْلأَ قَلْبِي نُورَ اليَقِينِ، وَصَدْرِي نُورَ الإِيمانِ، وَفِكْرِي نُورَ النِّيَّاتِ، وَعَزْمِي نُورَ العِلْمِ، وَقُوَّتِي نُورَ العَمَلِ، وَلِسانِي نُورَ الصِّدْقِ، وَدِينِي نُورَ البَصائِرِ مِنْ عِنْدِكَ، وَبَصَرِي نُورَ الضِّياءِ، وَسَمْعِي نُورَ الحِكْمَةِ، وَمَوَدَّتِي نُورَ المُوالاةِ لِمُحَمَّدٍ وَآلِهِ عَلَيْهِمُ السَّلامُ، حَتَّى أَلْقَاكَ وَقَدْ وَفَيْتُ بِعَهْدِكَ وَمِيثاقِكَ، فَتُغَشِّيَنِي رَحْمَتَكَ يا وَلِيُّ يا حَمِيدُ.",
  "زيارة الإمام المهدي (عج)": "سَلامٌ عَلَى آلِ يس، السَّلامُ عَلَيْكَ يا داعِيَ اللهِ وَرَبَّانِيَّ آياتِهِ، السَّلامُ عَلَيْكَ يا بابَ اللهِ وَدَيَّانَ دِينِهِ، السَّلامُ عَلَيْكَ يا خَلِيفَةَ اللهِ وَنافِذَ حُكْمِهِ، السَّلامُ عَلَيْكَ يا تالِيَ كِتابِ اللهِ وَتَرْجُمانَهُ، السَّلامُ عَلَيْكَ فِي آناءِ لَيْلِكَ وَأَطْرافِ نَهارِكَ، السَّلامُ عَلَيْكَ يا بَقِيَّةَ اللهِ فِي أَرْضِهِ.\n\nالسَّلامُ عَلَيْكَ يا مِيثاقَ اللهِ الَّذِي أَخَذَهُ وَوَثَّقَهُ، السَّلامُ عَلَيْكَ يا وَعْدَ اللهِ الَّذِي ضَمِنَهُ، السَّلامُ عَلَيْكَ أَيُّهَا العَلَمُ المَنْصُوبُ، وَالعِلْمُ المَصْبُوبُ، وَالغَوْثُ وَالرَّحْمَةُ الواسِعَةُ، وَعْداً غَيْرَ مَكْذُوبٍ.\n\nالسَّلامُ عَلَيْكَ فِي اللَّيْلِ إِذا يَغْشَى وَالنَّهارِ إِذا تَجَلَّى، السَّلامُ عَلَيْكَ أَيُّهَا الإِمامُ المَأْمُونُ، السَّلامُ عَلَيْكَ أَيُّهَا المُقَدَّمُ المَأْمُولُ، السَّلامُ عَلَيْكَ بِجَوامِعِ السَّلامِ.\n\nالسَّلامُ عَلَيْكَ حِينَ تَقُومُ، السَّلامُ عَلَيْكَ حِينَ تَقْعُدُ، السَّلامُ عَلَيْكَ حِينَ تَقْرَأُ وَتُبَيِّنُ، السَّلامُ عَلَيْكَ حِينَ تُصَلِّي وَتَقْنُتُ، السَّلامُ عَلَيْكَ حِينَ تَرْكَعُ وَتَسْجُدُ، السَّلامُ عَلَيْكَ حِينَ تُهَلِّلُ وَتُكَبِّرُ، السَّلامُ عَلَيْكَ حِينَ تَحْمَدُ وَتَسْتَغْفِرُ، السَّلامُ عَلَيْكَ حِينَ تُصْبِحُ وَتُمْسِي، السَّلامُ عَلَيْكَ فِي اللَّيْلِ إِذا يَغْشَى وَالنَّهارِ إِذا تَجَلَّى.\n\nالسَّلامُ عَلَيْكَ أَيُّهَا الإِمامُ المَأْمُونُ، السَّلامُ عَلَيْكَ أَيُّهَا المُقَدَّمُ المَأْمُولُ، السَّلامُ عَلَيْكَ بِجَوامِعِ السَّلامِ.\n\nأُشْهِدُكَ يا مَوْلاَيَ أَنِّي أَشْهَدُ أَنْ لا إِلَهَ إِلاَّ اللهُ وَحْدَهُ لا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، لا حَبِيبَ إِلاَّ هُوَ وَأَهْلُ بَيْتِهِ، وَأُشْهِدُكَ يا مَوْلاَيَ أَنَّ عَلِيّاً أَمِيرَ المُؤْمِنِينَ حُجَّتُهُ، وَالحَسَنَ حُجَّتُهُ، وَالحُسَيْنَ حُجَّتُهُ، وَعَلِيَّ بْنَ الحُسَيْنِ حُجَّتُهُ، وَمُحَمَّدَ بْنَ عَلِيٍّ حُجَّتُهُ، وَجَعْفَرَ بْنَ مُحَمَّدٍ حُجَّتُهُ، وَمُوسَى بْنَ جَعْفَرٍ حُجَّتُهُ، وَعَلِيَّ بْنَ مُوسَى حُجَّتُهُ، وَمُحَمَّدَ بْنَ عَلِيٍّ حُجَّتُهُ، وَعَلِيَّ بْنَ مُحَمَّدٍ حُجَّتُهُ، وَالحَسَنَ بْنَ عَلِيٍّ حُجَّتُهُ، وَأَشْهَدُ أَنَّكَ حُجَّةُ اللهِ.\n\nالدعاء الملحق بزيارة آل يس\n\nاللَّهُمَّ إِنِّي أَسْأَلُكَ أَنْ تُصَلِّيَ عَلَى مُحَمَّدٍ نَبِيِّ رَحْمَتِكَ وَكَلِمَةِ نُورِكَ، وَأَنْ تَمْلأَ قَلْبِي نُورَ اليَقِينِ، وَصَدْرِي نُورَ الإِيمانِ، وَفِكْرِي نُورَ النِّيَّاتِ، وَعَزْمِي نُورَ العِلْمِ، وَقُوَّتِي نُورَ العَمَلِ، وَلِسانِي نُورَ الصِّدْقِ، وَدِينِي نُورَ البَصائِرِ مِنْ عِنْدِكَ، وَبَصَرِي نُورَ الضِّياءِ، وَسَمْعِي نُورَ الحِكْمَةِ، وَمَوَدَّتِي نُورَ المُوالاةِ لِمُحَمَّدٍ وَآلِهِ عَلَيْهِمُ السَّلامُ، حَتَّى أَلْقَاكَ وَقَدْ وَفَيْتُ بِعَهْدِكَ وَمِيثاقِكَ، فَتُغَشِّيَنِي رَحْمَتَكَ يا وَلِيُّ يا حَمِيدُ.",
  'دعاء كميل': "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nاللّهُمَّ إِنِّي أَسأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ، وَبِقُوَّتِكَ الَّتِي قَهَرْتَ بِها كُلَّ شَيْءٍ، وَخضَعَ لَها كُلُّ شَيْءٍ، وَذَلَّ لَها كُلُّ شَيْءٍ، وَبِجَبَرُوتِكَ الَّتِي غَلَبْتَ بِها كُلَّ شَيْءٍ، وَبعَزَّتِكَ الَّتِي لا يَقُومُ لَها شَيْءٌ، وَبِعَظَمَتِكَ الَّتِي مَلَأَتْ كُلَّ شَيْءٍ، وَبِسُلْطانِكَ الَّذِي عَلَا كُلَّ شَيْءٍ، وَبِوَجْهِكَ الباقِي بَعْدَ فَناءِ كُلِّ شَيْءٍ، وَبِأَسْمائِكَ الَّتِي مَلَأَتْ (غَلَبَت) أَرْكانَ كُلِّ شَيْءٍ، وَبِعِلْمِكَ الَّذِي أَحاطَ بِكُلِّ شَيْءٍ، وَبِنُورِ وَجْهِكَ الَّذِي أَضاءَ لَهُ كُلُّ شَيْءٍ، يا نوُرُ يا قُدُّوسُ، يا أَوَّلَ الأَوَّلِينَ، وَيا آخِرَ الآخرينَ. اللّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تَهْتِكُ العِصَمَ، اللّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُنْزِلُ النِّقَمَ، اللّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُغَيِّرُ النِّعَمَ، اللّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تَحْبِسُ الدُّعاءَ، اللّهُمَّ اغْفِرْ لِيَ الّذنُوبَ الّتي تُنْزِلُ البَلَاء، اللّهُمَّ اغْفِرْ لِي كُلَّ ذَنْبٍ أذْنَبْتُهُ، وَكُلَّ خَطِيئَةٍ أَخْطَأْتُها، اللّهُمَّ إِنِّي أَتَقَرَّبُ إِلَيْكَ بِذِكْرِكَ، وَأَسْتَشفِعُ بِكَ إِلى نَفْسِكَ، وَأَسْأَلُكَ بِجوُدِكَ أَنْ تُدْنِيَنِي مِنْ قُرْبِكَ، وَأَنْ تُوزِعَنِي شُكْرَكَ، وأَنْ تُلْهِمَنِي ذِكْرَكَ. اللّهُمَّ إِنِّي أَسأَلُكَ سُؤالَ خاضِعٍ مُتَذَلِّلٍ خاشِعٍ، أَنْ تُسامِحَنِي وَتَرْحَمَنِي، وَتَجْعَلَنِي بِقِسْمِكَ راضِياً قانِعاً، وَفِي جَمِيعِ الأَحْوالِ مُتَواضِعاً. اللّهُمَّ وَأَسأَلُكَ سُؤالَ مَنِ اِشْتَدَّتْ فاقَتُهُ، وَأَنْزَلَ بِكَ عِنْدَ الشَّدائِدِ حاجَتَهُ، وَعَظُمَ فِيما عِنْدَكَ رَغْبَتُهُ، اللّهُمَّ عَظُمَ سُلْطانُكَ وَعَلَا مَكانُكَ، وَخَفِيَ مَكْرُكَ وَظَهَرَ أَمْرُكَ، وَغَلَبَ قَهْرُكَ وَجَرَتْ قُدْرَتُكَ، وَلا يُمْكِنُ الفِرارُ مِنْ حُكُومَتِكَ، اللّهُمَّ لا أَجِدُ لِذُنُوبِي غافِراً وَلا لِقَبائِحِي سَاتِراً، وَلا لِشَيْءٍ مِنْ عَمَلِيَ القَبِيحِ بِالحَسَنِ مُبَدِّلاً غَيْرَكَ، لا إِلهَ إِلَّا أَنْتَ سُبْحانَكَ وَبِحَمْدِكَ ظَلَمْتُ نَفْسِي، وَتَجَرَّأْتُ بِجَهْلِي، وَسَكَنْتُ إِلى قَدِيمِ ذِكْرِكَ لِي وَمَنِّكَ عَلَيَّ. اللّهُمَّ مَوْلايَ كَمْ مِنْ قَبيحٍ سَتَرْتَهُ، وَكَمْ مِنْ فادِحٍ مِنَ البَلاءِ أَقَلْتَهُ (أَملْتَهُ)، وَكَمْ مِنْ عِثارٍ وَقَيْتَهُ، وَكَمْ مِنْ مَكْروُهٍ دَفَعْتَهُ، وَكَمْ مِنْ ثَناءٍ جَمِيلٍ لَسْتُ أَهْلاً لَهُ نَشَرْتَهُ. اللّهُمَّ عَظُمَ بَلائِي، وَأَفْرَطَ بِي سُوءُ حَالِي، وَقَصُرَتْ(وَقَصَّرَتْ) بِي أَعْمالِي، وَقَعَدَتْ بِي أَغْلالِي وَحَبَسَنِي عَنْ نَفْعِي بُعْدُ أَمَلِي(آمالي)، وَخَدَعَتْنِي الدُّنْيا بِغُرُورِها، وَنَفْسِي بِخِيانَتِها (بجنايتها)، وَمِطالِي يا سَيِّدِي فَأَسْأَلُكَ بِعِزَّتِكَ أَنْ لا يَحْجُبَ عَنْكَ دُعائِي سُوءُ عَمَلِي وَفِعالِي، وَلا تَفْضَحَنِي بِخَفِيِّ ما اطَّلَعْتَ عَلَيْهِ مِنْ سِرِّي، وَلا تُعاجِلْنِي بِالعُقُوبَةِ عَلى مَا عَمِلْتُهُ فِي خَلَواتِي مِنْ سُوءِ فِعْلِي وَإِساءَتِي، وَدَوامِ تَفْرِيطِي وَجَهالَتِي، وَكَثْرَةِ شَهَواتِي وَغَفْلَتِي، وَكُنِ اللّهُمَّ بِعِزَّتِكَ لِي في الأَحوْالِ كُلّها ( فِي كُلِّ الأَحْوالِ) رَؤُوفاً، وَعَلَيَّ فِي جَمِيعِ الأُمُورِ عَطُوفاً. إِلهِي وَرَبِّي مَنْ لِي غَيْرُكَ أَسأَلُهُ كَشْفَ ضُرِّي وَالنَّظَرَ فِي أَمْرِي. إِلهِي وَمَوْلايَ أَجْرَيْتَ عَلَيَّ حُكْماً اتَّبَعْتُ فِيهِ هَوى نَفْسِي، وَلَمْ أَحْتَرِسْ فِيهِ (فيه) مِنْ تَزْيينِ عَدُوِّي، فَغَرَّنِي بِما أَهْوى وَأَسْعَدَهُ عَلى ذلِكَ القَضاءُ، فَتَجاوَزْتُ بِما جَرى عَلَيَّ مِنْ ذلِكَ بَعْضَ حُدُودِكَ، وَخالَفْتُ بَعْضَ أَوامِرِكَ، فَلَكَ الحُجّة (الحَمْدُ) عَلَيَّ فِي جَمِيعِ ذلِكَ وَلا حُجَّةَ لِي فِيما جَرى عَلَيَّ فِيهِ قَضاؤُكَ، وَأَلْزَمَنِي حُكْمُكَ وَبَلاؤُكَ، وَقَدْ أَتَيْتُكَ يا إِلهِي بَعْدَ تَقْصِيرِي وَإِسْرافِي عَلَى نَفْسِي مُعْتَذِراً نادِماً مُنْكَسِراً مُسْتَقِيلاً مُسْتَغْفِراً مُنِيباً مُقِرّاً مُذْعِناً مُعْتَرِفاً، لا أَجِدُ مَفَرّاً مِمّا كانَ مِنِّي وَلا مَفْزَعاً أَتَوَجَّهُ إِلَيْهِ فِي أَمْرِي، غَيْرَ قَبُوُلِكَ عُذْرِي وَإِدْخالِكَ إِيّايَ فِي سَعَةٍ مِنْ رَحْمَتِكَ. اللّهُمَّ فَاقْبَلْ عُذْرِي، وَارْحَمْ شِدَّةَ ضُرِّي وَفُكَّنِي مِنْ شَدِّ وَثاقِي، يا رَبِّ ارْحَمْ ضَعْفَ بَدَنِي، وَرِقَّةَ جِلْدِي وَدِقَّةَ عَظْمِي، يامَنْ بَدَأَ خَلْقِي وَذِكْرِي وَتَرْبِيَتِي وَبِرِّي وَتَغْذِيَتِي، هَبْنِي لابْتِداءِ كَرَمِكَ وَسالِفِ بِرِّكَ بِي، يا إِلهِي وَسَيِّدِي وَرَبِّي، أَتُراكَ مُعَذِّبِي بِنارِكَ بَعْدَ تَوْحِيدِكَ، وَبَعْدَما انْطَوى عَلَيْهِ قَلْبِي مِنْ مَعْرِفَتِكَ، وَلَهِجَ بِهِ لِسانِي مِنْ ذِكْرِكَ، وَاعْتَقَدَهُ ضَمِيرِي مِنْ حُبِّكَ، وَبَعْدَ صِدْقِ اعْتِرافِي وَدُعائِي خَاضِعَاً لِرُبُوبِيَّتِكَ، هَيْهاتَ! أَنْتَ أَكْرَمُ مِنْ أَنْ تُضَيِّعَ مَنْ رَبَّيْتَهُ، أَوْ تُبَعِّدَ (تُبْعِدَ) مَنْ أَدْنَيْتَهُ، أَوْ تُشَرِّدَ مَنْ آوَيْتَهُ، أَوْ تُسَلِّمَ إِلى البَلاءِ مَنْ كَفَيْتَهُ وَرَحِمْتَهُ، وَلَيْتَ شِعْرِي يا سَيِّدِي وَإِلهِي وَمَوْلايَ! أَتُسَلِّطُ النّارَ عَلى وُجُوهٍ خَرَّتْ لِعَظَمَتِكَ ساجِدَةً، وَعَلى أَلْسُنٍ نَطَقَتْ بِتَوْحِيدِكَ صادِقَةً وَبُشُكْرِكَ مادِحَةً، وَعَلى قُلُوبٍ اعْتَرَفَتْ بِإِلهِيَّتِكَ مُحَقِّقَةً، وَعَلَى ضَمائِرَ حَوَتْ مِنَ العِلْمِ بِكَ حَتّى صارَتْ خاشِعَةً، وَعَلى جَوارِحَ سَعَتْ إِلى أَوْطانِ تَعَبُّدِكَ طائِعَةً، وَأَشارَتْ بِاسْتِغْفارِكَ مُذْعِنَةً؟! ما هكَذا الظَنُّ بِكَ وَلا أُخْبِرْنا بِفَضْلِكَ عَنْكَ يا كَرِيمُ، يا رَبِّ وَأَنْتَ تَعْلَمُ ضَعْفِي عَنْ قَلِيلٍ مِنْ بَلاءِ الدُّنْيا وَعُقُوباتِها، وَما يَجْرِي فِيها مِنَ المَكارِهِ عَلَى أَهْلِها، عَلَى أَنَّ ذلِكَ بَلاءٌ وَمَكْرُوهٌ قَلِيلٌ مَكْثُهُ، يَسِيرٌ بَقاؤهُ قَصِيٌر مُدَّتُهُ، فَكَيْفَ احْتِمالِي لِبَلاءِ الآخِرَةِ وَجَلِيلِ(وحلول) وُقُوعِ المَكارِهِ فِيها، وَهُوَ بَلاءٌ تَطُولُ مُدَّتُهُ وَيَدُومُ مَقامُهُ وَلا يُخَفَّفُ عَنْ أَهْلِهِ، لأَنَّهُ لا يَكُونُ إِلَّا عَنْ غَضَبِكَ وَانْتِقامِكَ وَسَخَطِكَ؟! وَهذا ما لا تَقُومُ لَهُ السَّماواتُ وَالأَرْضُ، يا سَيِّدِي فَكَيْفَ بِي (لي) وَأَنَاْ عَبْدُكَ الضَّعِيفُ الذَّلِيلُ الحَقِيرُ المِسْكِينُ المُسْتَكِينُ؟! يا إِلهِي وَرَبِّي وَسَيِّدِي وَمَوْلايَ، لِأَيِّ الأُمُورِ إِلَيْكَ أَشْكُو، وَلِما مِنها أَضِجُّ وَأَبْكِي، لِأَلِيمِ العَذابِ وَشِدَّتِهِ، أَمْ لِطُولِ البَلاءِ وَمُدَّتِهِ؟! فَلَئِنْ صَيَّرْتَنِي لِلْعُقُوباتِ مَعَ أَعْدائِكَ، وَجَمَعْتَ بَيْنِي وَبَيْنَ أَهْلِ بَلائِكَ، وَفَرَّقْتَ بَيْنِي وَبَيْنَ أَحِبّائِكَ وَأَوْلِيائِكَ؛ فَهَبْنِي يا إِلهِي وَسَيِّدِي وَمَوْلايَ وَرَبِّي، صَبَرْتُ عَلَى عَذابِكَ فَكَيْفَ أَصْبِرُ عَلَى فِراقِكَ؟ وَهَبْنِي(وهبني يا إلهي) صَبَرْتُ عَلى حَرِّ نارِكَ فَكَيْفَ أَصْبِرُ عَنِ النَّظَرِ إِلى كَرامَتِكَ؟ أَمْ كَيْفَ أَسْكُنُ فِي النّارِ وَرَجَائِي عَفْوُكَ؟ فَبِعِزَّتِكَ يا سَيِّدِي وَمَوْلايَ أُقْسِمُ صادِقاً، لَئِنْ تَرَكْتَنِي نَاطِقاً لَأَضِجَّنَّ إِلَيْكَ بَيْنَ أَهْلِها ضَجِيجَ الآمِلِينَ(الآلِمين)، وَلَأَصْرُخَنَّ إِلَيْكَ صُراخَ المُسْتَصْرِخِينَ، وَلَأَبْكِيَنَّ عَلَيْكَ بُكاءَ الفاقِدِينَ، وَلَأُنادِيَنَّكَ أَيْنَ أَنْتَ(كُنْتَ) يا وَلِيَّ المُؤْمِنِينَ، يا غايَةَ آمالِ العارِفِينَ، يا غِياثَ المُسْتَغِيثِينَ، يا حَبِيبَ قُلوُبِ الصّادِقِينَ، وَيا إِلهَ العالَمينَ، أَفَتُراكَ سُبْحانَكَ يا إِلهي وَبِحَمْدِكَ تَسْمَعُ فِيها صَوْتَ عَبْدٍ مُسْلِمٍ سُجِنَ (يُسْجَنُ) فِيها بِمُخالَفَتِهِ، وَذاقَ طَعْمَ عَذابِها بِمَعْصِيَتِهِ، وَحُبِسَ بَيْنَ أَطْباقِها بِجُرْمِهِ وَجَرِيرَتِهِ، وَهُوَ يَضِجُّ إِلَيْكَ ضَجِيجَ مُؤَمِّلٍ لِرَحْمَتِكَ، وَيُنادِيكَ بِلِسانِ أَهْلِ تَوْحِيدِكَ، وَيَتَوَسَّلُ إِلَيْكَ بِرُبُوبِيَّتِكَ، يا مَوْلايَ فَكَيْفَ يَبْقَى فِي العَذابِ وَهُوَ يَرْجوُ ما سَلَفَ مِنْ حِلْمِكَ؟ أَمْ كَيْفَ تُؤْلِمُهُ النَّارُ وَهُوَ يَأْمُلُ فَضْلَكَ وَرَحْمَتَكَ؟ أَمْ كَيْفَ يُحْرِقُهُ لَهِيبُها وَأَنْتَ تَسْمَعُ صَوْتَهُ وَتَرى مَكانَهُ؟ أَمْ كَيْفَ يَشْتَمِلُ عَلَيْهِ زَفِيرُها وَأَنْتَ تَعْلَمُ ضَعْفَهُ؟ أَمْ كَيْفَ يَتَقَلْقَلُ(يَتَغَلغلُ) بَيْنَ أَطْباقِها وَأَنْتَ تَعْلَمُ صِدْقَهُ؟ أَمْ كَيْفَ تَزْجُرُهُ زَبانِيَتُها وَهُوَ يُنادِيكَ يا رَبَّه؟ أَمْ كَيْفَ يَرْجُو فَضْلَكَ فِي عِتْقِهِ مِنْها فَتَتْرُكَهُ (فَتَتْرُكُهُ) فِيها؟ هَيْهاتَ! ما ذَلِكَ الظَّنُّ بِكَ وَلا المُعْروفُ مِنْ فَضْلِكَ، وَلا مُشْبِهٌ لِما عامَلْتَ بِهِ المُوَحِّدِينَ مِنْ بِرِّكَ وَإِحْسانِكَ! فَبِالْيَقِينِ أَقَطَعُ، لَولا ما حَكَمْتَ بِهِ مِنْ تَعْذِيبِ جاحِدِيكَ، وَقَضَيْتَ بِهِ مِنْ إِخْلادِ مُعانِدِيكَ، لَجَعْلْتَ النَّارَ كُلَّها بَرْداً وَسَلاماً، وَما كَانَت (كَانَ) لِأَحَدٍ فِيها مَقَرّاً وَلا مُقاماً (مَقَاماً)، لكِنَّكَ تَقَدَّسَتْ أَسْماؤُكَ أَقْسَمْتَ أَنْ تَمْلَأَها مِنَ الكَافِرِينَ مِنَ الجِنَّةِ وَالنَّاسِ أَجْمَعِينَ، وَأَنْ تُخَلِّدَ فِيها المُعانِدِينَ، وَأَنْتَ جَلَّ ثَناؤُكَ قُلْتَ مُبْتَدِئاً، وَتَطَوَّلْتَ بِالإِنْعامِ مُتَكَرِّماً: أَفَمَنْ كَانَ مُؤْمِناً كَمَنْ كَانَ فَاسِقاً لَا يَسْتَوُونَ. إِلهِي وَسَيِّدِي فَأَسْأَلُكَ بِالقُدْرَةِ الَّتِي قَدَّرْتَها، وَبِالقَضِيَّةِ الَّتِي حَتَمْتَها وَحَكَمْتَها، وَغَلَبْتَ مَنْ عَلَيْهِ أَجْرَيْتَها، أَنْ تَهَبَ لِي فِي هذِهِ اللّيْلَةِ وَفِي هذِهِ السَّاعَةِ، كُلَّ جُرْمٍ أَجْرَمْتُهُ، وَكُلَّ ذَنْبٍ أَذْنَبْتُهُ، وَكُلَّ قَبِيحٍ أَسْرَرْتُهُ، وَكُلَّ جَهْلٍ عَمِلْتُهُ، كَتَمْتُهُ أَوْ أَعْلَنْتُهُ، أَخْفَيْتُهُ أَوْ أَظْهَرْتُهُ، وَكُلَّ سَيِّئَةٍ أَمَرْتَ بِإِثْباتِها الكِرامَ الكاتِبِينَ، الَّذِينَ وَكَّلْتَهُمْ بِحِفْظِ ما يَكُونُ مِنِّي، وَجَعَلْتَهُمْ شُهُوداً عَلَيّ مَعَ جَوارِحِي، وَكُنْتَ أَنْتَ الرَّقِيبَ عَلَيَّ مِنْ وَرائِهِمْ، وَالشَّاهِدَ لِمَا خَفِي عَنْهُمْ وَبِرَحْمَتِكَ أَخْفَيْتَهُ، وَبِفَضْلِكَ سَتَرْتَهُ، وَأَنْ تُوَفِّرَ حَظِّي مِنْ كُلِّ خَيْرٍ أَنْزَلْتَهُ، (أَوْ إِحْسانٍ تُفضلُهُ، أَوْ بِرٍّ تَنشرُهُ، أَوْ رِزْقٍ تَبْسطُهُ) أَوْ ذَنْبٍ تَغْفِرُهُ، أَوْ خَطَأٍ تَسْتُرُهُ، يا رَبِّ يا رَبِّ يا رَبِّ، يا إِلهِي وَسَيِّدِي وَمَوْلايَ وَمالِكَ رِقِّي، يامَنْ بِيَدِهِ ناصِيَتِي، يا عَلِيماً بِضُرِّي وَمَسْكَنَتِي، يا خَبِيراً بَفَقْرِي وَفاقَتِي، يا رَبِّ يا رَبِّ يا رَبِّ، أَسأَلُكَ بِحَقِكَ وَقُدْسِكَ وَأَعْظَمِ صِفاتِكَ وَأَسْمائِكَ، أَنْ تَجْعَلَ أَوْقاتِي فِي (مِنَ) اللّيْلِ وَالنَّهارِ بَذِكْرِكَ مَعْمُورَةً، وَبِخِدْمَتِكَ مَوْصُولَةً، وَأَعْمالِي عِنْدَكَ مَقْبُولَةً، حَتَّى تَكُونَ أَعْمالِي وأوْرَادِي(وَإرادَتي) كُلُّها وِرْداً وَاحِداً، وَحَالِي فِي خِدْمَتِكَ سَرْمَداً. يا سَيِّدِي يامَنْ عَلَيْهِ مُعَوَّلِي، يامَنْ إِلَيْهِ شَكَوْتُ أَحْوالِي، يا رَبِّ يا رَبِّ يا رَبِّ، قَوِّ عَلى خِدْمَتِكَ جَوارِحِي وَاشْدُدْ عَلى العَزِيمَةِ جَوانِحِي، وَهَبْ لِيَ الجِدَّ فِي خَشْيَتِكَ، وَالدَّوامَ فِي الاِتِّصالِ بِخِدْمَتِكَ حَتَّى أَسْرَحَ إِلَيْكَ فِي مَيادِينِ السابِقِينَ، وأُسْرِعَ إِلَيْكَ فِي المبادرين (البَارِزِينَ)، وَأَشْتاقَ إِلى قُرْبِكَ فِي المُشْتاقِينَ، وَأَدْنُوَ مِنْكَ دُنُوَّ المُخْلِصِينَ، وَأَخافَكَ مَخافَةَ المُوقِنِينَ، وَأَجْتَمِعَ فِي جِوارِكَ مَعَ المُؤْمِنِينَ. اللّهُمَّ وَمَنْ أَرادَنِي بِسوءٍ فَأَرِدْهُ، وَمَنْ كادَنِي فَكِدْهُ، وَاجْعَلْنِي مِنْ أَحْسَنِ عَبِيدِكَ نَصِيباً عِنْدَكَ، وَأَقْرَبِهِمْ مَنْزِلَةً مِنْكَ، وَأَخَصِّهِمْ زُلْفَةً لَدَيْكَ، فَإِنَّهُ لا يُنالُ ذلِكَ إِلَّا بِفَضْلِكَ، وَجُدْ لِي بِجُودِكَ، وَاعْطِفْ عَلَيَّ بَمَجْدِكَ وَاحْفَظْنِي بِرَحْمَتِكَ، وَاجْعَلْ لِسانِي بِذِكْرِكَ لَهِجاً، وَقَلْبِي بِحُبِّكَ مُتَيَّماً، وَمُنَّ عَلَيَّ بِحُسْنِ إِجابَتِكَ، وَأَقِلْنِي عَثْرَتِي، وَاغْفِرْ زَلَّتِي، فَإِنَّكَ قَضَيْتَ عَلَى عِبادِكَ بِعِبادَتِكَ، وَأَمَرْتَهُمْ بِدُعائِكَ، وَضَمِنْتَ لَهُمُ الْإِجابَةَ، فَإِلَيْكَ يا رَبِّ نَصَبْتُ وَجْهِي، وَإِلَيْكَ يا رَبِّ مَدَدْتُ يَدِي، فَبِعِزَّتِكَ اسْتَجِبْ لِي دُعائِي، وَبَلِّغْنِي مُنَايَ، وَلا تَقْطَعْ مِنْ فَضْلِكَ رَجَائِي، وَاكْفِنِي شَرَّ الجِنِّ وَالإِنْسِ مِنْ أعْدائِي. يا سَرِيعَ الرِّضَا اغْفِرْ لِمَنْ لا يَمْلِكُ إِلَّا الدُّعاءَ، فَإِنَّكَ فَعَّالٌ لِما تَشاءُ، يامَنِ اسْمُهُ دَواءٌ، وَذِكْرُهُ شِفاءٌ، وَطاعَتُهُ غِنىً، إِرْحَمْ مَنْ رَأسُ مالِهِ الرَّجاءُ وَسِلاحُهُ البُكاءُ، يا سَابِغَ النِّعَمِ يا دافِعَ النِّقَمِ، يا نُورَ المُسْتَوْحِشِينَ فِي الظُّلَمِ، يا عالِماً لا يُعَلَّمُ، صَلِّ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَافْعَلْ بِي ما أَنْتَ أَهْلُهُ، وَصَلَّى اللهُ عَلَى رَسُولِهِ وَالأَئِمَّةِ المَيامِينَ مِنْ آلِهِ (أهله)وَسَلَّمَ تَسْلِيْمَاً كَثِيْرَاً"

TEXTS['زيارة الإمام الحسين (ع)'] = "أَلسَّلامُ عَلى وَلِيِّ اللهِ وَحَبيبِهِ، السَّلامُ عَلى خَليلِ اللهِ وَنَجيبِهِ، السَّلامُ عَلى صَفِيِّ اللهِ وَابنِ صَفِيِّهِ، السَّلامُ عَلى الحُسَينِ المَظلُومِ الشَّهيدِ، السَّلامُ على أسيرِ الكُرُباتِ وَقَتيلِ العَبَراتِ، اللّـهُمَّ إنّي أشهَدُ أنَّهُ وَلِيُّكَ وَابنُ وَلِيِّكَ وَصَفِيُّكَ وَابنُ صَفِيِّكَ الفائِزُ بِكَرامَتِكَ، أكرَمتَهُ بِالشَّهادَةِ وَحَبَوتَهُ بِالسَّعادَةِ، وَاجتَبَيتَهُ بِطيبِ الوِلادَةِ، وَجَعَلتَهُ سَيِّداً مِنَ السادَةِ، وَقائِداً مِنَ القادَةِ، وَذائِداً مِن الذادَةِ، وَأعطَيتَهُ مَواريثَ الأنبِياءِ، وَجَعَلتَهُ حُجَّةً عَلى خَلقِكَ مِنَ الأوصِياءِ، فَأعذَرَ فىِ الدُّعاءِ وَمَنَحَ النُّصحَ، وَبَذَلَ مُهجَتَهُ فيكَ لِيَستَنقِذَ عِبادَكَ مِنَ الجَهالَةِ وَحَيرَةِ الضَّلالَةِ، وَقَد تَوازَرَ عَلَيهِ مَن غَرَّتهُ الدُّنيا، وَباعَ حَظَّهُ بِالأرذَلِ الأدنى، وَشَرى آخِرَتَهُ بِالَّثمَنِ الأوكَسِ، وَتَغَطرَسَ وَتَرَدّى فِي هَواهُ، وَأسخَطَكَ وَأسخَطَ نَبِيَّكَ، وَأطاعَ مِن عِبادِكَ أهلَ الشِّقاقِ وَالنِّفاقِ وَحَمَلَةَ الأوزارِ المُستَوجِبينَ النّارَ، فَجاهَدَهُم فيكَ صابِراً مُحتَسِباً حَتّى سُفِكَ فِي طاعَتِكَ دَمُهُ وَاستُبيحَ حَريمُهُ، اللّـهُمَّ فَالعَنهُم لَعناً وَبيلاً وَعَذِّبهُم عَذاباً أليماً.\n\nالسَّلامُ عَلَيكَ يَا بنَ رَسُولِ اللهِ، السَّلامُ عَلَيكَ يَا بنَ سَيِّدِ الاوصِياءِ، أشهَدُ أنَّكَ أمينُ اللهِ وَابنُ أمينِهِ، عِشتَ سَعيداً وَمَضَيتَ حَميداً وَمُتَّ فَقيداً مَظلُوماً شَهيداً، وَأشهَدُ أنَّ اللهَ مُنجِزٌ ما وَعَدَكَ، وَمُهلِكٌ مَن خَذَلَكَ، وَمُعَذِّبٌ مَن قَتَلَكَ، وَأشهَدُ أنَّكَ وَفَيتَ بِعَهدِ اللهِ وَجاهَدتَ فِي سَبيلِهِ حَتّى أتاكَ اليَقينُ، فَلَعَنَ اللهُ مَن قَتَلَكَ، وَلَعَنَ اللهُ مَن ظَلَمَكَ، وَلَعَنَ اللهُ أُمَّةً سَمِعَت بِذلِكَ فَرَضِيَت بِهِ، اللّـهُمَّ إنّي أُشهِدُكَ أنّي وَلِيٌّ لِمَن والاهُ وَعَدُوٌّ لِمَن عاداهُ.\n\nبِأبي أنتَ وَأُمّي يَابنَ رَسُولِ اللهِ، أشهَدُ أنَّكَ كُنتَ نُوراً فىِ الأصلابِ الشّامِخَةِ وَالأرحامِ المُطَهَّرَةِ، لَم تُنَجِّسكَ الجاهِلِيَّةُ بِأنجاسِها وَلَم تُلبِسكَ المُدلَهِمّاتُ مِن ثِيابِها، وَأشهَدُ أنَّكَ مِن دَعائِمِ الدّينِ وَأركانِ الم TEXTS['يوم الأحد'] = "زيارة أَميرِ المُؤمِنين عليه السلام يوم الأحد\n\nبروايةِ مَنْ شاهد صاحِب الزّمان عليه السلام وَهُوَ يزُوره بها في اليقظة لا في النّوم، يَوم الاَحَّد وَهُوَ يَومُه:\n\nالسَّلامُ عَلى الشَّجَرَةِ النَّبَوِيَّةِ، وَالدَّوْحَةِ الهاشِمِيَّةِ، المُضِيئَةِ المُثْمِرَةِ بِالنُّبُوَّةِ المُونِقَةِ بِالإمامةِ، وَعَلى ضَجِيعَيْكَ آدَمَ وَنُوحٍ عليهما السلام.\n\nالسّلامُ عَلَيْكَ وَعَلى أَهْلِ بَيْتِكَ الطَّيِّبِينَ الطَّاهِرِينَ، السَّلامُ عَلَيْكَ وَعَلى المَلائِكَةِ المُحْدِقِينَ بِكَ وَالحافِّينَ بِقَبْرِكَ. يا مَوْلايَ يا أَمِيرَ المُؤْمِنِينَ، هذا يَومُ الاَحَّدِ، وَهُوَ يَوْمُكَ وَبِإِسْمِكَ، وَأَنا ضَيْفُكَ فِيهِ وَجارُكَ، فَأَضِفْنِي يا مَوْلايَ، وَأَجِرْنِي فإِنَّكَ كَرِيمٌ تُحِبُّ الضِّيافَةَ، وَمَأْمُورٌ بِالاِجارَةِ فَافْعَلْ مارَغِبْتُ إِلَيْكَ فِيهِ، وَرَجَوْتُهُ مِنْكَ بِمَنْزِلَتِكَ وَآلِ بَيْتِكَ عِنْدَ اللهِ، وَمَنْزِلَتِهِ عِنْدَكُمْ، وَبِحَقِّ ابْنِ عَمِّكَ رَسُولِ الله صلّى الله عليه وآله وسلّم وعَلَيْهِمْ أَجْمَعِينَ.\n\nزِيارة الزَّهراءِ سَلامُ الله عَليها يوم الأحد:\n\nالسَّلامُ عَلَيْكِ يا مُمْتَحَنَةُ، إِمْتَحَنَكِ الَّذِي خَلَقَكِ فَوَجَدَكِ لِما امْتَحَنَكِ صابِرَةً، أَنا لَكِ مُصَدِّقٌ صابِرٌ عَلى ما أَتَى بِهِ أَبُوكِ وَوَصِيُّهُ صَلَواتُ الله عَلَيْهِما، وَأَنا أَسْألُكِ إِنْ كُنْتُ صَدَّقْتُكِ إِلاّ أَلْحَقْتِيِني بِتَصْدِيقِي لَهُما، لِتُسِرَّ نَفْسِي، فَاشْهَدِي أَنِّي طاهِرٌ بِوَلايَتِكِ وَوَلايَةِ آلِ بَيْتِكِ صَلَواتُ الله عَلَيْهِمْ أَجْمَعِينَ.\n\nأيضاً زِيارتُها عليها السلام بِرواية اُخرى:\n\nالسَّلامُ عَلَيْكِ يا مُمْتَحَنَةُ، إِمْتَحَنَكِ الَّذِي خَلَقَكِ قَبْلَ أَنْ يَخْلُقَكِ، وَكُنْتِ لِما امْتَحَنَكِ بِهِ صابِرَةً، وَنَحْنُ لَكِ أَوْلِياء مُصَدِّقُونَ، وَلِكُّلِ ما أَتى بِهِ أَبُوكِ صلّى الله عليه وآله، وَأَتى بِهِ وَصِيُّهُ عليه السلام مُسَلِّمُونَ، وَنَحْنُ نَسأَلُكَ اللّهُمَّ إِذْ كُنّا مُصَدِّقِينَ لَهُمْ، أَنْ تُلْحِقَنا بِتَصْدِيقِنا بِالدَّرَجَةِ العالِيَةِ، لِنُبَشِّرَ أَنْفُسَنا بِأَنّا قَدْ طَهُرْنا بِوَلايَتِهِمْ عليهم السلام.";
TEXTS['يوم الاثنين'] = "زِيارة الحَسَنِ عليه السلام يومَ الإثنين :\n\nالسَّلامُ عَلَيْكَ يَا بْنَ رَسُولِ رَبِّ الْعَالَمِينَ ، السَّلامُ عَلَيْكَ يَا بْنَ أَمِيرِ الْمُؤْمِنِينَ ، السَّلامُ عَليْكَ يَا بْنَ فاطِمَةَ الزَّهْراءِ ، السَّلامُ عَلَيْكَ يَا حَبِيبَ اللهِ ، السَّلامُ عَلَيْكَ يَا صَفْوَةَ اللهِ ، السَّلامُ عَلَيْكَ يَا أمِينَ اللهِ ، السَّلامُ عَلَيْكَ يَا حُجَّةَ اللهِ ، السَّلامُ عَلَيْكَ يَا نُورَ اللهِ ، السَّلامُ عَلَيْكَ يَا صِرَاطَ اللهِ ، السَّلامُ عَلَيْكَ يَا بَيَانَ حُكْمِ اللهِ ، السَّلامُ عَلَيْكَ يَا نَاصِرَ دِينِ اللهِ ، السَّلامُ عَلَيْكَ أَيُّهَا السَّيِّدُ الزَّكيُّ ، السَّلامُ عَلَيْكَ أَيُّهَا البَرُّ الوَفِيُّ ، السَّلامُ عَلَيْكَ أَيُّهَا الْقَائِمُ الأَمِينُ ، السَّلامُ عَلَيْكَ أَيُّهَا الْعَالِمُ بِالتَّأْوِيلِ ، السَّلامُ عَلَيْكَ أَيُّهَا الْهَادِي المَهْديُّ السَّلامُ عَلَيْكَ أَيُّهَا الطَّاهِرُ الزَّكِيُّ ، السَّلامُ عَلَيْكَ أَيُّهَا التَّقِيُّ النَّقِيُّ ، السَّلامُ عَلَيْكَ أَيُّهَا الْحَقُّ الْحَقِيقُ ، السَّلامُ عَلَيْكَ أَيُّهَا الشَّهِيدُ الصِّدِّيقُ ، السَّلامُ عَلَيْكَ يَا أَبَا مُحَمَّدٍ الْحَسَنَ بْنَ عَلِيٍّ وَّرَحْمَةُ اللهِ وَبَرَكَاتُهُ .\n\nزِيارَة الحُسَين ـ عليه السلام ـ يومَ الإثنين :\n\nاَلسَّلامُ عَلَيْكَ يَا بْنَ رَسُولِ اللهُ ، السَّلامُ عَلَيْكَ يَا بْنَ أَمِيرِ الْمُؤْمِنِينَ ، السَّلامُ عَلَيْكَ يَا بْنَ سَيِّدَةِ نِسَاءِ الْعَالَمِينَ ، أَشْهَدُ أَنَّكَ أَقَمْتَ الصَّلاةَ وَآتَيْتَ الزَّكَاةَ ، وَأَمَرْتَ بِالْمَعْرُوفِ ، وَنَهَيْتَ عَنِ الْمُنْكَرِ ، وَعَبَدتَّ الله مُخْلِصاً ، وَجاهَدتَّ فِي اللهِ حَقَّ جِهَادِهِ حَتَّى أَتَاكَ الْيَقِينُ ، فَعَلَيْكَ السَّلامُ مِنِّي مَابَقِيتُ وَبَقِيَ اللَّيْلُ وَالنَّهَارُ ، وَعَلَى آلِ بَيْتِكَ الطَّيِّبِينَ الطَّاهِرِينَ ، أَنَا يَا مَوْلايَ مَوْلًى لَّكَ وَلآلِ بَيْتِكَ ، سِلْمٌ لِّمَنْ سَالَمَكُمْ وَحَرْبٌ لِّمَنْ حَارَبَكُمْ ، مُؤْمِنٌ بِسرِّكُمْ وَجَهْرِكُمْ ، وَظَاهِرِكُمْ وَبَاطِنِكُمْ . لَعَنَ اللهُ أَعْدَاءَكُم مِّنَ الأَوَّلِينَ وَالآخِرِينَ ، وَأَنَا أَبْرَأُ إِلَى اللهِ تَعَالَى مِنْهُمْ . يَا مَوْلايَ يَا أَبَا مُحَمَّدٍ ، يَا مَوْلايَ يَا أَبَا عَبْدِ اللهِ هَذَا يَوْمُ الإِثْنَيْنِ ، وَهُوَ يَوْمُكُمَا وَبِاسْمِكُمَا وَأَنَا فِيهِ ضَيْفُكُمَا فَأَضِيفَانِي وَأَحسِنَا ضِيَافَتِي ، فَنِعْمَ مَنِ اسْتُضِيفَ بِهِ أَنْتُمَا ، وَأَنَا فِيهِ مِنْ جِوَارِكُمَا فَأَجِيرَانِي ، فَإِنَّكُمَا مَأمُورَانِ بِالضِّيَافَةِ وَالإِجَارَةِ ، فَصَلَّى اللهُ عَلَيْكُمَا وَآلِكُمَا الطَّيِّبِينَ .";
