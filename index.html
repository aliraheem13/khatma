  'دعاء العهد': "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\n اَللَّهُمَّ رَبَّ النُّورِ الْعَظِيمِ وَرَبَّ الْكُرْسِيِّ الرَّفِيعِ وَرَبَّ الْبَحْرِ الْمَسْجُورِ وَمُنْزِلَ التَّوْرَاةِ وَالإِنْجِيلِ وَالزَّبُورِ وَرَبَّ الظِّلِّ وَالْحَرُورِ وَمُنْزِلَ الْقُرْآنِ (الفُرقَان) العَظِيمِ وَرَبَّ الْمَلائِكَةِ الْمُقَرَّبِينَ وَالأَنْبِيَاءِ وَالْمُرْسَلِينَ ، اَللَّهُمَّ إِنِّي أَسْأَلُكَ باسمِكَ (بِوَجهِكَ) الْكَرِيمِ وَبِنُورِ وَجْهِكَ الْمُنِيرِ وَمُلْكِكَ القَدِيمِ ، يَا حَيُّ يَا قَيُّومُ أَسْأَلُكَ بِاسْمِكَ الَّذِي أَشْرَقَتْ بِهِ السَّمَاوَاتُ وَالأَرَضُونَ وَبِاسْمِكَ الَّذِي يَصْلُحُ بِهِ الأوَّلُونَ وَالآخِرُونَ ، يَا حَيًّا قَبْلَ كُلِّ حَيٍّ وَيَا حَيًّا بَعْدَ كُلِّ حَيٍّ وَيَا حَيًّا حِينَ لا حَيَّ يَا مُحْيِيَ الْمَوْتَى وَمُمِيتَ الأَحْيَاءِ يَا حَيُّ لا إِلَهَ إِلَّا أَنْتَ ، اَللَّهُمَّ بَلِّغْ مَوْلانَا الإِمَامَ الْهَادِيَ الْمَهْدِيَّ الْقَائِمَ بِأَمْرِكَ ـ صَلوَاتُ اللهِ عَلَيْهِ وَعَلَى آبَائِهِ الطَّاهِرِينَ ـ عَنْ جَمِيعِ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ فِي مَشَارِقِ الأَرْضِ وَمَغَارِبِهَا سَهْلِهَا وَجَبَلِهَا وَبَرِّهَا وَبَحْرِهَا وَعَنِّي وَعَن وَّالِدَيَّ مِنَ الصَّلَوَاتِ زِنَةَ عَرْشِ اللهِ وَمِدَادَ كَلِمَاتِهِ وَمَا أحْصَاهُ عِلْمُهُ وَأَحَاطَ بِهِ كِتَابُهُ ، اَللَّهُمَّ إِنِّي أُجَدِّدُ لَهُ فِي صَبِيحةِ يَوْمِي هَذَا وَمَا عِشْتُ مِنْ أَيَّامِي عَهْداً وَعَقْداً وَبَيْعَةً لَهُ فِي عُنُقِي لا أَحُولُ عَنْهَا وَلا أَزُولُ أَبَداً ، اَللَّهُمَّ اجْعَلْنِي مِنْ أَنْصَارِهِ وَأَعْوَانِهِ وَالذَّابِّينَ عَنْهُ وَالْمُسَارِعِينَ إِلَيْهِ فِي قَضاءِ حَوَائِجِهِ وَالْمُمْتَثِلِينَ لِأَوَامِرِهِ وَالْمُحَامِينَ عَنْهُ وَالسَّابِقِينَ إِلَى إِرَادَتِهِ وَالْمُسْتَشْهَدِينَ بَيْنَ يَدَيْهِ ، اَللَّهُمَّ إِنْ حَالَ بَيْنِي وَبَيْنَهُ الْمَوْتُ الَّذِي جَعَلْتَهُ عَلَى عِبَادِكَ حَتْماً مَقْضِيًّا فَأَخْرِجْنِي مِنْ قَبْرِي مُؤْتَزِراً كَفَنِي شَاهِراً سَيْفِي مُجَرِّداً قَنَاتِي مُلَبِّياً دَعْوَةَ الدَّاعِي فِي الْحَاضِرِ وَالْبَادِي ، اَللَّهُمَّ أَرِنِي الطَّلْعَةَ الرَّشِيدَةَ وَالْغُرَّةَ الْحَمِيدَةَ وَاكْحُلْ ناظِرِي بِنَظْرَةٍ مِّنِّي إِلَيْهِ وَعَجِّلْ فَرَجَهُ وَسَهِّلْ مَخْرَجَهُ وَأَوْسِعْ مَنْهَجَهُ وَاسْلُكْ بِي مَحَجَّتَهُ وَأَنْفِذْ أَمْرَهُ وَاشْدُدْ أَزْرَهُ ، وَاعْمُرِ ـ اللَّهُمَّ ـ بِهِ بِلادَكَ وَأَحْيِ بِه عِبَادَكَ فَإِنَّكَ قُلْتَ ـ وَقَوْلُكَ الْحَقُّ ـ : (( ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ )) ، فَأَظْهِرِ ـ اللَّهُمَّ ـ لَنا وَلِيَّكَ وَابْنَ بِنْتِ نَبِيِّكَ الْمُسَمّى بِاسْمِ رَسُولِكَ حَتَّى لا يَظْفَرَ بِشَيْءٍ مِنَ الْبَاطِلِ إِلَّا مَزَّقَهُ وَيَحِقَّ الْحَقَّ وَيُحَقِّقَهُ ، وَاجْعَلْهُ ـ اللّهُمَّ ـ مَفْزَعاً لِمَظْلُومِ عِبَادِكَ وَنَاصِراً لِمْن لَّا يَجِدُ لَهُ ناصِراً غَيْرَكَ وَمُجَدِّداً لِمَا عُطِّلَ مِنْ أَحْكَامِ كِتَابِكَ وَمُشَيِّداً لِّمَا وَرَدَ مِنْ أَعْلامِ دِينِكَ وَسُنَنِ نَبِيِّكَ ـ صَلَّى اللهُ عَلَيْهِ وَآلِهِ ـ ، وَاجْعَلْهُ ـ اللَّهُمَّ ـ مِمَّنْ حَصَّنْتَهُ مِنْ بَأْسِ الْمُعْتَدِينَ ، اَللَّهُمَّ وَسُرَّ نَبِيَّكَ مُحَمَّداً ـ صَلَّى اللهُ عَلَيْهِ وَآلِهِ ـ بِرُؤْيَتِهِ وَمَنْ تَبِعَهُ عَلَى دَعْوَتِهِ وَارْحَمِ اسْتِكانَتَنَا بَعْدَهُ، اَللَّهُمَّ اكْشِفْ هَذِهِ الْغُمَّةَ عَنْ هَذِهِ الأُمَّةِ بِحُضُورِهِ وَعَجِّل لَّنَا ظُهُورَهُ (( إِنَّهُمْ يَرَوْنَهُ بَعِيداً وَنَرَاهُ قَرِيباً )) بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ . ثمّ تضرب على فخذك الأيمن بيدك ثلاث مرّات وتقول كلّ مرّة : الْعَجَلَ الْعَجَلَ يَا مَوْلايَ يَا صَاحِبَ الزَّمَانِ .",
  'دعاء أبي حمزة الثمالي': "دعاء أبي حمزة الثمالي)\nبِسْمِ اللهِ الرَّحْمَنِ الرَّحِيم\n اِلهي لا تُؤَدِّبْني بِعُقُوبَتِكَ، وَلا تَمْكُرْ بي في حيلَتِكَ، مِنْ اَيْنَ لِيَ الْخَيْرُ يا رَبِّ وَلا يُوجَدُ إلاّ مِنْ عِنْدِكَ، وَمِنْ اَيْنَ لِيَ النَّجاةُ وَلا تُسْتَطاعُ إلاّ بِكَ، لاَ الَّذي اَحْسَنَ اسْتَغْنى عَنْ عَوْنِكَ وَرَحْمَتِكَ، وَلاَ الَّذي اَساءَ وَاجْتَرَأَ عَلَيْكَ وَلَمْ يُرْضِكَ خَرَجَ عَنْ قُدْرَتِكَ، يا رَبِّ يا رَبِّ يا رَبِّ (حتّى ينقطع النّفس). بِكَ عَرَفْتُكَ وَاَنْتَ دَلَلْتَني عَلَيْكَ وَدَعَوْتَني اِلَيْكَ، وَلَوْلا اَنْتَ لَمْ اَدْرِ ما اَنْتَ، اَلْحَمْدُ للهِ الَّذي اَدْعوُهُ فَيُجيبُني وَاِنْ كُنْتُ بَطيـئاً حينَ يَدْعوُني، وَاَلْحَمْدُ للهِ الَّذي اَسْأَلُهُ فَيُعْطيني وَاِنْ كُنْتُ بَخيلاً حينَ يَسْتَقْرِضُني، وَالْحَمْدُ للهِ الَّذي اُناديهِ كُلَّما شِئْتُ لِحاجَتي، وَاَخْلُو بِهِ حَيْثُ شِئْتُ، لِسِرِّي بِغَيْرِ شَفيع فَيَقْضِي لي حاجَتي، اَلْحَمْدُ للهِ الَّذي لا اَدْعُو غَيْرَهُ وَلَوْ دَعَوْتُ غَيْرَهُ لَمْ يَسْتَجِبْ لي دُعائي، وَالْحَمْدُ للهِ الَّذي لا اَرْجُو غَيْرَهُ وَلَوْ رَجَوْتُ غَيْرَهُ لاَخْلَفَ رَجائي، وَالْحَمْدُ للهِ الَّذي وَكَلَني اِلَيْهِ فَاَكْرَمَني وَلَمْ يَكِلْني اِلَى النّاسِ فَيُهينُوني، وَالْحَمْدُ للهِ الَّذي تَحَبَّبَ اِلَىَّ وَهُوَ غَنِيٌّ عَنّي، وَالْحَمْدُ للهِ الَّذي يَحْلُمُ عَنّي حَتّى كَاَنّي لا ذَنْبَ لي، فَرَبّي اَحْمَدُ شَيْء عِنْدي، وَاَحَقُّ بِحَمْدي، اَللّـهُمَّ اِنّي اَجِدُ سُبُلَ الْمَطالِبِ اِلَيْكَ مُشْرَعَةً، وَمَناهِلَ الرَّجاءِ لديك (اِلَيْكَ) مُتْرَعَةً، وَالاسْتِعانَةَ بِفَضْلِكَ لِمَنْ اَمَّلَكَ مُباحَةً، وَاَبْوابَ الدُّعاءِ اِلَيْكَ لِلصّارِخينَ مَفْتُوحَةً، وَاَعْلَمُ اَنَّكَ لِلرّاجينَ (للرّاجي) بِمَوْضِعِ اِجابَة، وَلِلْمَلْهُوفينَ بِمَرْصَدِ اِغاثَة، وَاَنَّ فِي اللَّهْفِ اِلى جُودِكَ وَالرِّضا بِقَضائِكَ عِوَضاً مِنْ مَنْعِ اْلباِخلينَ، وَمَنْدُوحَةً عَمّا في اَيْدي الْمُسْتَأثِرينَ، وَاَنَّ الِراحِلَ اِلَيْكَ قَريبُ الْمَسافَةِ، وَاَنَّكَ لا تَحْتَجِبُ عَنْ خَلْقِكَ إلاّ اَنْ تَحْجُبَهُمُ الاَعمالُ (الآمالُ) دُونَكَ، وَقَدْ قَصَدْتُ اِلَيْكَ بِطَلِبَتي، وَتَوَجَّهْتُ اِلَيْكَ بِحاجَتي، وَجَعَلْتُ بِكَ اسْتِغاثَتي، وَبِدُعائِكَ تَوَسُّلي مِنْ غَيْرِ اِسْتِحْقاق لاِسْتِماعِكَ مِنّي، وَلاَ اسْتيجاب لِعَفْوِكَ عَنّي، بَلْ لِثِقَتي بِكَرَمِكَ، وَسُكُوني اِلى صِدْقِ وَعْدِكَ، وَلَجَئِي اِلَى الاْيمانِ بِتَوْحيدِكَ، وَيَقيني بِمَعْرِفَتِكَ مِنّي اَنْ لا رَبَّ لي غَيْرُكَ، وَلا اِلـهَ (لِي) إلاّ اَنْتَ وَحْدَكَ لا شَريكَ لَكَ، اَللّـهُمَّ اَنْتَ الْقائِلُ وَقَوْلُكَ حَقٌّ، وَوَعْدُكَ صِدْقٌ (ووعدُكَ الصّدقُ) وَاسْأَلوُا اللهَ مِنْ فَضْلِهِ اِنَ اللهَ كانَ بِكُمْ رَحيماً، وَلَيْسَ مِنْ صِفاتِكَ يا سَيّدي أنْ تَأمُرَ بِالسُّؤالِ وَتَمْنَعَ الْعَطِيَّةَ، وَاَنْتَ الْمَنّانُ بِالْعَطِيّاتِ عَلى اَهْلِ مَمْلَكَتِكَ، وَالْعائِدُ عَلَيْهِمْ بِتَحَنُّنِ رَأفَتِكَ (بِحُسنِ نِعمَتِك)، اِلهي رَبَّيْتَني في نِعَمِكَ وَاِحْسانِكَ صَغيراً، وَنَوَّهْتَ بِاِسْمي كَبيراً، فَيا مَنْ رَبّاني فِي الدُّنْيا بِاِحْسانِهِ وَتَفَضُّلِهِ (وبِفضلِهِ) وَنِعَمِهِ، وَاَشارَ لي فِي الاْخِرَةِ اِلى عَفْوِهِ وَكَرَمِهِ، مَعْرِفَتي يا مَوْلايَ دَليلي (دَلّتني) عَلَيْكَ، وَحُبّي لَكَ شَفيعي اِلَيْكَ، وَاَنَا واثِقٌ مِنْ دَليلي بِدَلالَتِكَ، وَساكِنٌ مِنْ شَفيعي اِلى شَفاعَتِكَ، اَدْعُوكَ يا سَيِّدي بِلِسان قَدْ اَخْرَسَهُ ذَنْبُهُ، رَبِّ اُناجيكَ بِقَلْب قَدْ اَوْبَقَهُ جُرْمُهُ، اَدْعوُكَ يا رَبِّ راهِباً راعِباً، راجِياً خائِفاً، اِذا رَاَيْتُ مَوْلايَ ذُنُوبي فَزِعْتُ، وَاِذا رَاَيْتُ كَرَمَكَ طَمِعْتُ، فَاِنْ عَفَوْتَ (فإن غَفَرتَ) فَخَيْرُ راحِم، وَاِنْ عَذَّبْتَ فَغَيْرُ ظالِم، حُجَّتي يا اَللهُ في جُرْأَتي عَلى مَسْأَلَتِكَ، مَعَ اِتْياني ما تَكْرَهُ، جُودُكَ وَكَرَمُكَ، وَعُدَّتي في شِدَّتي مَعَ قِلَّةِ حَيائي رَأفَتُكَ وَرَحْمَتُكَ، وَقَدْ رَجَوْتُ اَنْ لا تَخيبَ بَيْنَ ذَيْنِ وَذَيْنِ مُنْيَتي، فَحَقِّقْ رَجائي، وَاَسْمَعْ دُعائي يا خَيْرَ مَنْ دَعاهُ داع، وَاَفْضَلَ مَنْ رَجاهُ راجٍ، عَظُمَ يا سَيِّدي اَمَلي، وَساءَ عَمَلي، فَاَعْطِني مِنْ عَفْوِكَ بِمِقْدارِ اَمَلي، وَلا تُؤاخِذْني بِأَسْوَأ عَمَلي، فَاِنَّ كَرَمَكَ يَجِلُّ عَنْ مُجازاةِ الْمُذْنِبينَ، وَحِلْمَكَ يَكْبُرُ عَنْ مُكافَاةِ الْمُقَصِّرينَ. وَاَنَا يا سَيِّدي عائِذٌ بِفَضْلِكَ، هارِبٌ مِنْكَ اِلَيْكَ، مُتَنَجِّزٌ ما وَعَدْتَ مِنَ الصَّفْحِ عَمَّنْ اَحْسَنَ بِكَ ظَنّاً، وَما اَنَا يا رَبِّ وَما خَطَري، هَبْني بِفَضْلِكَ، وَتَصَدَّقْ عَلَيَّ بِعَفْوِكَ اَيْ رَبِّ جَلِّلْني بِسَتْرِكَ، وَاعْفُ عَنْ تَوْبيخي بِكَرَمِ وَجْهِكَ، فَلَوِ اطَّلَعَ الْيَوْمَ عَلى ذَنْبي غَيْرُكَ ما فَعَلْتُهُ، وَلَوْ خِفْتُ تَعْجيلَ الْعُقُوبَةِ لاَجْتَنَبْتُهُ، لا لاَنَّكَ اَهْوَنُ النّاظِرينَ إلَيَّ وَاَخَفُّ الْمُطَّلِعينَ عَلَيَّ ، بَلْ لاَنَّكَ يا رَبِّ خَيْرُ السّاتِرينَ، وَاَحْكَمُ الْحاكِمينَ، وَاَكْرَمُ الاَكْرَمينَ، سَتّارُ الْعُيُوبِ، غَفّارُ الذُّنُوبِ، عَلاّمُ الْغُيُوبِ، تَسْتُرُ الذَّنْبِ بِكَرَمِكَ، وَتُؤَخِّرُ الْعُقُوبَةَ بِحِلْمِكَ، فَلَكَ الْحَمْدُ عَلى حِلْمِكَ بَعْدَ عِلْمِكَ، وَعَلى عَفْوِكَ بَعْدَ قُدْرَتِكَ، وَيَحْمِلُني وَيُجَرِّئُني عَلى مَعْصِيَتِكَ حِلْمُكَ عَنّي، وَيَدْعُوني اِلى قِلَّةِ الْحَياءِ سِتْرُكَ عَلَيَّ، وَيُسْرِعُني اِلَى التَّوَثُّبِ عَلى مَحارِمِكَ مَعْرِفَتي بِسِعَةِ رَحْمَتِكَ، وَعَظيمِ عَفْوِكَ، يا حَليمُ يا كَريمُ، يا حَيُّ يا قَيُّومُ، يا غافِرَ الذَّنْبِ، يا قابِلَ التَّوْبِ، يا عَظيمَ الْمَنِّ، يا قَديمَ الاِحسانِ، اَيْنَ سَترُكَ الْجَميلُ، اَيْنَ عَفْوُكَ الْجَليلُ، اَيْنَ فَرَجُكَ الْقَريبُ، اَيْنَ غِياثُكَ السَّريعُ، اَيْنَ رَحْمَتُكَ الْواسِعَةُ، اَيْنَ عَطاياكَ الْفاضِلَةُ، اَيْنَ مَواهِبُكَ الْهَنيئَةُ، اَيْنَ صَنائِعُكَ السَّنِيَّةُ، اَيْنَ فَضْلُكَ الْعَظيمُ، اَيْنَ مَنُّكَ الْجَسيمُ، اَيْنَ اِحْسانُكَ الْقَديمُ، اَيْنَ كَرَمُكَ يا كَريمُ، بِهِ (وبمحمد وآل محمد) فَاسْتَنْقِذْني، وَبِرَحْمَتِكَ فَخَلِّصْني، يا مُحْسِنُ يا مُجْمِلُ، يا مُنْعِمُ يا مُفْضِلُ، لَسْتُ اَتَّكِلُ فِي النَّجاةِ مِنْ عِقابِكَ عَلى اَعْمالِنا، بَلْ بِفَضْلِكَ عَلَيْنا، لاَنَّكَ اَهْلَ التَّقْوى وَاَهْلَ الْمَغْفِرَةِ تُبْدِئُ بِالاِْحْسانِ نِعَماً، وَتَعْفُو عَنِ الذَّنْبِ كَرَماً، فَما نَدْري ما نَشْكُرُ، اَجَميلَ ما تَنْشُرُ، اَمْ قَبيحَ ما تَسْتُرُ، اَمْ عَظيمَ ما اَبْلَيْتَ وَاَوْلَيْتَ، اَمْ كَثيرَ ما مِنْهُ نَجَّيْتَ وَعافَيْتَ، يا حَبيبَ مَنْ تَحَبَّبَ اِلَيْكَ، وَيا قُرَّةَ عَيْنِ مَنْ لاذَ بِكَ وَانْقَطَعَ اِلَيْكَ، اَنْتَ الُْمحْسِنُ وَنَحْنُ الْمُسيؤنَ فَتَجاوَزْ يا رَبِّ عَنْ قَبيحِ ما عِنْدَنا بِجَميلِ ما عِنْدَكَ، وَاَيُّ جَهْل يا رَبِّ لا يَسَعُهُ جُودُكَ، اَوْ اَيُّ زَمان اَطْوَلُ مِنْ اَناتِكَ، وَما قَدْرُ اَعْمالِنا في جَنْبِ نِعَمِكَ، وَكَيْفَ نَسْتَكْثِرُ اَعْمالاً نُقابِلُ بِها كَرَمَكَ (كَرَامَتَك)، بَلْ كَيْفَ يَضيقُ عَلَى الْمُذْنِبينَ ما وَسِعَهُمْ مِنْ رَحْمَتِكَ، يا واسِعَ الْمَغْفِرَةِ، يا باسِطَ الْيَدَيْنِ بِالرَّحْمَةِ، فَوَعِزَّتِكَ يا سَيِّدي، لَوْ نَهَرْتَني ما بَرِحْتُ مِنْ بابِكَ، وَلا كَفَفْتُ عَنْ تَمَلُّقِكَ، لِمَا انْتَهى اِلَىَّ مِنَ الْمَعْرِفَةِ بِجُودِكَ وَكَرِمَك، وَاَنْتَ الْفاعِلُ لِما تَشاءُ تُعَذِّبُ مَنْ تَشاءُ بِما تَشاءُ كَيْفَ تَشاءُ، وَتَرْحَمُ مَنْ تَشاءُ بِما تَشاءُ كَيْفَ تَشاءُ، لا تُسْأَلُ عَنْ فِعْلِكَ، وَلا تُنازَعُ في مُلْكِكَ، وَلا تُشارَكُ في اَمْرِكَ، وَلا تُضادُّ في حُكْمِكَ، وَلا يَعْتَرِضُ عَلَيْكَ اَحَدٌ في تَدْبيرِكَ، لَكَ الْخَلْقُ وَالاَْمْرُ، تَبارَكَ اللهُ رَبُّ الْعالَمينَ، يا رَبِّ هذا مَقامُ مَنْ لاذَ بِكَ، وَاسْتَجارَ بِكَرَمِكَ، وَاَلِفَ اِحْسانَكَ وَنِعَمَكَ وَاَنْتَ الْجَوادُ الَّذي لا يَضيقُ عَفُْوكَ، وَلا يَنْقُصُ فَضْلُكَ، وَلا تَقِلُّ رَحْمَتُكَ، وَقَدْ تَوَثَّقْنا مِنْكَ بِالصَّفْحِ الْقَديمِ، وَالْفَضْلِ الْعَظيمِ، وَالرَّحْمَةِ الْواسِعَةِ، اَفَتَراكَ يا رَبِّ تُخْلِفُ ظُنُونَنا، اَوْ تُخَيِّبْ آمالَنا. كَلاّ يا كَريمُ، فَلَيْسَ هذا ظَنُّنا بِكَ، وَلا هذا فيكَ طَمَعُنا يا رَبِّ اِنَّ لَنا فيكَ اَمَلاً طَويلاً كَثيراً، اِنَّ لَنا فيكَ رَجاءً عَظيماً، عَصَيْناكَ وَنَحْنُ نَرْجُو اَنْ تَسْتُرَ عَلَيْنا، وَدَعَوْناكَ وَنَحْنُ نَرْجُو اَنْ تَسْتَجيبَ لَنا، فَحَقِّقْ رَجاءَنا مَوْلانا، فَقَدْ عَلِمْنا ما نَسْتَوْجِبُ بِاَعْمالِنا، وَلكِنْ عِلْمُكَ فينا وَعِلْمُنا بِاَنَّكَ لا تَصْرِفُنا عَنْكَ حَثّنا على الرّغبةِ إليك وَاِنْ كُنّا غَيْرَ مُسْتَوْجِبينَ لِرَحْمَتِكَ، فَاَنْتَ اَهْلٌ اَنْ تَجُودَ عَلَيْنا وَعَلَى الْمُذْنِبينَ بِفَضْلِ سَعَتِكَ، فَامْنُنْ عَلَيْنا بِما اَنْتَ اَهْلُهُ، وَجُدْ عَلَيْنا فَاِنّا مُحْتاجُونَ اِلى نَيْلِكَ، يا غَفّارُ بِنُورِكَ اهْتَدَيْنا، وَبِفَضْلِكَ اسْتَغْنَيْنا، وَبِنِعْمَتِكَ (وفي نِعَمِكَ) اَصْبَحْنا وَاَمْسَيْنا، ذُنُوبَنا بَيْنَ يَدَيْكَ نَسْتَغْفِرُكَ الّلهُمَّ مِنْها وَنَتُوبُ اِلَيْكَ، تَتَحَبَّبُ اِلَيْنا بِالنِّعَمِ وَنُعارِضُكَ بِالذُّنُوبِ، خَيْرُكَ اِلَيْنا نازِلٌ، وَشُّرنا اِلَيْكَ صاعِدٌ، وَلَمْ يَزَلْ وَلا يَزالُ مَلَكٌ كَريمٌ يَأتيكَ عَنّا بِعَمَل قَبيح، فَلا يَمْنَعُكَ ذلِكَ مِنْ اَنْ تَحُوطَنا بِنِعَمِكَ، وَتَتَفَضَّلَ عَلَيْنا بِآلائِكَ، فَسُبْحانَكَ ما اَحْلَمَكَ وَاَعْظَمَكَ وَاَكْرَمَكَ مُبْدِئاً وَمُعيداً، تَقَدَّسَتْ اَسْماؤكَ وَجَلَّ ثَناؤُكَ، وَكَرُمَ صَنائِعُكَ وَفِعالُكَ، اَنْتَ اِلهي اَوْسَعُ فَضْلاً، وَاَعْظَمُ حِلْماً مِنْ اَنْ تُقايِسَني بِفِعْلي وَخَطيـئَتي، فَالْعَفْوَ الْعَفْوَ الْعَفْوَ، سَيِّدي سَيِّدي سَيِّدي، اَللّـهُمَّ اشْغَلْنا بِذِكْرِكَ، وَاَعِذْنا مِنْ سَخَطِكَ، وَاَجِرْنا مِنْ عَذابِكَ، وَارْزُقْنا مِنْ مَواهِبِكَ، وَاَنْعِمْ عَلَيْنا مِنْ فَضْلِكَ، وَارْزُقْنا حَجَّ بَيْتِكَ، وَزِيارَةَ قَبْرِ نَبِيِّكَ صَلَواتُكَ وَرَحْمَتُكَ وَمَغْفِرَتُكَ وَرِضْوانُكَ عَلَيْهِ وَعَلى اَهْلِ بَيْتِهِ اِنَّكَ قَريبٌ مُجيبٌ، وَارْزُقْنا عَمَلاً بِطاعَتِكَ، وَتَوَفَّنا عَلى مِلَّتِكَ، وَسُنَّةِ نَبِيِّكَ صَلَّى اللهُ عَلَيْهِ وَآلِهِ. اَللّـهُمَّ اغْفِرْ لي وَلِوالِدَيَّ وَارْحَمْهُما كَما رَبَّياني صَغيراً، اِجْزِهما بِالاِْحسانِ اِحْساناً وَبِالسَّيِّئاتِ غُفْراناً، اَللّـهُمَّ اغْفِرْ لِلْمُؤْمِنينَ وَالْمُؤْمِناتِ الاَْحياءِ مِنْهُمْ وَالاَْمواِت، وَتابِعْ بَيْنَنا وَبَيْنَهُمْ بِالْخَيْراتِ اَللّـهُمَّ اغْفِرْ لِحَيِّنا وَمَيِّتِنا، وَشاهِدِنا وَغائِبِنا، ذَكَرِنا وَاُنْثانا (وإنَاثِنَا)، صَغيرِنا وَكَبيرِنا، حُرِّنا وَمَمْلُوكِنا، كَذَبَ الْعادِلُونَ بِاللهِ وَضَلُّوا ضَلالاً بَعيداً، وَخَسِرُوا خُسْراناً مُبيناً، اَللّـهُمَّ صَلِّ عَلى مُحَمَّد وَآلِ مُحَمَّد، وَاخْتِمْ لي بِخَيْر، وَاكْفِني ما اَهَمَّني مِنْ اَمْرِ دُنْيايَ وَآخِرَتي وَلا تُسَلِّطْ عَلَيَّ مَنْ لا يَرْحَمُني، وَاجْعَلْ عَلَيَّ مِنْكَ واقِيَةً باقِيَةً، وَلا تَسْلُبْني صالِحَ ما اَنْعَمْتَ بِهِ عَلَيَّ، وَارْزُقْني مِنْ فَضْلِكَ رِزْقاً واسِعاً حَلالاً طَيِّباً، اَللّـهُمَّ احْرُسْني بِحَراسَتِكَ، وَاحْفَظْني بِحِفْظِكَ، وَاكْلأني بِكِلاءَتِكَ، وَارْزُقْني حَجَّ بَيْتِكَ الْحَرامِ في عامِنا هذا وَفي كُلِّ عام، وَزِيارَةَ قَبْرِ نَبِيِّكَ وَالاَْئِمَّةِ عَلَيْهِمُ السَّلامُ، وَلا تُخْلِني يا رَبِّ مِنْ تِلْكَ الْمَشاهِدِ الشَّريفَةِ، وَالْمَواقِفِ الْكَريمَةِ، اَللّـهُمَّ تُبْ عَلَيَّ حَتّى لا اَعْصِيَكَ، وَاَلْهِمْنِيَ الْخَيْرَ وَالْعَمَلَ بِهِ، وَخَشْيَتَكَ بِاللَّيْلِ وَالنَّهارِ ما اَبْقَيْتَني يا رَبَّ الْعالَمينَ، اَللّـهُمَّ اِنّي كُلَّما قُلْتُ قَدْ تَهَيَّأتُ وَتَعَبَّأتُ وَقُمْتُ لِلصَّلاةِ بَيْنَ يَدَيْكَ وَناجَيْتُكَ اَلْقَيْتَ عَلَيَّ نُعاساً اِذا اَنَا صَلَّيْتُ، وَسَلَبْتَني مُناجاتِكَ اِذا اَنَا ناجَيْتُ، مالي كُلَّما قُلْتُ قَدْ صَلُحَتْ سَريرَتي، وَقَرُبَ مِنْ مَجالِسِ التَّوّابينَ مَجْلِسي عَرَضَتْ لي بَلِيَّةٌ اَزالَتْ قَدَمي، وَحالَتْ بَيْني وَبَيْنَ خِدْمَتِكَ سَيِّدي لَعَلَّكَ عَنْ بابِكَ طَرَدْتَني، وَعَنْ خِدْمَتِكَ نَحَّيْتَني اَوْ لَعَلَّكَ رَاَيْتَني مُسْتَخِفّاً بِحَقِّكَ فَاَقْصَيْتَني، اَوْ لَعَلَّكَ رَاَيْتَني مُعْرِضاً عَنْكَ فَقَلَيْتَني، اَوْ لَعَلَّكَ وَجَدْتَني في مَقامِ الْكاذِبينَ (الكذّابين) فَرَفَضْتَني، اَوْ لَعَلَّكَ رَاَيْتَني غَيْرَ شاكِر لِنَعْمائِكَ فَحَرَمْتَني، اَوْ لَعَلَّكَ فَقَدْتَني مِنْ مَجالِسِ الْعُلَماءِ فَخَذَلْتَني، اَوْ لَعَلَّكَ رَاَيْتَني فِى الْغافِلينَ فَمِنْ رَحْمَتِكَ آيَسْتَني، اَوْ لَعَلَّكَ رَأَيْتَنِي آلفَ مَجالِسِ الْبَطّالينَ فَبَيْني وَبَيْنَهُمْ خَلَّيْتَني، اَوْ لَعَلَّكَ لَمْ تُحِبَّ اَنْ تَسْمَعَ دُعائي فَباعَدْتَني، اَوْ لَعَلَّكَ بِجُرْمي وَجَريرَتي كافَيْتَني، اَوْ لَعَلَّكَ بِقِلَّةِ حَيائي مِنْكَ جازَيْتَني، فَاِنْ عَفَوْتَ يا رَبِّ فَطالما عَفَوْتَ عَنِ الْمُذْنِبينَ قَبْلي، لأَنَّ كَرَمَكَ اَيْ رَبِّ يَجِلُّ عَنْ مُكافاةِ الْمُقَصِّرينَ، وَاَنَا عائِذٌ بِفَضْلِكَ، هارِبٌ مِنْكَ اِلَيْكَ، مُتَنَجِّزٌ (مُنتَجِزٌ) ما وَعَدْتَ مِنَ الصَّفْحِ عَمَّنْ اَحْسَنَ بِكَ ظَنّاً، اِلهي اَنْتَ اَوْسَعُ فَضْلاً، وَاَعْظَمُ حِلْماً مِنْ اَنْ تُقايِسَني بِعَمَلي اَوْ اَنْ تَسْتَزِلَّني بِخَطيئَتي، وَما اَنَا يا سَيِّدي وَما خَطَري، هَبْني بِفَضْلِكَ سَيِّدي، وَتَصَدَّقْ عَلَيَّ بِعَفْوِكَ، وَجَلِّلْني بِسَتْرِكَ، وَاعْفُ عَنْ تَوْبيخي بِكَرَمِ وَجْهِكَ، سَيِّدي اَنَا الصَّغيرُ الَّذي رَبَّيْتَهُ، وَاَنَا الْجاهِلُ الَّذي عَلَّمْتَهُ، وَاَنَا الضّالُّ الَّذي هَدَيْتَهُ، وَاَنَا الْوَضيعُ الَّذي رَفَعْتَهُ، وَاَنَا الْخائِفُ الَّذي آمَنْتَهُ، وَالْجايِعُ الَّذي اَشْبَعْتَهُ، وَالْعَطْشانُ الَّذي اَرْوَيْتَهُ، وَالْعاري الَّذي كَسَوْتَهُ، وَالْفَقيرُ الَّذي اَغْنَيْتَهُ، وَالضَّعيفُ الَّذي قَوَّيْتَهُ، وَالذَّليلُ الَّذي اَعْزَزْتَهُ، وَالسَّقيمُ الَّذي شَفَيْتَهُ، وَالسّائِلُ الَّذي اَعْطَيْتَهُ، وَالْمُذْنِبُ الَّذي سَتَرْتَهُ، وَالْخاطِئُ الَّذي اَقَلْتَهُ، وَاَنَا الْقَليلُ الَّذي كَثَّرْتَهُ، وَالْمُسْتَضْعَفُ الَّذي نَصَرْتَهُ، وَاَنَا الطَّريدُ الَّذي آوَيْتَهُ. اَنَا يا رَبِّ الَّذي لَمْ اَسْتَحْيِكَ فِى الْخَلاءِ، وَلَمْ اُراقِبْكَ فِى الْمَلاءِ، اَنَا صاحِبُ الدَّواهِي الْعُظْمى، اَنَا الَّذي عَلى سَيِّدِهِ اجْتَرأ، اَنَا الَّذي عَصَيْتُ جَبّارَ السَّماءِ، اَنَا الَّذي اَعْطَيْتُ عَلى مَعاصِى الْجَليلِ (عَلى المَعَاصِي جَليلَ) الرُّشَى، اَنَا الَّذي حينَ بُشِّرْتُ بِها خَرَجْتُ اِلَيْها اَسْعى، اَنَا الَّذي اَمْهَلْتَنِي فَما ارْعَوَيْتُ، وَسَتَرْتَ عَلَيَّ فَمَا اسْتَحْيَيْتُ، وَعَمِلْتُ (وعَلِمتُ) بِالْمَعاصي فَتَعَدَّيْتُ، وَاَسْقَطْتَني مِنْ عَيْنِكَ (من عِندِكَ) فَما بالَيْتُ، فَبِحِلْمِكَ اَمْهَلْتَني وَبِسِتْرِكَ سَتَرْتَني حَتّى كَاَنَّكَ اَغْفَلْتَني، وَمِنْ عُقُوباتِ الْمَعاصي جَنَّبْتَني حَتّى كَاَنَّكَ اسْتَحْيَيْتَني، اِلهي لَمْ اَعْصِكَ حينَ عَصَيْتُكَ وَاَنَا بِرُبُوبِيَّتِكَ جاحِدٌ، وَلا بِاَمْرِكَ مُسْتَخِفٌّ، وَلا لِعُقُوبَتِكَ مُتَعَرِّضٌّ، وَلا لِوَعيدِكَ مُتَهاوِنٌ، لكِنْ خَطيئَةٌ عَرَضَتْ وَسَوَّلَتْ لي نَفْسي، وَغَلَبَني هَوايَ، وَاَعانَني عَلَيْها شِقْوَتي، وَغَرَّني سِتْرُكَ الْمُرْخى عَلَىَّ، فَقَدْ عَصَيْتُكَ وَخالَفْتُكَ بِجَهْدي، فَالآنَ مِنْ عَذابِكَ مَنْ يَسْتَنْقِذُني، وَمِنْ اَيْدي الْخُصَماءِ غَداً مِنْ يُخَلِّصُني، وَبِحَبْلِ مَنْ اَتَّصِلُ اِنْ اَنْتَ قَطَعْتَ حَبْلَكَ عَنّي، فَوَاسَوْأتا (فَوا أسفَا) عَلى ما اَحْصى كِتابُكَ مِنْ عَمَلِيَ الَّذي لَوْلا ما اَرْجُو مِنْ كَرَمِكَ وَسَعَةِ رَحْمَتِكَ وَنَهْيِكَ اِيّايَ عَنِ الْقُنُوطِ لَقَنَطْتُ عِنْدَما اَتَذَكَّرُها، يا خَيْرَ مَنْ دَعاهُ داع، وَاَفْضَلَ مَنْ رَجاهُ راج، اَللّـهُمَّ بِذِمَّةِ الاِْسْلامِ اَتَوَسَّلُ اِلَيْكَ، وَبِحُرْمَةِ الْقُرْآنِ اَعْتَمِدُ عَلَيْكَ، وَبِحُبِّيَ النَّبِيَّ الاُْمِّيَّ الْقُرَشِيَّ الْهاشِمِيَّ الْعَرَبِيَّ التِّهامِيَّ الْمَكِّيَّ الْمَدَنِيَّ اَرْجُو الزُّلْفَةَ لَدَيْكَ، فَلا تُوحِشِ اسْتِئنَاسَ ايماني، وَلا تَجْعَلْ ثَوابي ثَوابَ مَنْ عَبَدَ سِواكَ، فَاِنَّ قَوْماً آمَنُوا بِاَلْسِنَتِهِمْ لِيَحْقِنُوا بِهِ دِماءَهُمْ فَاَدْرَكُوا ما اَمَّلُوا، َوَإنّا آمَنَّا بِكَ بِاَلْسِنَتِنا وَقُلُوبِنا لِتَعْفُوَ عَنّا فَاَدْرِكْنا (فأدرِك بِنَا) ما اَمَّلْنا، وَثَبِّتْ رَجاءَكَ في صُدُورِنا، وَلا تُزِغْ قُلُوبَنا بَعْدَ اِذْ هَدَيْتَنا، وَهَبْ لَنا مِنْ لَدُنْكَ رَحْمَةً اِنَّكَ اَنْتَ الْوَهّابُ، فَوَعِزَّتِكَ لَوِ انْتَهَرْتَني ما بَرِحْتُ مِنْ بابِكَ، وَلا كَفَفْتُ عَنْ تَمَلُّقِكَ لِما اُلْهِمَ قَلْبي (يا سيدي) مِنَ الْمَعْرِفَةِ بِكَرَمِكَ وَسَعَةِ رَحْمَتِكَ، اِلى مَنْ يَذْهَبُ الْعَبْدُ إلاّ اِلى مَوْلاهُ، وَاِلى مَنْ يَلْتَجِئُ الَْمخْلُوقُ إلاّ اِلى خالِقِهِ، اِلهي لَوْ قَرَنْتَني بِالاَْصْفادِ، وَمَنَعْتَني سَيْبَكَ مِنْ بَيْنِ الاَْشْهادِ، وَدَلَلْتَ عَلى فَضايِحي عُيُونَ الْعِبادِ، وَاَمَرْتَ بي اِلَى النّارِ، وَحُلْتَ بَيْني وَبَيْنَ الاَْبْرارِ، ما قَطَعْتُ رَجائي مِنْكَ وَما صَرَفْتُ تَأميلي لِلْعَفْوِ عَنْكَ، وَلا خَرَجَ حُبُّكَ مِنْ قَلْبي، اَنَا لا اَنْسى اَيادِيَكَ عِنْدي، وَسِتْرَكَ عَلَيَّ في دارِ الدُّنْيا، سَيِّدي اَخْرِجْ حُبَّ الدُّنْيا مِنْ قَلْبي، وَاجْمَعْ بَيْني وَبَيْنَ الْمُصْطَفى وَآلِهِ خِيَرَتِكَ مِنْ خَلْقِكَ وَخاتَمِ النَّبِيّينَ مُحَمَّد صَلَّى اللهُ عَلَيْهِ وَآلِهِ، وَانْقُلْني اِلى دَرَجَةِ الَّتوْبَةِ اِلَيْكَ، وَاَعِنّي بِالْبُكاءِ عَلى نَفْسي، فَقَدْ اَفْنَيْتُ بِالتَّسْويفِ وَالآمَالِ عُمْري، وَقَدْ نَزَلْتُ مَنْزِلَةَ الاْيِسينَ مِنْ خَيْري (من حَياتِي)، فَمَنْ يَكُونُ اَسْوَأ حالاً مِنّي إنْ اَنَا نُقِلْتُ عَلى مِثْلِ حالي اِلى قَبْري (قَبرٍ)، لَمْ اُمَهِّدْهُ لِرَقْدَتي، وَلَمْ اَفْرُشْهُ بِالْعَمَلِ الصّالِحِ لِضَجْعَتي، وَمالي لا اَبْكي وَلا اَدْري اِلى ما يَكُونُ مَصيري، وَاَرى نَفْسي تُخادِعُني، وَاَيّامي تُخاتِلُني، وَقَدْ خَفَقَتْ عِنْدَ رَأسي (فوقَ رأسي) اَجْنِحَةُ الْمَوْتِ، فَمالي لا اَبْكي اَبْكي، لِخُُروجِ نَفْسي، اَبْكي لِظُلْمَةِ قَبْري، اَبْكي لِضيقِ لَحَدي، اَبْكي لِسُؤالِ مُنْكَر وَنَكير اِيّايَ، اَبْكي لِخُرُوجي مِنْ قَبْري عُرْياناً ذَليلاً حامِلاً ثِقْلي عَلى ظَهْري، اَنْظُرُ مَرَّةً عَنْ يَميني وَاُخْرى عَنْ شِمالي، اِذِ الْخَلائِقِ في شَأن غَيْرِ شَأني (لِكُلِّ امْرِئ مِنْهُمْ يَوْمَئِذ شَأنٌ يُغْنيهِ * وُجوُهٌ يَوْمَئِذ مُسْفِرَةٌ * ضاحِكَةٌ مُسْتَبْشِرَةٌ * وَوُجوُهٌ يَوْمَئِذ عَلَيْها غَبَرَةٌ * تَرْهَقُها قَتَرَةٌ) وَذِلَّةٌ، سَيِّدي عَلَيْكَ مُعَوَّلي وَمُعْتَمَدي وَرَجائي وَتَوَكُّلي، وَبِرَحْمَتِكَ تَعَلُّقي، تُصيبُ بِرَحْمَتِكَ مَنْ تَشاءُ وَتَهْدي بِكَرامَتِكَ مَنْ تُحِبُّ، فَلَكَ الْحَمْدُ عَلى ما نَقَّيْتَ مِنَ الشِّرْكِ قَلْبي، وَلَكَ الْحَمْدُ عَلى بَسْطِ لِساني، اَفَبِلِساني هذَا الْكالِّ اَشْكُرُكَ، اَمْ بِغايَةِ جُهْدي في عَمَلي اُرْضيكَ، وَما قَدْرُ لِساني يا رَبِّ في جَنْبِ شُكْرِكَ، وَما قَدْرُ عَمَلي في جَنْبِ نِعَمِكَ وَاِحْسانِكَ (إليّ إلا أنّ جودك)، اِلهي اِنَّ جُودَكَ بَسَطَ اَمَلي، وَشُكْرَكَ قَبِلَ عَمَلي، سَيِّدي اِلَيْكَ رَغْبَتي، وَاِلَيْكَ (ومنك) رَهْبَتي، وَاِلَيْكَ تَأميلي، وَقَدْ ساقَني اِلَيْكَ اَمَلي، وَعَلَيْكَ يا واحِدي عَكَفَتْ (وإليك يا واجدي عَلِقَت) هِمَّتي، وَفيـما عِنْدَكَ انْبَسَطَتْ رَغْبَتي، وَلَكَ خالِصُ رَجائي وَخَوْفي، وَبِكَ أَنِسَتْ مَحَبَّتي، وَاِلَيْكَ اَلْقَيْتُ بِيَدي، وَبِحَبْلِ طاعَتِكَ مَدَدْتُ رَهْبَتي، يا مَوْلايَ بِذِكْرِكَ عاشَ قَلْبي، وَبِمُناجاتِكَ بَرَّدْتُ اَلَمَ الْخَوْفِ عَنّي، فَيا مَوْلايَ وَيا مُؤَمَّلي وَيا مُنْتَهى سُؤْلي فَرِّقْ بَيْني وَبَيْنَ ذَنْبِيَ الْمانِعِ لي مِنْ لُزُومِ طاعَتِكَ، فَاِنَّما اَسْاَلُكَ لِقَديمِ الرَّجاءِ فيكَ، وَعَظيمِ الطَّمَعِ مِنْكَ، الَّذي اَوْجَبْتَهُ عَلى نَفْسِكَ مِنَ الرَّأفَةِ وَالرَّحْمَةِ، فَالاَمْرُ لَكَ، وَحْدَكَ لا شَريكَ لَكَ وَالْخَلْقُ كُلُّهُمْ عِيالُكَ وَفي قَبْضَتِكَ، وَكُلُّ شَيْي خاضِعٌ لَكَ تَبارَكْتَ يا رَبَّ الْعالَمينَ، اِلهي ارْحَمْني اِذَا انْقَطَعَتْ حُجَّتي وَكَلَّ عَنْ جَوابِكَ لِساني، وَطاشَ عِنْدَ سُؤالِكَ اِيّايَ لُبّي، فَيا عَظيمَ رَجائي لا تُخَيِّبْني اِذَا اشْتَدَّتْ فاقَتي، وَلا تَرُدَّني لِجَهْلي، وَلا تَمْنَعْني لِقِلَّةِ صَبْري، اَعْطِني لِفَقْري وَارْحَمْني لِضَعْفي، سَيِّدي عَلَيْكَ مُعْتَمَدي وَمُعَوَّلي وَرَجائي وَتَوَكُّلي، وَبِرَحْمَتِكَ تَعَلُّقي، وَبِفَنائِكَ اَحُطُّ رَحْلي، وَبِجُودِكَ اَقْصِدُ (أقصُرُ) طَلِبَتي، وَبِكَرَمِكَ اَيْ رَبِّ اسْتَفْتِحُ دُعائي، وَلَدَيْكَ اَرْجُو فاقَتي (ضيافتي)، وَبِغِناكَ اَجْبُرُ عَيْلَتي، وَتَحْتَ ظِلِّ عَفْوِكَ قِيامي، وَاِلى جُودِكَ وَكَرَمِكَ اَرْفَعُ بَصَري، وَاِلى مَعْرُوفِكَ اُديمُ نَظَري، فَلا تُحْرِقْني بِالنّارِ وَاَنْتَ مَوْضِعُ اَمَلي، وَلا تُسْكِنِّىِ الْهاوِيَةَ فَاِنَّكَ قُرَّةُ عَيْني، يا سَيِّدي لا تُكَذِّبْ ظَنّي بِاِحْسانِكَ وَمَعْرُوفِكَ فَاِنَّكَ ثِقَتي، وَلا تَحْرِمْني ثَوابَكَ فَاِنَّكَ الْعارِفُ بِفَقْري، اِلهي اِنْ كانَ قَدْ دَنا اَجَلي وَلَمْ يُقَرِّبْني مِنْكَ عَمَلي فَقَدْ جَعَلْتُ الاْعْتِرافَ اِلَيْكَ بِذَنْبي وَسائِلَ عِلَلي ، اِلهي اِنْ عَفَوْتَ فَمَنْ اَوْلى مِنْكَ بِالْعَفْوِ، وَاِنْ عَذَّبْتَ فَمَنْ اَعْدَلُ مِنْكَ فِي الْحُكْمِ، ارْحَمْ في هذِهِ الدُّنْيا غُرْبَتي، وَعِنْدَ الْمَوْتِ كُرْبَتي، وَفِي الْقَبْرِ وَحْدَتي، وَفِي اللَّحْدِ وَحْشَتي، وَاِذا نُشِرْتُ لِلْحِسابِ بَيْنَ يَدَيْكَ ذُلَّ مَوْقِفي، وَاغْفِرْ لي ما خَفِيَ عَلَى الاْدَمِيّينَ مِنْ عَمَلي، وَاَدِمْ لي ما بِهِ سَتَرْتَني، وَارْحَمْني صَريعاً عَلَى الْفِراشِ تُقَلِّبُني اَيْدي اَحِبَّتي، وَتَفَضَّلْ عَلَيَّ مَمْدُوداً عَلَى الْمُغْتَسَلِ يُقَلِّبُني صالِحُ جيرَتي، وَتَحَنَّنْ عَلَيَّ مَحْموُلاً قَدْ تَناوَلَ الاَْقْرِباءُ اَطْرافَ جَِنازَتي، وَجُدْ عَلَيَّ مَنْقُولاً قَدْ نَزَلْتُ بِكَ وَحيداً في حُفْرَتي، وَارْحَمْ في ذلِكَ الْبَيْتِ الْجَديدِ غُرْبَتي، حَتّى لا اَسْتَاْنِسَ بِغَيْرِكَ، يا سَيِّدي اِنْ وَكَلْتَني اِلى نَفْسي هَلَكْتُ، سَيِّدي فَبِمَنْ اَسْتَغيثُ اِنْ لَمْ تُقِلْنِي عَثَرْتي، فَاِلى مَنْ اَفْزَعُ اِنْ فَقَدْتُ عِنايَتَكَ في ضَجْعَتي، وَاِلى مَنْ اَلْتَجِئُ اِنْ لَمْ تُنَفِّسْ كُرْبَتي سَيِّدي مَنْ لي وَمَنْ يَرْحَمُني اِنْ لَمْ تَرْحَمْني، وَفَضْلَ مَنْ اُؤَمِّلُ اِنْ عَدِمْتُ فَضْلَكَ يَوْمَ فاقَتي، وَاِلى مَنِ الْفِرارُ مِنَ الذُّنُوبِ اِذَا انْقَضى اَجَلي، سَيِّدي لا تُعَذِّبْني وَاَنَا اَرْجُوكَ، اِلهي حَقِّقْ رَجائي، وَآمِنْ خَوْفي، فَاِنَّ كَثْرَةَ ذُنُوبي لا اَرْجُو فيها إلاّ عَفْوَكَ، سَيِّدي اَنَا اَسْاَلُكَ ما لا اَسْتَحِقُّ وَاَنْتَ اَهْلُ التَّقْوى وَاَهْلُ الْمَغْفِرَةِ، فَاغْفِرْ لي وَاَلْبِسْني مِنْ نَظَرِكَ ثَوْباً يُغَطّي عَلَيَّ التَّبِعاتِ، وَتَغْفِرُها لي وَلا اُطالَبُ بِها، اِنَّكَ ذُو مَنٍّ قَديم، وَصَفْح عَظيم، وَتَجاوُز كَريم، اِلهي اَنْتَ الَّذي تُفيضُ سَيْبَكَ عَلى مَنْ لا يَسْأَلُكَ وَعَلَى الْجاحِدينَ بِرُبُوبِيَّتِكَ، فَكَيْفَ سَيِّدي بِمَنْ سَأَلَكَ وَاَيْقَنَ اَنَّ الْخَلْقَ لَكَ، وَالاَْمْرَ اِلَيْكَ، تَبارَكْتَ وَتَعالَيْتَ يا رَبَّ الْعالَمينَ، سَيِّدي عَبْدُكَ بِبابِكَ أقامَتْهُ الْخَصاصَةُ بَيْنَ يَدَيْكَ يَقْرَعُ بابَ اِحْسانِكَ بِدُعائِهِ فَلا تُعْرِضْ بِوَجْهِكَ الْكَريمِ عَنّي، وَاَقْبَلْ مِنّي ما اَقُولُ، فَقَدْ دَعَوْتُ بِهذَا الدُّعاءِ وَاَنا اَرْجُو اَنْ لا تَرُدَّني، مَعْرِفَةً مِنّي بِرَأفَتِكَ وَرَحْمَتِكَ، اِلهي اَنْتَ الَّذي لا يُحفِيكَ سائِلٌ، وَلا يَنْقِصُكَ نائِلٌ، اَنْتَ كَما تَقُولُ وَفَوْقَ ما نَقُولُ، اَللّـهُمَّ اِنّي اَسْاَلُكَ صَبْراً جَميلاً، وَفَرَجاً قَريباً، وَقَولاً صادِقاً، وَاَجْراً عَظيماً، اَسْاَلُكَ يا رَبِّ مِنَ الْخَيْرِ كُلِّهِ ما عَلِمْتُ مِنْهُ وَما لَمْ اَعْلَمْ، اَسْاَلُكَ اللّهُمَّ مِنْ خَيْرِ ما سَأَلَكَ مِنْهُ عِبادُكَ الصّالِحُونَ، يا خَيْرَ مَنْ سُئِلَ، وَاَجْوَدَ مَنْ اَعْطى، اَعْطِني سُؤْلي في نَفْسي وَاَهْلي وَوالِديَّ وَوُلْدِي وَاَهْلِ حُزانَتي وَاِخْواني فيكَ، وَاَرْغِدْ عَيْشي، وَاَظْهِرْ مُرُوَّتي، وَاَصْلِحْ جَميعَ اَحْوالي، وَاجْعَلْني مِمَّنْ اَطَلْتَ عُمْرَهُ، وَحَسَّنْتَ عَمَلَهُ، وَاَتْمَمْتَ عَلَيْهِ نِعْمَتَكَ، وَرَضيتَ عَنْهُ وَاَحْيَيْتَهُ حَياةً طَيِّبَةً في اَدْوَمِ السُّرُورِ، وَاَسْبَغِ الْكَرامَةِ، وَاَتَمِّ الْعَيْشِ، اِنَّكَ تَفْعَلُ ما تَشاءُ وَلا تَفْعَلُ ما يَشاءُ غَيْرُكَ، اَللّـهُمَّ خُصَّني مِنْكَ بِخاصَّةِ ذِكْرِكَ، وَلا تَجْعَلْ شَيْئاً مِمّا اَتَقَرَّبُ بِهِ في آناءِ اللَّيْلِ وَاَطْرافِ النَّهارِ رِياءً وَلا سُمْعَةً وَلا اَشَراً وَلا بَطَراً، وَاجْعَلْني لَكَ مِنَ الْخاشِعينَ، اَللّـهُمَّ أعْطِنِى السَّعَةَ فِي الرِّزْقِ، وَالاَْمْنَ فِي الْوَطَنِ، وَقُرَّةَ الْعَيْنِ فِي الاَْهْلِ وَالْمالِ وَالْوَلَدِ، وَالْمُقامَ في نِعَمِكَ عِنْدي، وَالصِّحَّةَ فِى الْجِسْمِ، وَالْقُوَّةَ فِي الْبَدَنِ، وَالسَّلامَةَ فِى الدّينِ وَاسْتَعْمِلْني بِطاعَتِكَ وَطاعَةِ رَسُولِكَ مُحَمَّد صَلَّى اللهُ عَلَيْهِ وَآلِهِ اَبَداً مَا اسْتَعْمَرَتْني، وَاجْعَلْني مِنْ اَوْفَرِ عِبادِكَ عِنْدَكَ نَصيباً في كُلِّ خَيْر اَنْزَلْتَهُ وَتُنْزِلُهُ في شَهْرِ رَمَضانَ في لَيْلَةِ الْقَدْرِ، وَما اَنْتَ مُنْزِلُهُ في كُلِّ سَنَةٍ مِنْ رَحْمَةٍ تَنْشُرُها، وَعافِيَةٍ تُلْبِسُها، وَبَلِيَّةٍ تَدْفَعُها، وَحَسَناتٍ تَتَقَبَّلُها، وَسَيِّئاتٍ تَتَجاوَزُ عَنْها، وَارْزُقْني حَجَّ بَيْتِكَ الْحَرامِ في عامِنا (عَامِي) هذا وَفي كُلِّ عام، وَارْزُقْني رِزْقاً واسِعاً مِنْ فَضْلِكَ الْواسِعِ، وَاصْرِفْ عَنّي يا سَيِّدي الاَْسْواءَ، وَاقْضِ عَنِّيَ الدَّيْنَ وَالظُّلاماتِ، حَتّى لا اَتَأذّى بِشَيءٍ مِنْهُ، وَخُذْ عَنّي بِاَسْماعِ وَاَبْصارِ اَعْدائي وَحُسّادي وَالْباغينَ عَلَيَّ، وَانْصُرْني عَلَيْهِمْ، وَاَقِرَّ عَيْني وَفَرِّحْ قَلْبي، وَاجْعَلْ لي مِنْ هَمّي وَكَرْبي فَرَجاً وَمَخْرَجاً، وَاجْعَلْ مَنْ اَرادَني بِسُوء مِنْ جَميعِ خَلْقِكَ تَحْتَ قَدَمَيَّ، وَاكْفِني شَرَّ الشَّيْطانِ، وَشَرَّ السُّلْطانِ، وَسَيِّئاتِ عَمَلي، وَطَهِّرْني مِنَ الذُّنُوبِ كُلِّها، وَاَجِرْني مِنَ النّارِ بِعَفْوِكَ، وَاَدْخِلْنِى الْجَنَّةَ بِرَحْمَتِكَ، وَزَوِّجْني مِنَ الْحُورِ الْعينِ بِفَضْلِكَ، وَاَلْحِقْني بِاَوْلِيائِكَ الصّالِحينَ مُحَمَّد وَآلِهِ الاَْبْرارِ الطَّيِّبينَ الطّاهِرينَ الاَْخْيارِ صَلَواتُكَ عَلَيْهِمْ وَعَلى اَجْسادِهِمْ وَاَرْواحِهِمْ وَرَحْمَةُ اللهِ وَبَرَكاتُهُ. اِلهي وَسَيِّدي وَعِزَّتِكَ وَجَلالِكَ لَئِنْ طالَبَتْني بِذُنُوبي لاَُطالِبَنَّكَ بِعَفْوِكَ، وَلَئِنْ طالَبَتْني بِلُؤْمي لاَُطالِبَنَّكَ بِكَرَمِكَ، وَلَئِنْ اَدْخَلْتَنِى النّارَ لاَُخْبِرَنَّ اَهْلَ النّارِ بِحُبّي لَكَ، اِلهي وَسَيِّدي اِنْ كُنْتَ لا تَغْفِرُ إلاّ لاَِوْلِيائِكَ وَاَهْلِ طاعَتِكَ فَاِلى مَنْ يَفْزَعُ الْمُذْنِبُونَ، وَاِنْ كُنْتَ لا تُكْرِمُ إلاّ اَهْلَ الْوَفاءِ بِكَ فَبِمَنْ يَسْتَغيثُ الْمُسْيؤُنَ اِلهي اِنْ اَدْخَلْتَنِى النّارَ فَفي ذلِكَ سُرُورُ عَدُوِّكَ، وَاِنْ اَدْخَلْتَنِى الْجَنَّةَ فَفي ذلِكَ سُرُورُ نَبِيِّكَ، وَاَنَا وَاللهِ اَعْلَمُ اَنَّ سُرُورَ نَبِيِّكَ اَحَبُّ اِلَيْكَ مِنْ سُرُورِ عَدُوِّكَ، اَللّـهُمَّ اِنّي اَسْاَلُكَ اَنْ تَمْلأ قَلْبي حُبّاً لَكَ، وَخَشْيَةً مِنْكَ، وَتَصْديقاً بِكِتابِكَ، وَايماناً بِكَ، وَفَرَقاً مِنْكَ، وَشَوْقاً اِلَيْكَ، يا ذَا الْجَلالِ وَالاِْكْرامِ حَبِّبْ اِلَىَّ لِقاءَكَ وَاَحْبِبْ لِقائي، وَاجْعَلْ لي في لِقائِكَ الرّاحَةَ وَالْفَرَجَ وَالْكَرامَةَ، اَللّـهُمَّ اَلْحِقْني بِصالِحِ مِنْ مَضى، وَاجْعَلْني مِنْ صالِحِ مَنْ بَقي وَخُذْ بي سَبيلَ الصّالِحينَ، وَاَعِنّي عَلى نَفْسي بِما تُعينُ بِهِ الصّالِحينَ عَلى اَنْفُسِهِمْ، وَاخْتِمْ عَمَلي بِاَحْسَنِهِ، وَاجْعَلْ ثَوابي مِنْهُ الْجَنَّةَ بِرَحْمَتِكَ، وَاَعِنّي عَلى صالِحِ ما اَعْطَيْتَني، وَثَبِّتْني يا رَبِّ، وَلا تَرُدَّني في سُوءٍ اسْتَنْقَذْتَني مِنْهُ يا رَبِّ الْعالَمينَ. اَللّـهُمَّ اِنّي اَسْاَلُكَ ايماناً لا اَجَلَ لَهُ دُونَ لِقائِكَ، اَحْيِني ما اَحْيَيْتَني عَلَيْهِ وَتَوَفَّني اِذا تَوَفَّيْتَني عَلَيْهِ، وَابْعَثْني اِذا بَعَثْتَني عَلَيْهِ وَأبْرِىءْ قَلْبي مِنَ الرِّياءِ وَالشَّكِّ وَالسُّمْعَةِ في دينِكَ، حَتّى يَكُونَ عَمَلي خالِصاً لَكَ، اَللّـهُمَّ اَعْطِني بَصيرَةً في دينِكَ، وَفَهْماً في حُكْمِكَ، وَفِقْهاً في عِلْمِكَ، وَكِفْلَيْنِ مِنْ رَحْمَتِكَ، وَوَرَعاً يَحْجُزُني عَنْ مَعاصيكَ، وَبَيِّضْ وَجْهي بِنُورِكَ، وَاجْعَلْ رَغْبَتي فيـما عِنْدَكَ، وَتَوَفَّني في سَبيلِكَ، وَعَلى مِلَّةَ رَسُولِكَ صَلَّى اللهُ عَلَيْهِ وَآلِهِ، اَللّـهُمَّ اِنّي اَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْفَشَلِ وَالْهَمِّ وَالْجُبْنِ وَالْبُخْلِ وَالْغَفْلَةِ وَالْقَسْوَةِ وَالْمَسْكَنَةِ (وَالذّلّةِ)  وَالْفَقْرِ وَالْفاقَةِ وَكُلِّ بَلِيَّة، وَالْفَواحِشِ ما ظَهَرَ مِنْها وَما بَطَنَ، وَاَعُوذُ بِكَ مِنْ نَفْسٍ لا تَقْنَعُ، وَبَطْنٍ لا يَشْبَعُ، وَقَلْبٍ لا يَخْشَعُ، وَدُعاءٍ لا يُسْمَعُ وَعَمَلٍ لا يَنْفَعُ، وَاَعُوذُ بِكَ يا رَبِّ عَلى نَفْسي وَديني وَمالي وَعَلى جَميعِ ما رَزَقْتَني مِنَ الشَّيْطانِ الرَّجيمَ اِنَّكَ اَنْتَ السَّميعُ الْعَليمُ، اَللّـهُمَّ اِنَّهُ لا يُجيرُني مِنْكَ اَحَدٌ وَلا اَجِدُ مِنْ دُونِكَ مُلْتَحَداً، فَلا تَجْعَلْ نَفْسي في شَيءٍ مِنْ عَذابِكَ، وَلا تَرُدَّني بِهَلَكَةٍ وَلا تَرُدَّني بِعَذابٍ اَليم، اَللّـهُمَّ تَقَبَّلْ مِنّي وَاَعْلِ ذِكْري، وَارْفَعْ دَرَجَتي، وَحُطَّ وِزْري، وَلا تَذْكُرْني بِخَطيئَتي، وَاجْعَلْ ثَوابَ مَجْلِسي وَثَوابَ مَنْطِقي وَثَوابَ دُعائي رِضاكَ وَالْجَنَّةَ، وَاَعْطِني يا رَبِّ جَميعَ ما سَاَلْتُكَ، وَزِدْني مِنْ فَضْلِكَ، اِنّي اِلَيْكَ راغِبٌ يا رَبَّ الْعالَمينَ، اَللّـهُمَّ اِنَّكَ اَنْزَلْتَ في كِتابِكَ (العَفوَ وأمَرتنا أن نعفُو) اَنْ نَعْفُوَ عَمَّنْ ظَلَمْنا، وَقَدْ ظَلَمْنا اَنْفُسَنا فَاعْفُ عَنّا فَاِنَّكَ اَوْلى بِذلِكَ مِنّا، وَاَمَرْتَنا اَنْ لا نَرُدَّ سائِلاً عَنْ اَبْوابِنا وَقَدْ جِئْتُكَ سائِلاً فَلا تَرُدَّني إلاّ بِقَضاءِ حاجَتي، وَاَمَرْتَنا بِالاِْحْسانِ اِلى ما مَلَكَتْ اَيْمانُنا وَنَحْنُ اَرِقّاؤكَ فَاَعْتِقْ رِقابَنا مِنَ النّارِ، يا مَفْزَعي عِنْدَ كُرْبَتي، وَيا غَوْثي عِنْدَ شِدَّتي، اِلَيْكَ فَزِعْتُ وَبِكَ اسْتَغَثْتُ وَلُذْتُ، لا اَلُوذُ بِسِواكَ وَلا اَطْلُبُ الْفَرَجَ إلاّ مِنْكَ، فَاَغِثْني وَفَرِّجْ عَنّي يا من يقبل اليسير (يا مَنْ يَفُكُّ الاَسيرَ)، وَيَعْفُو عَنِ الْكَثيرِ اِقْبَلْ مِنِّى الْيَسيرَ وَاعْفُ عَنِّى الْكَثيرَ اِنَّكَ اَنْتَ الرَّحيمُ الْغَفُورُ، اَللّـهُمَّ اِنّي اَسْاَلُكَ ايماناً تُباشِرُ بِهِ قَلْبي وَيَقيناً (صادقا) حَتّى اَعْلَمَ اَنَّهُ لَنْ يُصيبَني إلّا ما كَتَبْتَ لي وَرَضِّني مِنَ الْعَيْشِ بِما قَسَمْتَ لي يا اَرْحَمَ الرّاحِمينَ.\n\nمفاتيح الجنان، القمي، ص 211، دار الأضواء، ط 3.",
  'دعاء الافتتاح': "( تستحب قراءته في كلّ ليلةٍ من ليالي شهر رمضان بعد الإفطار )\nاَللَّهُمَّ إِنِّي أَفْتَتِحُ الثَّنَاءَ بِحَمْدِكَ ، وَأَنْتَ مُسَدِّدٌ لِلصَّوَابِ بِمَنِّكَ ، وَأَيْقَنْتُ أَنَّكَ أَنْتَ أَرْحَمُ الرَّاحِمِينَ فِي مَوْضِعِ الْعَفْوِ وَالرَّحْمَةِ ، وَأَشَدُّ الْمُعَاقِبِينَ فِي مَوْضِعِ النَّكَالِ وَالنَّقِمَةِ ، وَأَعْظَمُ الْمُتَجَبِّرِينَ فِي مَوْضِعِ الْكِبْرِيَاءِ وَالْعَظَمَةِ ، اَللَّهُمَّ أَذِنْتَ لِي فِي دُعَائِكَ وَمَسْأَلَتِكَ ، فَاسْمَعْ ـ يَا سَمِيعُ ـ مِدْحَتِي ، وَأَجِبْ ـ يَا رَحِيمُ ـ دَعْوَتِي ، وَأَقِلْ ـ يَا غَفُورُ ـ عَثْرَتِي ، فَكَمْ ـ يَا إِلَهِي ـ مِنْ كُرْبَةٍ قَدْ فَرَّجْتَهَا ، وَهُمُومٍ قَدْ كَشَفْتَهَا ، وَعَثْرَةٍ قَدْ أَقَلْتَهَا ، وَرَحْمَةٍ قَدْ نَشَرْتَهَا ، وَحَلْقَةِ بَلاءٍ قَدْ فَكَكْتَهَا ، اَلحَمْدُ للهِ الَّذِي لَمْ يَتَّخِذْ صَاحِبَةً وَلا وَلَداً ، وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ ، وَلَمْ يَكُن لَّهُ وَلِيٌّ مِنَ الذُّلِّ وَكَبِّرْهُ تَكْبِيراً ، اَلحَمْدُ للهِ بِجَمِيعِ مَحَامِدِهِ كُلِّهَا ، عَلَى جَمِيعِ نِعَمِهِ كُلِّهَا ، اَلحَمْدُ للهِ الَّذِي لا مُضادَّ لَهُ فِي مُلْكِهِ ، وَلا مُنَازِعَ لَهُ فِي أَمْرِهِ ، اَلْحَمْدُ للهِ الَّذِي لا شَرِيكَ لَهُ فِي خَلْقِهِ ، وَلا شَبِيهَ لَهُ فِي عَظَمَتِهِ ، اَلْحَمْدُ للهِ الْفاشِي في الْخَلْقِ أَمْرُهُ وَحَمْدُهُ ، الظَّاهِرِ بِالْكَرَمِ مَجْدُهُ ، الْبَاسِطِ بِالْجُودِ يَدَهُ ، الَّذِي لا تَنْقُصُ خَزَائِنُهُ ، وَلا تَزيدُهُ كَثْرَةُ الْعَطَاءِ إِلَّا جُوداً وَكَرَماً ، إِنَّهُ هُوَ الْعَزِيزُ الْوَهَّابُ ، اَللَّهُمَّ إِنِّي أَسْأَلُكَ قَلِيلاً مِنْ كَثِيرٍ ، مَعَ حاجَةٍ بِي إِلَيْهِ عَظِيمَةٍ ، وَغِنَاكَ عَنْهُ قَدِيمٌ ، وَهُوَ عِنْدِي كَثِيرٌ ، وَهُوَ عَلَيْكَ سَهْلٌ يَسِيرٌ ، اَللَّهُمَّ إِنَّ عَفْوَكَ عَنْ ذَنْبِي ، وَتَجَاوُزَكَ عَنْ خَطِيئَتِي ، وَصَفْحَكَ عَنْ ظُلْمِي وَسِتْرَكَ عَلَى قَبِيحِ عَمَلِي ، وَحِلْمَكَ عَنْ كَثِيرِ جُرْمِي ، عِنْدَمَا كَانَ مِنْ خَطَإِي وَعَمْدِي ، أَطْمَعَنِي فِي أَنْ أَسْأَلَكَ مَا لا أَسْتَوْجِبُهُ مِنْكَ ، الَّذِي رَزَقْتَنِي مِن رَّحْمَتِكَ ، وَأَرَيْتَنِي مِنْ قُدْرَتِكَ ، وَعَرَّفْتَنِي مِنْ إِجَابَتِكَ ، فَصِرْتُ أَدْعُوكَ آمِناً ، وَأَسْأَلُكَ مُسْتَأنِساً ، لا خَائِفاً وَلا وَجِلاً ، مُدِلًّا عَلَيْكَ فِيمَا قَصَدتُّ فِيهِ إِلَيْكَ ، فَإِنْ أَبْطَأَ عَنِّي عَتَبْتُ بِجَهْلِي عَلَيْكَ ، وَلَعَلَّ الَّذِي أَبْطَأَ عَنِّي هُوَ خَيْرٌ لِي لِعِلْمِكَ بِعَاقِبَةِ الأُمُورِ ، فَلَمْ أَرَ مَوْلًى كَرِيماً أَصْبَرَ عَلَى عَبْدٍ لَئِيمٍ مِنْكَ عَلَيَّ يَا رَبِّ ، إِنَّكَ تَدْعُونِي فَأُوَلِّي عَنْكَ ، وَتَتَحَبَّبُ إِلَيَّ فَأَتَبَغَّضُ إِلَيْكَ ، وَتَتَوَدَّدُ إِلَيَّ فَلا أَقْبَلُ مِنْكَ ، كَأَنَّ لِيَ التَّطَوُّلَ عَلَيْكَ ، فَلَمْ يَمْنَعْكَ ذَلِكَ مِنَ الرَّحْمَةِ لِي ، وَالإِحْسَانِ إِلَيَّ ، وَالتَّفَضُّلِ عَلَيَّ بِجُودِكَ وَكَرَمِكَ ، فَارْحَمْ عَبْدَكَ الْجَاهِلَ وَجُدْ عَلَيْهِ بِفَضْلِ إِحْسَانِكَ إِنَّكَ جَوَادٌ كَرِيمٌ ، اَلْحَمْدُ للهِ مَالِكِ الْمُلْكِ ، مُجْرِي الْفُلْكِ ، مُسَخِّرِ الرِّيَاحِ ، فَالِقِ الإِصْبَاحِ ، دَيَّانِ الدِّينِ ، رَبِّ الْعَالَمِينَ ، اَلْحَمْدُ للهِ عَلَى حِلْمِهِ بَعْدَ عِلْمِهِ ، وَالْحَمْدُ للهِ عَلَى عَفْوِهِ بَعْدَ قُدْرَتِهِ ، وَالْحَمْدُ للهِ عَلَى طُولِ أَنَاتِهِ فِي غَضَبِهِ ، وَهُوَ قَادِرٌ عَلَى مَا يُرِيدُ ، اَلْحَمْدُ للهِ خَالِقِ الْخَلْقِ ، بَاسِطِ الرِّزْقِ ، فالِقِ الْإِصْبَاحِ ذِي الْجَلالِ وَالإِكْرَامِ وَالْفَضْلِ وَالإِنْعَامِ ، الَّذِي بَعُدَ فَلا يُرَى ، وَقَرُبَ فَشَهِدَ النَّجْوَى ، تَبَارَكَ وَتَعَالَى ، اَلحَمْدُ للهِ الَّذِي لَيْسَ لَهُ مُنَازِعٌ يُعَادِلُهُ ، وَلا شَبيهٌ يُشَاكِلُهُ ، وَلا ظَهِيرٌ يُعَاضِدُهُ ، قَهَرَ بِعِزَّتِهِ الأَعِزَّاءَ ، وَتَوَاضَعَ لِعَظَمَتِهِ الْعُظَمَاءُ ، فَبَلَغَ بِقُدْرَتِهِ مَا يَشَاءُ ، اَلْحَمْدُ للهِ الَّذِي يُجِيبُني حِينَ أُنَادِيهِ ، وَيَسْتُرُ عَلَيَّ كُلَّ عَوْرَةٍ وَأَنَا أَعْصِيهِ ، وَيُعَظِّمُ الْنِّعْمَةَ عَلَيَّ فَلا أُجَازِيهِ ، فَكَم مِّن مَّوْهِبَةٍ هَنيئَةٍ قَدْ أَعْطَانِي ، وَعَظِيمَةٍ مَخُوفَةٍ قَدْ كَفَانِي ، وَبَهْجَةٍ مُّونِقَةٍ قَدْ أَرَانِي ، فَأُثْنِي عَلَيْهِ حَامِداً ، وَأَذْكُرُهُ مُسَبِّحاً ، اَلْحَمْدُ للهِ الَّذِي لا يُهْتَكُ حِجَابُهُ ، وَلا يُغْلَقُ بَابُهُ ، وَلا يُرَدُّ سَائِلُهُ ، وَلا يُخَيَّبُ آمِلُهُ ، اَلْحَمْدُ للهِ الَّذِي يُؤْمِنُ الْخَائِفِينَ ، وَيُنَجِّي الصَّالِحِينَ ، وَيَرْفَعُ الْمُسْتَضْعَفِينَ ، وَيَضَعُ الْمُسْتَكْبِرِينَ ، ويُهْلِكُ مُلُوكاً وَيَسْتَخْلِفُ آخَرِينِ ، وَالْحَمْدُ للهِ قَاصِمِ الْجَبَّارِينَ ، مُبِيرِ الظَّالِمِينَ ، مُدْرِكِ الْهَارِبِينَ ، نَكَالِ الظَّالِمِينَ صَرِيخِ الْمُسْتَصْرِخِينَ ، مَوْضِعِ حَاجَاتِ الطَّالِبِينَ ، مُعْتَمَدِ الْمُؤْمِنِينَ ، اَلْحَمْدُ للهِ الَّذِي مِنْ خَشْيَتِهِ تَرْعَدُ السَّمَاءُ وَسُكَّانُهَا ، وَتَرْجُفُ الأَرْضُ وَعُمَّارُهَا ، وَتَمُوجُ الْبِحَارُ وَمَن يَّسْبَحُ فِي غَمَرَاتِهَا ، اَلْحَمْدُ للهِ الَّذِي هَدَانَا لِهَذا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلا أَنْ هَدَانَا اللّهُ ، اَلْحَمْدُ للهِ الَّذِي يَخْلُقُ وَلَمْ يُخْلَقْ ، وَيَرْزُقُ وَلا يُرْزَقُ ، وَيُطْعِمُ وَلا يُطْعَمُ ، وَيُمِيتُ الأَحْيَاءَ وَيُحْيِي الْمَوْتَى وَهُوَ حَيٌّ لَّا يَمُوتُ ، بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ ، وَأَمِينِكَ وَصَفِيِّكَ وَحَبِيبِكَ ، وَخِيَرَتِكَ مِنْ خَلْقِكَ ، وَحافِظِ سِرِّكَ ، وَمُبَلِّغِ رِسَالاتِكَ ، أَفْضَلَ وَأَحْسَنَ وَأَجْمَلَ وَأَكْمَلَ وَأَزْكَى وَأَنْمَى وَأَطْيَبَ وَأَطْهَرَ وَأَسْنَى وَأَكْثَرَ مَا صَلَّيْتَ وَبَارَكْتَ وَتَرَحَّمْتَ وَتَحَنَّنْتَ وَسَلَّمْتَ عَلَى أَحَدٍ مِن عِبَادِكَ وَأَنْبِيائِكَ وَرُسُلِكَ وَصَفْوَتِكَ وَأَهْلِ الْكَرَامَةِ عَلَيْكَ مِنْ خَلْقِكَ ، اَللَّهُمَّ وَصَلِّ عَلَى عَليٍّ أَمِيرِ الْمُؤْمِنِينَ ، وَوَصِيِّ رَسُولِ رَبِّ الْعَالَمِينَ ، عَبْدِكَ وَوَليِّكَ وَأَخِي رَسُولِكَ وَحُجَّتِكَ عَلَى خَلْقِكَ وَآيَتِكَ الْكُبْرَى وَالنَّبَإِ الْعَظِيمِ ، وَصَلِّ عَلَى الصِّدِّيقَةِ الطَّاهِرَةِ فَاطِمَةَ سَيِّدَةِ نِسَاءِ الْعَالَمِينَ ، وَصَلِّ عَلَى سِبْطَيِ الرَّحْمَةِ وَإِمَامَيِ الْهُدَى ، الْحَسَنِ وَالْحُسَيْنِ سَيِّدَيْ شَبَابِ أَهْلِ الْجَّنَةِ ، وَصَلِّ عَلَى أَئِمَّةِ الْمُسْلِمِينَ ، عَلِيِّ بْنِ الْحُسَيْنِ ، وَمُحَمَّدِ بْنِ عَلِيٍّ ، وَجَعْفَرِ بْنِ مُحَمَّدٍ ، وَمُوسَى بْنِ جَعْفَرٍ ، وَعَلِيِّ بْنِ مُوسَى ، وَمُحَمَّدِ بْنِ عَلِيٍّ ، وَعَلِيِّ بْنِ مُحَمَّدٍ ، وَالْحَسَنِ بْنِ عَلِيٍّ ، وَالْخَلَفِ الْهَادِي الْمَهْدِيِّ ، حُجَجِكَ عَلَى عِبَادِكَ ، وَأُمَنَائِكَ فِي بِلادِكَ صَلَاةً كَثِيرَةً دَائِمَةً ، اَللَّهُمَّ وَصَلِّ عَلَى وَلِيِّ أَمْرِكَ الْقَائِمِ الْمُؤَمَّلِ ، وَالْعَدْلِ الْمُنْتَظَرِ ، وَحُفَّهُ بِمَلائِكَتِكَ الْمُقَرَّبِينَ ، وَأَيِّدْهُ بِرُوحِ الْقُدُسِ يَا رَبَّ الْعَالَمِينَ ، اَللّهُمَّ اجْعَلْهُ الدَّاعِيَ إِلَى كِتَابِكَ ، وَالْقَائِمَ بِدِينِكَ ، اِسْتَخْلِفْهُ فِي الأَرْضِ كَمَا اسْتَخْلَفْتَ الَّذِينَ مِنْ قَبْلِهِ ، مَكِّن لَّهُ دِينَهُ الَّذِي ارْتَضَيْتَهُ لَهُ ، أَبْدِلْهُ مِنْ بَعْدِ خَوْفِهِ أَمْناً يَعْبُدُكَ لا يُشْرِكُ بِكَ شَيْئاً ، اَللَّهُمَّ أَعِزَّهُ وَأَعْزِزْ بِهِ ، وَانْصُرْهُ وَانْتَصِرْ بِهِ ، وَانْصُرْهُ نَصْراً عَزِيزاً ، وَافْتَحْ لَهُ فَتْحاً يَّسِيراً ، وَاجْعَل لَّهُ مِن لَّدُنْكَ سُلْطاناً نَّصيراً ، اَللَّهُمَّ أَظْهِرْ بِهِ دِينَكَ ، وَسُنَّةَ نَبِيِّكَ ، حَتّى لا يَسْتَخْفِيَ بِشَيْءٍ مِنَ الْحَقِّ ، مَخَافَةَ أَحَدٍ مِنَ الْخَلْقِ ، اَللَّهُمَّ إِنَّا نَرْغَبُ إِلَيْكَ فِي دَوْلَةٍ كََرِيمَةٍ تُعِزُّ بِهَا الإِسْلامَ وَأَهْلَهُ ، وَتُذِلُّ بِهَا النِّفَاقَ وَأَهْلَهُ ، وَتَجْعَلُنَا فِيهَا مِنَ الدُّعَاةِ إِلَى طَاعَتِكَ ، وَالْقادَةِ إِلَى سَبِيلِكَ ، وَتَرْزُقُنَا بِهَا كَرَامَةَ الدُّنْيَا وَالآخِرَةِ ، اَللَّهُمَّ مَا عَرَّفْتَنَا مِنَ الْحَقِّ فَحَمِّلْنَاهُ ، وَمَا قَصُرْنَا عَنْهُ فَبَلِّغْنَاهُ ، اَللَّهُمَّ الْمُمْ بِهِ شَعَثَنَا ، وَاشْعَب بِّهِ صَدْعَنَا ، وَارْتُقْ بِهِ فَتْقَنَا ، وَكَثِّرْ بِهِ قِلَّتَنَا ، وَأَعْزِزْ بِهِ ذِلَّتَنَا ، وَأَغْنِ بِهِ عائِلَنَا ، وَاقْضِ بِهِ عَن مُّغْرَمِنَا ، وَاجْبُرْ بِهِ فَقْرَنَا ، وَسُدَّ بِهِ خَلَّتَنَا ، وَيَسِّرْ بِهِ عُسْرَنَا ، وَبَيِّضْ بِهِ وُجُوهَنَا ، وَفُكَّ بِهِ أَسْرَنَا ، وَأَنْجِحْ بِهِ طَلِبَتَنَا ، وَأَنْجِزْ بِهِ مَوَاعِيدَنَا ، وَاسْتَجِب بِّهِ دَعْوَتَنَا ، وَأَعْطِنَا بِهِ سُؤْلَنَا ، وَبَلِّغْنَا بِهِ مِنَ الدُّنْيَا وَالآخِرَةِ آمَالَنَا ، وَأَعْطِنَا بِهِ فَوْقَ رَغْبَتِنَا ، يَا خَيْرَ الْمَسْؤُولِينَ وَأَوْسَعَ الْمُعْطِينَ ، اِشْفِ بِهِ صُدُورَنَا ، وَأَذْهِب بِّهِ غَيْظَ قُلُوبِنَا ، وَاهْدِنَا بِهِ لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُّسْتَقِيمٍ ، وَانْصُرْنَا بِهِ عَلَى عَدُوِّكَ وَعَدُوِّنَا إِلَهَ الْحَقِّ آمِينَ ، اَللَّهُمَّ إِنَّا نَشْكُو إِلَيْكَ فَقْدَ نَبِيِّنَا ـ صَلَوَاتُكَ عَلَيْهِ وَآلِهِ ـ وَغَيْبَةَ وَلِيِّنَا ، وَكَثْرَةَ عَدُوِّنَا ، وَقِلَّةَ عَدَدِنَا ، وَشِدَّةَ الْفِتَنِ بِنَا ، وَتَظَاهُرَ الزَّمَانِ عَلَيْنَا ، فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ ، وَأَعِنَّا عَلَى ذَلِكَ بِفَتْحٍ مِنْكَ تُعَجِّلُهُ، وَبِضُرٍّ تَكْشِفُهُ، وَنَصْرٍ تُعِزُّهُ وَسُلْطَانِ حَقٍّ تُظْهِرُهُ ، وَرَحْمَةٍ مِنْكَ تَجَلِّلُنَاها وَعَافِيَةٍ مِّنْكَ تُلْبِسُنَاهَا ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ .\n اَللَّهُمَّ بِرَحْمَتِكَ فِي الصَّالِحِينَ فَأَدْخِلْنَا ، وَفِي عِلِّيِّينَ فَارْفَعْنَا ، وِبَكَأسٍ مِّنْ مَعِينٍ مِنْ عَيْنٍ سَلْسَبِيلٍ فَاسْقِنَا ، وَمِنَ الْحُورِ الْعِينِ بِرَحْمَتِكَ فَزَوِّجْنَا ، وَمِنَ الْوِلْدَانِ الْمُخَلَّدِينَ كَأَنَّهُمْ لُؤْلُؤٌ مَكْنُونٌ فَأَخْدِمْنَا ، وَمِنْ ثِمَارِ الْجَنَّةِ وَلُحُومِ الطَّيْرِ فَأَطْعِمْنَا ، وِمِنْ ثِيَابِ السُّنْدُسِ وَالْحَرِيرِ وَالإِسْتَبْرَقِ فَأَلبِسْنَا ، وَلَيْلَةَ الْقَدْرِ وَحَجَّ بَيْتِكَ الْحرامِ ، وَقَتْلاً فِي سَبِيلِكَ فَوفِّقْ لَنَا ، وَصالِحَ الدُّعَاءِ وَالْمَسْأَلَةِ فاسْتَجِبْ لَنَا ، وَإِذَا جَمَعْتَ الأَوَّلِينَ وَالآخِرينَ يَوْمَ الْقِيَامَةِ فارْحَمْنَا ، وَبَراءَةً مِنَ النَّارِ فَاكْتُبْ لَنَا ، وَفِي جَهَنَّمَ فَلا تَغُلَّنَا ، وَفِي عَذَابِكَ وَهَوَانِكَ فَلا تَبْتَلِنَا ، وَمِنَ الزَّقُّومِ وَالضَّرِيعِ فَلا تُطْعِمْنَا ، وَمَعَ الشَّيَاطِينِ فَلا تَجْعَلْنَا ، وَفِي النَّارِ عَلَى وُجُوهِنَا فَلا تَكْبُبْنَا ، وَمِنْ ثِيَابِ النَّارِ وَسَرَابِيلِ الْقَطِرَانِ فَلا تُلْبِسْنَا ، وَمِنْ كُلِّ سُوءٍ يَا لَا إِلَهَ إِلَّا أَنْتَ بِحَقِّ لا إِلَهَ إِلَّا أَنْتَ فَنَجِّنَا .",
  'دعاء الندبة': "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\n اَلحَمْدُ للهِ رَبِّ الْعَالَمِينَ وَصَلَّى اللهُ عَلَى سَيِّدِنَا مُحَمَّدٍ نَبِيِّهِ وَآلِهِ وَسَلَّمَ تَسْلِيماً ، اَللّهُمَّ لَكَ الْحَمْدُ عَلى مَا جَرَى بِهِ قَضَاؤُكَ فِي أَوْلِيَائِكَ الَّذِينَ اسْتَخْلَصْتَهُمْ لِنَفْسِكَ وَدِينِكَ ، إِذِ اخْتَرْتَ لَهُمْ جَزِيلَ مَا عِنْدَكَ مِنَ النَّعِيمِ الْمُقِيمِ الَّذِي لا زَوَالَ لَهُ وَلا اضْمِحْلالَ ، بَعْدَ أَنْ شَرَطتَ عَلَيْهِمُ الزُّهْدَ فِي دَرَجَاتِ هذِهِ الدُّنيَا الدَّنِيَّةِ وَزُخْرُفِها وَزِبْرِجِها ، فَشَرَطُوا لَكَ ذَلِكَ وَعَلِمْتَ مِنْهُمُ الْوَفاءَ بِهِ فَقَبِلْتَهُمْ وَقَرَّبْتَهُمْ وَقَدَّمْتَ لَهُمُ الذِّكْرَ الْعَلِيَّ وَالثَّنَاءَ الْجَلِيَّ وَأَهْبَطتَ عَلَيْهِمْ مَلائِكَتَكَ وَكَرَّمْتَهُم بِوَحْيِكَ وَرَفَدتَّهُمْ بِعِلْمِكَ وَجَعَلْتَهُمُ الذَّرِيعَةَ إِلَيْكَ وَالْوَسِيلَةَ إِلَى رِضْوَانِكَ فَبَعْضٌ أَسْكَنْتَهُ جَنَّتَكَ إِلَى أَنْ أَخْرَجْتَهُ مِنْهَا ، وَبَعْضٌ حَمَلْتَهُ فِي فُلْكِكَ وَنَجَّيْتَهُ وَمَنْ آمَنَ مَعَهُ مِنَ الْهَلَكَةِ بِرَحْمَتِكَ ، وَبَعْضٌ اتَّخَذتَهُ لِنَفْسِكَ خَلِيلاً وَسَأَلَكَ لِسَانَ صِدْقٍ فِي الآخِرينَ ، فَأَجَبْتَهُ وَجَعَلْتَ ذَلِكَ عَلِيًّا ، وَبَعْضٌ كَلَّمْتَهُ مِنْ شَجَرَةٍ تَكْلِيماً وَجَعَلْتَ لَهُ مِنْ أَخِيهِ رِدْءاً وَوَزِيراً ، وَبَعْضٌ أَوْلَدتَّهُ مِنْ غَيْرِ أَبٍ وَآتَيْتَهُ الْبَيِّنَاتِ وَأيَّدتَّهُ بِرُوحِ الْقُدُسِ ، وَكُلٌ شَرَعْتَ لَهُ شَرِيعَةً ، وَنَهَجْتَ لَهُ مِنْهَاجاً ، وَتَخَيَّرْتَ لَهُ أَوْصِيَاءَ مُسْتَحْفِظاً بَعْدَ مُسْتَحْفِظٍ مِنْ مُدَّةٍ إِلَى مُدَّةٍ إِقَامَةً لِدِينِكَ وَحُجَّةً عَلَى عِبَادِكَ ، وَلِئَلَّا يَزُولَ الْحَقُّ عَنْ مَقَرِّهِ وَيَغْلِبَ الْبَاطِلُ عَلَى أَهْلِهِ وَلا يَقُولَ أَحَدٌ لَوْلا أَرْسَلْتَ إِلَيْنَا رَسُولاً مُنْذِراً وَأَقَمْتَ لَنَا عَلَماً هَادِياً فَنَتَّبِعَ آيَاتِكَ مِنْ قَبْلِ أَنْ نَذِلَّ وَنَخْزَى ، إِلَى أَنِ انْتَهَيْتَ بِالأَمْرِ إِلَى حَبِيبِكَ وَنَجِيبِكَ مُحَمَّدٍ ـ صَلّى اللهُ عَلَيْهِ وَآلِهِ ـ فَكَانَ كَمَا انْتَجَبْتَهُ سَيِّدَ مَنْ خَلَقْتَهُ وصَفْوَةَ مَنِ اصْطَفَيْتَهُ وَأَفْضَلَ مَنِ اجْتَبَيْتَهُ وَأَكْرَمَ مَنِ اعْتَمَدْتَهُ . قَدَّمْتَهُ عَلَى أَنْبِيائِكَ وَبَعَثْتَهُ إِلَى الثَّقَلَيْنِ مِنْ عِبَادِكَ وَأَوْطَأْتَهُ مَشَارِقَكَ وَمَغَارِبَكَ وَسَخَّرْتَ لَهُ الْبُرَاقَ وَعرَجْتَ(بهِ) بِرُوحِهِ إِلَى سَمَائِكَ وَأوْدَعْتَهُ عِلْمَ مَا كَانَ وَمَا يَكُونُ إِلَى انْقَضَاءِ خَلْقِكَ ، ثُمَّ نَصَرْتَهُ بِالرُّعْبِ وَحَفَفْتَهُ بِجَبْرَائِيلَ وَمِيكَائِيلَ وَالْمُسَوِّمِينَ مِن مَّلائِكَتِكَ وَوَعَدتَّهُ أَنْ تُظْهِرَ دِينَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ ، وَذَلِكَ بَعْدَ أَنْ بَوَّأْتَهُ مُبَوَّأَ صِدْقٍ مِنْ أَهْلِهِ وَجَعَلْتَ لَهُ وَلَهُمْ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذي بِبَكَّةَ مُبَارَكاً وَهُدًى لِلْعَالَمِينَ فِيهِ آياتٌ بَيِّنَاتٌ مَقَامُ إِبْرَاهِيمَ وَمَنْ دَخَلَهُ كَانَ آمِناً ، وَقُلْتَ : إِنَّمَا يُرِيدُ اللهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيراً . ثُمَّ جَعَلْتَ أَجْرَ مُحَمَّدٍ ـ صَلَوَاتُكَ عَلَيْهِ وَآلِهِ ـ مَوَدَّتَهُمْ فِي كِتَابِكَ فَقُلْتَ : قُلْ لا أَسْأَلُكُمْ عَلَيْهِ أَجْراً إِلَّا الْمَوَدَّةَ فِي الْقُرْبَى ، وَقُلْتَ : مَا سَأَلْتُكُمْ مِنْ أجْرٍ فَهُوَ لَكُمْ ، وَقُلْتَ : مَا أسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ إِلَّا مَنْ شَاءَ أن يَّتَّخِذَ إِلَى رَبِّهِ سَبِيلاً ؛ فَكَانُوا هُمُ السَّبِيلَ إِلَيْكَ وَالْمَسْلَكَ إِلَى رِضْوانِكَ . فَلَمَّا انْقَضَتْ أَيَّامُهُ أَقَامَ وَلِيَّهُ عَلِيَّ بْنَ أَبِي طَالِبٍ ـ صَلَوَاتُكَ عَلَيْهِمَا وَآلِهِمَا ـ هَادِياً إِذْ كانَ هُوَ الْمُنْذِرَ وَلِكُلِّ قَوْمٍ هَادٍ ، فَقَالَ وَالْمَلأُ أَمَامَهُ : مَنْ كُنْتُ مَوْلاهُ فَعَلِيٌّ مَوْلاهُ ، اَللَّهُمَّ وَالِ مَن وَّالاهُ وَعَادِ مَنْ عَادَاهُ وَانْصُرْ مَن نَصَرَهُ وَاخْذُلْ مَنْ خَذَلَهُ ، وَقَالَ : مَنْ كُنْتُ أَنَا نَبِيَّهُ فَعَلِيٌّ أَمِيرُهُ ، وَقَالَ: أَنَا وَعَلِيٌّ مِنْ شَجَرَةٍ وَاحِدَةٍ وَسَائِرُ النَّاسِ مِنْ شَجَرٍ شَتَّى . وَأَحَلَّهُ مَحَلَّ هَارُونَ مِن مُّوسى فَقَالَ لَهُ : أَنْتَ مِنِّي بِمَنْزِلَةِ هَارُونَ مِن مُّوسى إِلَّا أَنَّهُ لا نَبِيَّ بَعْدِي ، وَزَوَّجَهُ ابْنَتَهُ سَيِّدَةَ نِسَاءِ الْعالَمِينَ ، وَأحَلَّ لَهُ مِن مَّسْجِدِهِ ما حَلَّ لَهُ ، وَسَدَّ الأَبْوَابَ إِلَّا بَابَهُ ثُمَّ أَوْدَعَهُ عِلْمَهُ وَحِكْمَتَهُ فَقَالَ : أَنَا مَدِينَةُ الْعِلْمِ وَعَلِيٌّ بَابُها فَمَنْ أَرَادَ الْمَدِينَةَ وَالْحِكْمَةَ فَلْيَأْتِهَا مِنْ بَابِهَا . ثُمَ قالَ: أَنْتَ أَخِي وَوَصِيِّي وَوَارِثِي ، لَحْمُكَ مِن لَّحْمِي وَدَمُكَ مِنْ دَمِي وَسِلْمُكَ سِلْمِي وَحَرْبُكَ حَرْبِي ، وَالإيْمَانُ مُخَالِطٌ لَحْمَكَ وَدَمَكَ كَمَا خَالَطَ لَحْمِي وَدَمِي ، وَأَنْتَ غَداً عَلَى الْحَوْضِ خَلِيفَتِي وَأَنْتَ تَقْضِي دَيْنِي وَتُنْجِزُ عِداتِي ، وَشِيعَتُكَ عَلى مَنَابِرَ مِنْ نُورٍ مُبْيَضَّةً وُجُوهُهُمْ حَوْلِي فِي الْجَنَّةِ وَهُمْ جِيرَانِي ، وَلَوْلا أَنْتَ يَا عَلِيُّ لَمْ يُعْرَفِ الْمُؤْمِنُونَ بَعْدِي . وَكانَ بَعْدَهُ هُدًى مِّنَ الضَّلالِ وَنُوراً مِنَ الْعَمى وَحَبْلَ اللهِ الْمَتِينَ وَصِرَاطَهُ الْمُسْتَقِيمَ لا يُسْبَقُ بِقَرَابَةٍ فِي رَحِمٍ وَلا بِسَابِقَةٍ فِي دِينٍ وَلا يُلْحَقُ فِي مَنْقَبَةٍ مِن مَّنَاقِبِهِ ، يَحْذُو حَذْوَ الرَّسُولِ ـ صَلَّى اللهُ عَلَيْهِما وَآلِهِمَا ـ وَيُقَاتِلُ عَلَى التّأْوِيلِ وَلا تَأخُذُهُ فِي اللهِ لَوْمَةُ لائِمٍ ؛ قَدْ وَتَرَ فِيهِ صَنَادَيدَ الْعَرَبِ وَقَتَلَ أَبْطَالَهُمْ وَنَاوَشَ(ناهش) ذُؤْبَانَهُمْ فَأَوْدَعَ قُلُوبَهُمْ أَحْقَاداً بَدْرِيَّةً وَخَيْبَرِيَّةً وَحُنَيْنِيَّةً وَغَيْرَهُنَّ ، فَأَضَبَّتْ عَلَى عَدَاوَتِهِ وَأَكَبَّتْ عَلَى مُنَابَذَتِهِ حَتَّى قَتَلَ النَّاكِثِينَ وَالْقَاسِطِينَ وَالْمَارِقِينَ . وَلَمَّا قَضَى نَحْبَهُ وَقَتَلَهُ أَشْقَى الآخِرينَ يَتْبَعُ أَشْقَى الأَوّلِينَ لَمْ يُمْتَثَلْ أَمْرُ رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَآلِهِ فِي الْهَادِينَ بَعْدَ الْهَادِينَ ، وَالأُمَّةُ مُصِرَّةٌ عَلَى مَقْتِهِ مُجْتَمِعَةٌ عَلَى قَطِيعَةِ رَحِمِهِ وَإِقْصَاءِ وُلْدِهِ إِلَّا القَلِيلَ مِمَّنْ وَفَى لِرِعَايَةِ الْحَقِّ فِيهِمْ ، فَقُتِلَ مَنْ قُتِلَ وَسُبِيَ مَنْ سُبِيَ وَأُقْصِيَ مَنْ أُقْصِيَ وَجَرَى الْقَضاءُ لَهُمْ بِمَا يُرْجى لَهُ حُسْنُ الْمَثُوبَةِ ، إِذْ كَانَتِ الأَرْضُ للهِ يُورِثُها مَن يَشَاءُ مِنْ عِبَادِهِ وَالْعَاقِبَةُ لِلْمُتَّقِينَ وَسُبْحانَ رَبِّنَا إِنْ كَانَ وَعْدُ رَبِّنَا لَمَفْعُولاً وَلَن يُّخْلِفَ اللهُ وَعْدَهُ وَهُوَ الْعَزِيزُ الْحَكِيمُ . فَعَلَى الأَطَايِبِ مِنْ أَهْلِ بَيْتِ مُحَمَّدٍ وَعَلِيٍّ ـ صَلَّى اللهُ عَلَيْهِمَا وَآلِهِمَا ـ فَلْيَبْكِ الْبَاكُونَ ، وَإِيَّاهُمْ فَلْيَنْدُبِ النَّادِبُونَ ، وَلِمِثْلِهِمْ فَلْتَذْرِفِ(فلتدر) الدُّمُوعُ وَلِيَصْرُخِ الصَّارِخُونَ وَيَضِجَّ الضَّاجُّونَ وَيَعِجَّ العاجُّونَ ! أَيْنَ الحَسَنُ ؟ أَيْنَ الْحُسَيْنُ ؟ أَيْنَ أَبْنَاءُ الْحُسَيْنِ ؟ صَالِحٌ بَعْدَ صَالِحٍ وَصَادِقٌ بَعْدَ صَادِقٍ ! أَيْنَ السَّبِيلُ بَعْدَ السَّبِيلِ ؟ أَيْنَ الْخِيَرَةُ بَعْدَ الْخِيَرَةِ ؟ أَيْنَ الشُّمُوسُ الطَّالِعَةُ ؟ أَيْنَ الأَقْمَارُ الْمُنِيرَةُ ؟ أَيْنَ الأَنْجُمُ الزَّاهِرَةُ ؟ أَيْنَ أَعْلامُ الدِّينِ وَقَواعِدُ اْلعِلْمِ ؟ أَيْنَ بَقِيَّةُ اللهٍ الَّتِي لا تَخْلُو مِنَ الْعِتـْرَةِ الْهَادِيَةِ ؟ أَيْنَ الْمُعَدُّ لِقَطْعِ دَابِرِ الظَّلَمَةِ ؟ أَيْنَ المُنَتَظَرُ لإِقَامَةِ الأَمْتِ وَالْعِوَجِ ؟ أَيْنَ الْمُرْتَجى لإِزَالَةِ الْجَوْرِ وَالْعُدْوَانِ ؟ أَيْنَ الْمُدَّخَرُ لِتَجْدِيدِ الْفَرائِضِ وَالسُّنَنِ ؟ أَيْنَ الْمُتَخَيَّرُ لإِعَادَةِ الْمِلَّةِ وَالشَّرِيعَةِ ؟ أَيْنَ الْمُؤَمَّلُ لإِحْيَاءِ الْكِتَابِ وَحُدُودِهِ ؟ أَيْنَ مُحْيِي مَعَالِمِ الدِّينِ وَأَهْلِهِ ؟ أَيْنَ قَاصِمُ شَوْكَةِ الْمُعْتَدِينَ ؟ أَيْنَ هَادِمُ أَبْنِيَةِ الشِرْكِ وَالنِّفَاقِ ؟ أَيْنَ مُبِيدُ أَهْلِ الْفُسُوقِ وَالْعِصْيَانِ وَالطُّغْيَانِ ؟ أَيْنَ حَاصِدُ فُروعِ الْغَيِّ وَالشِّقَاقِ(النفاق) ؟ أَيْنَ طَامِسُ آثارِ الزَّيْغِ وَالأَهْوَاءِ ؟ أَيْنَ قَاطِعُ حَبَائِلِ الْكِذْبِ (الكَذِبِ) وَالِافْتِرَاءِ ؟ أَيْنَ مُبِيدُ الْعُتاةِ وَالْمَرَدَةِ؟ أَيْنَ مُسْتَأصِلُ أَهْلِ الْعِنادِ وَالتَّضْلِيلِ وَالإِلْحَادِ ؟ أَيْنَ مُعِزُّ الأَوْلِيَاءِ وَمُذِلُّ الأَعْدَاءِ ؟ أَيْنَ جَامِعُ الْكَلِمَةِ(الْكَلِم) عَلَى التَّقْوَى ؟ أَيْنَ بَابُ اللهِ الَّذِي مِنْهُ يُؤْتَى ؟ أَيْنَ وَجْهُ اللهِ الَّذِي إِلَيْهِ يَتَوجَّهُ الأَوْلِيَاءُ ؟ أَيْنَ السَّبَبُ الْمُتَّصِلُ بَيْنَ الأَرْضِ وَالسَّمَاءِ ؟ أَيْنَ صَاحِبُ يَوْمِ الْفَتْحِ وَنَاشِرُ رَايَةِ الْهُدَى ؟ أَيْنَ مُؤَلِّفُ شَمْلِ الصَّلاحِ وَالرِّضَا ؟ أَيْنَ الطَّالِبُ بِذُحُولِ الأَنْبِيَاءِ وَأَبْنَاءِ الأَنْبِيَاءِ ؟ أَيْنَ الطَّالِبُ (المطالب) بِدَمِ الْمَقْتُولِ بِكَرْبَلاَء ؟ أَيْنَ الْمَنْصُورُ عَلَى مَنِ اعْتَدى عَلَيْهِ وَافْتَرَى ؟ أَيْنَ الْمُضْطَرُّ الَّذِي يُجَابُ إِذَا دَعَا ؟ أَيْنَ صَدْرُ الْخَلائِقِ ذُو الْبِرِّ وَالتَّقْوَى ؟ أَيْنَ ابْنُ النَّبِيِّ الْمُصْطَفَى وَابْنُ عَلِيٍّ الْمُرْتَضَى وَابْنُ خَدِيجَةَ الغَرَّاءِ وَابْنُ فَاطِمَةَ الْكُبْرَى ؟! بِأَبِي أَنْتَ وَأُمِّي ، وَنَفْسِي لَكَ الْوِقاءُ وَالْحِمَى يَا بْنَ السَّادَةِ الْمُقَرَّبِينَ يَابْنَ النُّجَبَاءِ الأَكْرَمِينَ يَا بْنَ الْهُداةِ الْمَهْدِيِّينَ (المهتدين) يَا بْنَ الْخِيَرَةِ الْمُهَذَّبِينَ يَا بْنَ الْغَطارِفَةِ الأَنْجَبِينَ يَا بْنَ الأَطَايِبِ الْمُطَهَّرِينَ (المتطهرين) يَا بْنَ الْخَضَارِمَةِ المُنْتَجَبِينَ يَا بْنَ الْقَمَاقِمَةِ الأَكْرَمِينَ (الأكبرين)، يَا بْنَ الْبُدُورِ الْمُنِيرَةِ يَا بْنَ السُّرُجِ الْمُضِيئَةِ يَا بْنَ الشُّهُبِ الثَّاقِبَةِ يَا بْنَ الأَنْجُمِ الزَّاهِرَةِ يَا بْنَ السُّبُلِ الوَاضِحَةِ يَا بْنَ الأَعْلامِ اللَّائِحَةِ ، يَا بْنَ الْعُلُومِ الْكَامِلَةِ يَا بْنَ السُّنَنِ الْمَشْهُورَةِ يَا بْنَ الْمَعَالِمِ الْمَأْثُورَةِ يَا بْنَ الْمُعْجِزَاتِ الْمَوْجُودَةِ يَا بْنَ الدَّلائِلِ الْمَشْهُودَةِ (المشهورة) ، يَا بْنَ الصِّراطِ الْمُسْتَقِيمِ يَا بْنَ النَّبَإِ الْعَظِيمِ يَا بْنَ مَنْ هُوَ فِي أُمِّ الْكِتابِ لَدَى اللهِ عَلِيٌّ حَكِيمٌ ، يَا بْنَ الآيَاتِ وَالْبَيِّناتِ يَا بْنَ الدَّلائِلِ الظَّاهِرَاتِ يَا بْنَ الْبَراهِينِ الْوَاضِحَاتِ الْبَاهِرَاتِ يَا بْنَ الْحُجَجِ الْبَالِغَاتِ يَا بْنَ النِّعَمِ السَّابِغَاتِ يَا بْنَ طٰهٓ وَالْمُحْكَمَاتِ يَا بْنَ يٰسٓ وَالذَّارِيَاتِ يَا بْنَ الطُّورِ وَالْعَادِيَاتِ ، يَا بْنَ مَنْ دَنَا فَتَدَلَّى فَكَانَ قَابَ قَوْسَيْنِ أَوْ أَدْنَى دُنُوًّا وَاقْتِرَاباً مِنَ الْعَلِيِّ الأَعْلَى ! لَيْتَ شِعْرِي أيْنَ اسْتَقَرَّتْ بِكَ النَّوَى ؟ بَلْ أَيُّ أَرْضٍ تُقِلُّكَ أَوْ ثَرًى ؟! أَبِرَضْوَى أَوْ غَيْرِها أَمْ ذِي طُوَى ؟! عَزِيزٌ عَلَيَّ أَنْ أَرَى الْخَلْقَ وَلا تُرَى وَلا أَسْمَعُ لَكَ حَسِيساً وَلا نَجْوَى ، عَزِيزٌ عَلَيَّ أَنْ (لا تحيط بي دونك) تُحِيطَ بِكَ دُونِيَ الْبَلْوَى وَلا يَنَالُكَ مِنِّي ضَجِيجٌ وَلا شَكْوَى . بِنَفْسِي أَنْتَ مِنْ مُغَيَّبٍ لَمْ يَخْلُ مِنَّا ، بِنَفْسِي أَنْتَ مِنْ نَازِحٍ ما نَزَحَ عَنَّا (ينزح)، بِنَفْسِي أَنْتَ أُمْنِيَّةُ شَائِقٍ يَتَمَنَّى مِن مُّؤْمِنٍ وَمُؤْمِنَةٍ ذَكَرَا فَحَنَّا ، بِنَفْسِي أَنْتَ مِنْ عَقِيدِ عِزٍّ لا يُسَامَى ، بِنَفْسِي أَنْتَ مِنْ أَثِيلِ مَجْدٍ لا يُجَارَى ، بِنَفْسِي أَنْتَ مِنْ تِلادِ نِعَمٍ لا تُضَاهَى ، بِنَفْسِي أَنْتَ مِنْ نَصِيفِ شَرَفٍ لا يُسَاوَى ! إِلَى مَتَى أَحَارُ فِيكَ يَا مَوْلايَ وَإِلى مَتَى ؟ وَأَيَّ خِطَابٍ أَصِفُ فِيكَ وَأيَّ نَجْوى ؟ عَزِيزٌ عَلَيَّ أَنْ أُجَابَ دُونَكَ وَأُنَاغَى ، عَزِيزٌ عَلَيَّ أَنْ أَبْكِيَكَ وَيَخْذُلَكَ الْوَرَى ، عَزِيزٌ عَلَيَّ أَنْ يَجْرِيَ عَلَيْكَ دُونَهُمْ مَا جَرَى ، هَلْ مِن مُّعينٍ فَأُطِيلَ مَعَهُ الْعَوِيلَ وَالبُكَاءَ ؟ هَلْ مِنْ جَزُوعٍ فَأُسَاعِدَ جَزَعَهُ إِذَا خَلا ؟ هَلْ قَذِيَتْ عَينٌ فَساعَدَتْهَا عَيْنِي عَلَى الْقَذَى ؟ هَلْ إِلَيْكَ يَا بْنَ أَحْمَدَ سَبِيلٌ فَتُلْقَى ؟ هَلْ يَتَّصِلُ يَوْمُنَا مِنْكَ بِغَدِهِ ( بِعِدَةٍ) فَنَحْظى ؟ مَتَى نَرِدُ مَنَاهِلَكَ الرَّوِيَّةَ فَنَرْوَى ؟ مَتَى نَنْتَقِعُ مِنْ عَذْبِ مَائِكَ فَقَدْ طَالَ الصَّدَى ؟ مَتى نُغَادِيكَ وَنُرَاوِحُكَ فَنُقِرَّ عَيْناً (فَتَقُرُ عيوننا) ؟ مَتَى تَرَانَا وَنَرَاكَ وَقَدْ نَشَرْتَ لِوَاءَ النَّصْرِ ؟ تُرَى أَتَرَانا نَحُفُّ بِكَ وَأَنْتَ تَؤُمُّ الْمَلأَ وَقَدْ مَلَأْتَ الأَرْضَ عَدْلاً وَأَذَقْتَ أَعْدَاءَكَ هَوَانَاً وَعِقَاباً وَأَبَرْتَ الْعُتَاةَ وَجَحَدةَ الْحَقِّ وَقَطَعْتَ دَابِرَ الْمُتَكَبِّرِينَ وَاجْتَثَثْتَ أُصُولَ الظَّالِمِينَ وَنَحْنُ نَقُولُ : الْحَمْدُ للهِ رَبِّ الْعَالَمِينَ ؟ اَللَّهُمَّ أَنْتَ كَشَّافُ الْكَرْبِ وَالْبَلْوَى وَإِلَيْكَ أَسْتَعْدِي فَعِنْدَكَ الْعَدْوى وَأَنْتَ رَبُّ الآخِرَةِ وَالدُّنْيَا (الأولى) فَأَغِثْ يَا غِيَاثَ الْمُسْتَغِيثِينَ عُبَيْدَكَ الْمُبْتَلَى وَأَرِهِ سَيِّدَهُ يَا شَدِيدَ الْقُوَى وَأَزِلْ عَنْهُ بِهِ الأَسَى وَالْجَوَى وَبَرِّدْ غَلِيلَهُ يَا مَنْ عَلَى الْعَرْشِ اسْتَوَى وَمَنْ إِلَيْهِ الرُّجْعَى وَالْمُنْتَهَى ، اَللَّهُمَّ وَنَحنُ عَبِيدُكَ التَّائِقُونَ (الشائقون) إِلَى وَلِيِّكِ الْمُذَكِّرِ بِكَ وَبِنَبِيِّكَ ، خَلَقْتَهُ لَنَا عِصْمَةً وَمَلاذاً وَأَقَمْتَهُ لَنَا قِوَاماً وَمَعَاذاً ، وَجَعَلْتَهُ لِلْمُؤْمِنِينَ مِنَّا إِمَاماً ، فَبَلِّغْهُ مِنَّا تَحِيَّةً وَسَلاماً ، وَزِدْنا بِذَلِكَ يَا رَبِّ إِكْرَاماً وَاجْعَلْ مُسْتَقَرَّهُ لَنَا مُسْتَقَرًّا وَمُقَاماً ، وَأَتْمِمْ نِعْمَتَكَ بِتَقْدِيمِكَ إِيَّاهُ أَمامَنا حَتَّى تُورِدَنا جِنَانَكَ (جَناتَكَ) وَمُرافَقَةَ الشُّهَداءِ مِنْ خُلَصَائِكَ ، اَللَّهُمَّ صَلِّ عَلَى مُحمَّدٍ وَآلِ مُحَمَّدٍ ، وَصَلِّ عَلَى مُحَمَّدٍ جَدِّهِ وَرَسُولِكَ السَّيِّدِ الأَكْبَرِ وَعَلَى أَبِيهِ السَّيِّدِ الأَصْغَرِ وَجَدَّتِهِ الصِّدِّيقَةِ الْكُبْرى فَاطِمَةَ بِنْتِ مُحَمَّدٍ ـ صَلّى اللهُ عَلَيْهِ وَآلِهِ ـ وَعَلَى مَنِ اصْطَفَيْتَ مِنْ آبَائِهِ الْبَرَرَةِ وَعَلَيْهِ أَفْضَلَ وَأَكْمَلَ وَأَتَمَّ وَأَدْوَمَ وَأَكْثَرَ وَأَوْفَرَ مَا صَلَّيْتَ عَلَى أَحَدٍ مِنْ أَصْفِيَائِكَ وَخِيَرَتِكَ مِنْ خَلْقِكَ ، وَصَلِّ عَلَيْهِ صَلاةً لا غَايَةَ لِعَدَدِهَا وَلا نِهَايَةَ لِمَدَدِها وَلا نَفَادَ لأَمَدِها ، اَللَّهُمَّ وَأَقِمْ بِهِ الْحَقَّ وَأدْحِضْ بِهِ الْبَاطِلَ وَأَدِلْ بِهِ أَوْلِيَاءَكَ وَأَذْلِلْ بِهِ أَعْدَاءَكَ ، وَصِلِ ـ اللَّهُمَّ ـ بَيْنَنا وَبَيْنَهُ وُصْلَةً تُؤَدِّي إِلَى مُرَافَقَةِ سَلَفِهِ ، وَاجْعَلْنَا مِمَّنْ يَأخُذُ بِحُجْزَتِهِمْ وَيَمْكُثُ فِي ظِلِّهِمْ وَأَعِنَّا عَلَى تَأْدِيَةِ حُقُوقِهِ إِلَيْهِ وَالِاجْتِهادِ فِي طَاعَتِهِ وَاجتِنَابِ مَعْصِيَتِهِ ، وَامْنُنْ عَلَيْنَا بِرِضَاهُ وَهَبْ لَنَا رَأْفَتَهُ وَرَحْمَتَهُ وَدَعَاءَهُ وَخَيْرَهُ مَا نَنَالُ بِهِ سَعَةً مِنْ رَحْمَتِكَ وَفَوْزاً عِنْدَكَ ، وَاجْعَلْ صَلاتَنَا بِهِ مَقْبُولَةً ، وَذُنُوبَنَا بِهِ مَغْفُورَةً ، وَدُعَاءَنَا بِهِ مُسْتَجَاباً ، وَاجْعَلْ أَرْزَاقَنَا بِهِ مَبْسُوطَةً ، وَهُمُومَنَا بِهِ مَكْفِيَّةً ، وَحَوَائِجَنَا بِهِ مَقْضِيَّةً ، وَأَقْبِلْ إِلَيْنَا بِوَجْهِكَ الْكَرِيمِ ، وَاقْبَلْ تَقَرُّبَنَا إِلَيْكَ وَانْظُرْ إِلَيْنَا نَظْرَةً رَحِيمَةً نَسْتَكْمِلُ بِهَا الْكَرَامَةَ عِنْدَكَ ، ثُمَّ لا تَصْرِفْهَا عَنَّا بِجُودِكَ ، وَاسْقِنَا مِنْ حَوضِ جَدِّهِ ـ صَلَّى اللهُ عَلَيْهِ وَآلِهِ ـ بِكَأْسِهِ وَبِيَدِهِ رَيًّا رَوِيًّا هَنِيئاً سَائِغاً لا ظَمَأَ بَعْدَهُ يا أَرْحَمَ الرَّاحِمِينَ .",
  "زيارة الجامعة الكبيرة": "السَّلامُ عَلَيْكُمْ يا أَهْلَ بَيْتِ النُّبُوَّةِ، وَمَوْضِعَ الرِّسالَةِ، وَمُخْتَلَفَ المَلائِكَةِ، وَمَبْطِطَ الوَحْيِ، وَمَعْدِنَ الرَّحْمَةِ، وَخُزَّانَ العِلْمِ، وَمُنْتَهى الحِلْمِ، وَأُصُولَ الكَرَمِ، وَقادَةَ الأُمَمِ، وَأَوْلِياءَ النِّعَمِ، وَعَناصرَ الأَخْيارِ، وَدَعائِمَ الأَبْرارِ، وَسائِسَةَ العِبادِ، وَأَرْكانَ البِلادِ، وَأَبْوابَ الإِيمانِ، وَأُمَناءَ الرَّحْمنِ، وَسُلالَةَ النَّبِيِّينَ، وَصَفْوَةَ المُرْسَلِينَ، وَعِتْرَةَ خِيَرَةِ رَبِّ العالَمِينَ وَرَحْمَةُ اللهِ وَبَرَكاتُهُ.\n\nالسَّلامُ عَلَى أَئِمَّةِ الهُدَى، وَمَصابِيحِ الدُّجَى، وَأَعْلامِ التُّقَى، وَذَوِي النُّهَى، وَأُولِي الحِجَى، وَكَهْفِ الوَرَى، وَوَرَّاثِ الأَنْبِياءِ، وَالمَثَلِ الأَعْلَى، وَالدَّعْوَةِ الحُسْنَى، وَحُجَجِ اللهِ عَلَى أَهْلِ الدُّنْيا وَالآخِرَةِ وَالأُولَى وَرَحْمَةُ اللهِ وَبَرَكاتُهُ.\n\nأَشْهَدُ أَنْ لا إِلَهَ إِلاَّ اللهُ وَحْدَهُ لا شَرِيكَ لَهُ، كَما شَهِدَ اللهُ لِنَفْسِهِ وَشَهِدَتْ لَهُ مَلائِكَتُهُ وَأُولُوا العِلْمِ مِنْ خَلْقِهِ، لا إِلَهَ إِلاَّ هُوَ العَزِيزُ الحَكِيمُ، وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ المُنْتَجَبُ، وَرَسُولُهُ المُرْتَضَى، أَرْسَلَهُ بِالهُدَى وَدِينِ الحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ المُشْرِكُونَ.\n\nوَأَشْهَدُ أَنَّكُمُ الأَئِمَّةُ الرَّاشِدُونَ المَهْدِيُّونَ، المَعْصُومُونَ المُكَرَّمُونَ، المُقَرَّبُونَ المُتَّقُونَ، الصَّادِقُونَ المُصْطَفَوْنَ، المُطِيعُونَ لِلَّهِ، القَوَّامُونَ بِأَمْرِهِ، العامِلُونَ بِإِرادَتِهِ، الفائِزُونَ بِكَرامَتِهِ، اصْطَفاكُمْ بِعِلْمِهِ، وَارْتَضاكُمْ لِغَيْبِهِ، وَاخْتارَكُمْ لِسِرِّهِ، وَاجْتَباكُمْ بِقُدْرَتِهِ، وَأَعَزَّكُمْ بِهُداهُ، وَخَصَّكُمْ بِبُرْهانِهِ، وَانْتَجَبَكُمْ لِنُورِهِ، وَأَيَّدَكُمْ بِرُوحِهِ، وَرَضِيَكُمْ خُلَفاءَ فِي أَرْضِهِ، وَحُجَجاً عَلَى بَرِيَّتِهِ، وَأَنْصاراً لِدِينِهِ، وَحَفَظَةً لِسِرِّهِ، وَخَزَنَةً لِعِلْمِهِ، وَمُسْتَوْدَعاً لِحِكْمَتِهِ، وَتَراجِمَةً لِوَحْيِهِ، وَأَرْكاناً لِتَوْحِيدِهِ، وَشُهَداءَ عَلَى خَلْقِهِ، وَأَعْلاماً لِعِبادِهِ، وَمَناراً فِي بِلادِهِ، وَدُلاةً عَلَى صِراطِهِ.\n\nعَصَمَكُمُ اللهُ مِنَ الزَّلَلِ، وَآمَنَكُمْ مِنَ الفِتَنِ، وَطَهَّرَكُمْ مِنَ الدَّنَسِ، وَأَذْهَبَ عَنْكُمُ الرِّجْسَ وَطَهَّرَكُمْ تَطْهِيراً، فَعَظَّمْتُمْ جَلالَهُ، وَأَكْبَرْتُمْ شَأْنَهُ، وَكَبَّرْتُمْ كَرَمَهُ، وَأَدَمْتُمْ ذِكْرَهُ، وَوَثَّقْتُمْ مِيثاقَهُ، وَأَحْكَمْتُمْ عَقْدَ طاعَتِهِ، وَنَصَحْتُمْ لَهُ فِي السِّرِّ وَالعَلانِيَةِ، وَدَعَوْتُمْ إِلى سَبِيلِهِ بِالحِكْمَةِ وَالمَوْعِظَةِ الحَسَنَةِ.\n\nبِأَبِي أَنْتُمْ وَأُمِّي وَنَفْسِي وَأَهْلِي وَمالِي، مَنْ أَرادَ اللهَ بَدَأَ بِكُمْ، وَمَنْ وَحَّدَهُ قَبِلَ عَنْكُمْ، وَمَنْ قَصَدَهُ تَوَجَّهَ بِكُمْ، مَوالِيَّ لا أُحْصِي ثَناءَكُمْ وَلا أَبْلُغُ مِنَ المَدْحِ كُنْهَكُمْ وَمِنَ الوَصْفِ قَدْرَكُمْ، وَأَنْتُمْ نُورُ الأَخْيارِ وَهُداةُ الأَبْرارِ وَحُجَجُ الجَبَّارِ، بِكُمْ فَتَحَ اللهُ وَبِكُمْ يَخْتِمُ، وَبِكُمْ يُنَزِّلُ الغَيْثَ، وَبِكُمْ يُمْسِكُ السَّماءَ أَنْ تَقَعَ عَلَى الأَرْضِ إِلاَّ بِإِذْنِهِ، وَبِكُمْ يُفَرِّجُ الهَمَّ وَيَكْشِفُ الضُّرَّ.\n\nفَثَبَّتَنِيَ اللهُ أَبَداً ما حَيِيتُ عَلَى مُوالاتِكُمْ وَمَحَبَّتِكُمْ وَدِينِكُمْ، وَوَفَّقَنِي لِطاعَتِكُمْ، وَرَزَقَنِي شَفاعَتَكُمْ، وَجَعَلَنِي مِنْ خِيارِ مَوالِيكُمُ التَّابِعِينَ لِما دَعَوْتُمْ إِلَيْهِ، وَجَعَلَنِي مِمَّنْ يَقْتَفِي آثارَكُمْ، وَيَسْلُكُ سَبِيلَكُمْ، وَيَهْتَدِي بِهُداكُمْ، وَيُحْشَرُ فِي زُمْرَتِكُمْ، وَيَكِرُّ فِي رَجْعَتِكُمْ، وَيُمَلَّكُ فِي دَوْلَتِكُمْ، وَيُشَرَّفُ فِي عافِيَتِكُمْ، وَيُمَكَّنُ فِي أَيَّامِكُمْ، وَتَقَرُّ عَيْنُهُ غَداً بِرُؤْيَتِكُمْ، بِأَبِي أَنْتُمْ وَأُمِّي وَنَفْسِي وَأَهْلِي وَمالِي.",
  "زيارة النبي محمد (ص)": "أَشْهَدُ أَنْ لا إِلَهَ إِلاَّ اللهُ وَحْدَهُ لا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّكَ مُحَمَّدٌ عَبْدُهُ وَرَسُولُهُ، وَأَشْهَدُ أَنَّكَ قَدْ بَلَّغْتَ رِسالاتِ رَبِّكَ، وَنَصَحْتَ لِأُمَّتِكَ، وَجاهَدْتَ فِي سَبِيلِ اللهِ بِالْحَقِّ، وَعَبَدْتَهُ حَتَّى أَتاكَ اليَقِينُ، فَجَزاكَ اللهُ أَفْضَلَ ما جَزَى نَبِيّاً عَنْ أُمَّتِهِ.\n\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، أَفْضَلَ ما صَلَّيْتَ عَلَى إِبْراهِيمَ وَآلِ إِبْراهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. أَشْهَدُ يَا رَسُولَ اللهِ أَنَّكَ كُنْتَ نُوراً فِي الأَصْلابِ الشَّامِخَةِ، وَالأَرْحامِ المُطَهَّرَةِ، لَمْ تُنَجِّسْكَ الجاهِلِيَّةُ بِأَنْجاسِها، وَلَمْ تُلْبِسْكَ مِنْ مُدْلَهِمَّاتِ ثِيابِها.\n\nأَشْهَدُ أَنَّكَ عَمُودُ الدِّينِ، وَأَشْهَدُ أَنَّكَ قَدْ أَقَمْتَ الصَّلاةَ، وَآتَيْتَ الزَّكاةَ، وَأَمَرْتَ بِالمَعْرُوفِ، وَنَهَيْتَ عَنِ المُنْكَرِ، وَدَعَوْتَ إِلى سَبِيلِ رَبِّكَ بِالحِكْمَةِ وَالمَوْعِظَةِ الحَسَنَةِ، صَلَّى اللهُ عَلَيْكَ وَعَلَى أَهْلِ بَيْتِكَ الطَّاهِرِينَ.",
  "زيارة أمين الله": "السَّلامُ عَلَيْكَ يا أَمِينَ اللهِ فِي أَرْضِهِ، وَحُجَّتَهُ عَلَى عِبادِهِ، السَّلامُ عَلَيْكَ يا أَمِيرَ المُؤْمِنِينَ، أَشْهَدُ أَنَّكَ جاهَدْتَ فِي اللهِ حَقَّ جِهادِهِ، وَعَمِلْتَ بِكِتابِهِ، وَاتَّبَعْتَ سُنَنَ نَبِيِّهِ صَلَّى اللهُ عَلَيْهِ وَآلِهِ، حَتَّى دَعاكَ اللهُ إِلى جِوارِهِ، فَقَبَضَكَ إِلَيْهِ بِاخْتِيارِهِ، وَأَلْزَمَ أَعْداءَكَ الحُجَّةَ مَعَ ما لَكَ مِنَ الحُجَجِ البالِغَةِ عَلَى جَمِيعِ خَلْقِهِ.\n\nالدعاء الملحق بالزيارة\n\nثُمَّ يَقولُ أيضاً:\n\nاللَّهُمَّ إِنَّ أَكْوارَ المَسْتَغْفِرِينَ إِلَيْكَ مَشْحُونَةٌ، وَآمالَ المُمَّلِينَ لَدَيْكَ مَفْتُوحَةٌ، وَأَطْعامَ الطَّاعِمِينَ لَكَ مَبْذُولَةٌ، وَمَناهِلَ الظِّماءِ لَدَيْكَ مُتْرَعَةٌ، وَإِعانَتَكَ لِمَنِ اسْتَعانَ بِكَ مَبْذُولَةٌ، وَفَضْلَكَ لِمَنْ أَمَّلَكَ غَيْرُ مَقْطُوعٍ، وَمَغْفِرَتَكَ لِمَنْ أَرادَكَ غَيْرُ مَمْنُوعَةٍ، وَتَوْبَةَ مَنْ أَنابَ إِلَيْكَ مَقْبُولَةٌ.\n\nاللَّهُمَّ فَاجْعَلْ نَفْسِي مُطْمَئِنَّةً بِقَدَرِكَ، راضِيَةً بِقَضائِكِ، مُولَعَةً بِذِكْرِكَ وَدُعائِكَ، مُحِبَّةً لِصَفْوَةِ أَوْلِيائِكَ، مَحْبُوبَةً فِي أَرْضِكَ وَسَمائِكَ، صابِرَةً عَلَى نُزُولِ بَلائِكَ، شاكِرَةً لِفَواضِلِ نَعْمائِكَ، ذاكِرَةً لِسَوابِغِ آلاءِكَ، مُشْتاقَةً إِلى فرحَةِ لِقائِكَ، مُتَزَوِّدَةً التَّقْوَى لِيَوْمِ جَزائِكَ، مُسْتَنَّةً بِسُنَنِ أَوْلِيائِكَ، مُفارِقَةً لِأَخْلاقِ أَعْدائِكَ، شاغِلَةً عَنِ الدُّنْيا بِحَمْدِكَ وَثَنائِكَ.\n\n(ثم يضع خده على القبر ويقول):اللَّهُمَّ إِنَّ قُلُوبَ المُنْبِتِينَ إِلَيْكَ والِهَةٌ، وَسُبُلَ الرَّاغِبِينَ إِلَيْكَ شارِعَةٌ، وَأَعْلامَ القاصِدِينَ إِلَيْكَ واضِحَةٌ، وَأَفْئِدَةَ العارِفِينَ مِنْكَ فازِعَةٌ، وَأَصْواتَ الداعِينَ إِلَيْكَ صاعِدَةٌ، وَأَبْوابَ الإِجابَةِ لَهُمْ مُفَتَّحَةٌ، وَدَعْوَةَ مَنْ ناجاكَ مُسْتَجابَةٌ، وَتَوْبَةَ مَنْ أَنابَ إِلَيْكَ مَقْبُولَةٌ، وَعَبْرَةَ مَنْ بَكَى مِنْ خَوْفِكَ مَرْحُومَةٌ، وَالغاثَةَ لِمَنِ اسْتَغاثَ بِكَ مَوْجُودَةٌ، وَالإِعانَةَ لِمَنِ اسْتَعانَ بِكَ مبْذُولَةٌ.",
  "زيارة الإمام علي (ع)": "السَّلامُ عَلَيْكَ يا أَمِينَ اللهِ فِي أَرْضِهِ، وَحُجَّتَهُ عَلَى عِبادِهِ، السَّلامُ عَلَيْكَ يا أَمِيرَ المُؤْمِنِينَ، أَشْهَدُ أَنَّكَ جاهَدْتَ فِي اللهِ حَقَّ جِهادِهِ، وَعَمِلْتَ بِكِتابِهِ، وَاتَّبَعْتَ سُنَنَ نَبِيِّهِ صَلَّى اللهُ عَلَيْهِ وَآلِهِ، حَتَّى دَعاكَ اللهُ إِلى جِوارِهِ، فَقَبَضَكَ إِلَيْهِ بِاخْتِيارِهِ، وَأَلْزَمَ أَعْداءَكَ الحُجَّةَ مَعَ ما لَكَ مِنَ الحُجَجِ البالِغَةِ عَلَى جَمِيعِ خَلْقِهِ.\n\nالدعاء الملحق بالزيارة\n\nثُمَّ يَقولُ أيضاً:\n\nاللَّهُمَّ إِنَّ أَكْوارَ المَسْتَغْفِرِينَ إِلَيْكَ مَشْحُونَةٌ، وَآمالَ المُمَّلِينَ لَدَيْكَ مَفْتُوحَةٌ، وَأَطْعامَ الطَّاعِمِينَ لَكَ مَبْذُولَةٌ، وَمَناهِلَ الظِّماءِ لَدَيْكَ مُتْرَعَةٌ، وَإِعانَتَكَ لِمَنِ اسْتَعانَ بِكَ مَبْذُولَةٌ، وَفَضْلَكَ لِمَنْ أَمَّلَكَ غَيْرُ مَقْطُوعٍ، وَمَغْفِرَتَكَ لِمَنْ أَرادَكَ غَيْرُ مَمْنُوعَةٍ، وَتَوْبَةَ مَنْ أَنابَ إِلَيْكَ مَقْبُولَةٌ.\n\nاللَّهُمَّ فَاجْعَلْ نَفْسِي مُطْمَئِنَّةً بِقَدَرِكَ، راضِيَةً بِقَضائِكِ، مُولَعَةً بِذِكْرِكَ وَدُعائِكَ، مُحِبَّةً لِصَفْوَةِ أَوْلِيائِكَ، مَحْبُوبَةً فِي أَرْضِكَ وَسَمائِكَ، صابِرَةً عَلَى نُزُولِ بَلائِكَ، شاكِرَةً لِفَواضِلِ نَعْمائِكَ، ذاكِرَةً لِسَوابِغِ آلاءِكَ، مُشْتاقَةً إِلى فرحَةِ لِقائِكَ، مُتَزَوِّدَةً التَّقْوَى لِيَوْمِ جَزائِكَ، مُسْتَنَّةً بِسُنَنِ أَوْلِيائِكَ، مُفارِقَةً لِأَخْلاقِ أَعْدائِكَ، شاغِلَةً عَنِ الدُّنْيا بِحَمْدِكَ وَثَنائِكَ.\n\n(ثم يضع خده على القبر ويقول):اللَّهُمَّ إِنَّ قُلُوبَ المُنْبِتِينَ إِلَيْكَ والِهَةٌ، وَسُبُلَ الرَّاغِبِينَ إِلَيْكَ شارِعَةٌ، وَأَعْلامَ القاصِدِينَ إِلَيْكَ واضِحَةٌ، وَأَفْئِدَةَ العارِفِينَ مِنْكَ فازِعَةٌ، وَأَصْواتَ الداعِينَ إِلَيْكَ صاعِدَةٌ، وَأَبْوابَ الإِجابَةِ لَهُمْ مُفَتَّحَةٌ، وَدَعْوَةَ مَنْ ناجاكَ مُسْتَجابَةٌ، وَتَوْبَةَ مَنْ أَنابَ إِلَيْكَ مَقْبُولَةٌ، وَعَبْرَةَ مَنْ بَكَى مِنْ خَوْفِكَ مَرْحُومَةٌ، وَالغاثَةَ لِمَنِ اسْتَغاثَ بِكَ مَوْجُودَةٌ، وَالإِعانَةَ لِمَنِ اسْتَعانَ بِكَ مبْذُولَةٌ.",
  "زيارة السيدة فاطمة الزهراء (ع)": "يا مُمْتَحَنَةُ امْتَحَنَكِ اللهُ الَّذِي خَلَقَكِ قَبْلَ أَنْ يَخْلُقَكِ، فَوَجَدَكِ لِما امْتَحَنَكِ صابِرَةً، وَزَعَمْنا أَنَّا لَكِ أَوْلِياءُ وَمُصَدِّقُونَ، وَصَابِرُونَ لِكُلِّ ما أَتانَا بِهِ أَبُوكِ صَلَّى اللهُ عَلَيْهِ وَآلِهِ، وَأَتَى بِهِ وَصِيُّهُ، فَإِنَّا نَسْأَلُكِ إِنْ كُنَّا صَدَّقْناكِ إِلاَّ أَلْحَقْتِنا بِتَصْدِيقِنا لَهُما، لِنُبَشِّرَ أَنْفُسَنا بِأَنَّا قَدْ طَهُرْنا بِوِلايَتِكِ.\n\nالسَّلامُ عَلَيْكِ يا بِنْتَ رَسُولِ اللهِ، السَّلامُ عَلَيْكِ يا بِنْتَ نَبِيِّ اللهِ، السَّلامُ عَلَيْكِ يا بِنْتَ حَبِيبِ اللهِ، السَّلامُ عَلَيْكِ يا بِنْتَ خَلِيلِ اللهِ، السَّلامُ عَلَيْكِ يا بِنْتَ صَفِيِّ اللهِ، السَّلامُ عَلَيْكِ يا سَيِّدَةَ نِساءِ العالَمِينَ مِنَ الأَوَّلِينَ وَالآخِرِينَ، السَّلامُ عَلَيْكِ يا زَوْجَةَ وَلِيِّ اللهِ وَخَيْرِ الخَلْقِ بَعْدَ رَسُولِ اللهِ.",
  "زيارة الإمام الحسن المجتبى (ع)": "السَّلامُ عَلَيْكُمْ أَئِمَّةَ الهُدَى، السَّلامُ عَلَيْكُمْ أَهْلَ التَّقْوَى، السَّلامُ عَلَيْكُمْ أَيُّهَا الحُجَجُ عَلَى أَهْلِ الدُّنْيا، السَّلامُ عَلَيْكُمْ أَيُّهَا القُوَّامُ فِي البَرِيَّةِ بِالقِسْطِ، السَّلامُ عَلَيْكُمْ أَهْلَ الصَّفْوَةِ، السَّلامُ عَلَيْكُمْ آلَ رَسُولِ اللهِ، السَّلامُ عَلَيْكُمْ أَهْلَ النَّجْوَى.\n\nأَشْهَدُ أَنَّكُمْ قَدْ بَلَّغْتُمْ وَنَصَحْتُمْ وَصَبَرْتُمْ فِي ذاتِ اللهِ، وَكُذِّبْتُمْ وَأُسِيءَ إِلَيْكُمْ فَغَفَرْتُمْ، وَأَشْهَدُ أَنَّكُمُ الأَئِمَّةُ الرَّاشِدُونَ المَهْدِيُّونَ، وَأَنَّ طاعَتَكُمْ مَفْرُوضَةٌ، وَأَنَّ قَوْلَكُمُ الصِّدْقُ، وَأَنَّكُمْ دَعَوْتُمْ إِلى السَّبِيلِ الأَعْظَمِ، وَلَمْ تَمِيلُوا مِنْ هُدًى، وَلَمْ تَتَّبِعُوا هَوًى.\n\nأَشْهَدُ أَنَّكُمْ أَقَمْتُمُ الصَّلاةَ، وَآتَيْتُمُ الزَّكاةَ، وَأَمَرْتُمْ بِالمَعْرُوفِ، وَنَهَيْتُمْ عَنِ المُنْكَرِ، وَاتَّبَعْتُمُ الرَّسُولَ، وَتَلَوْتُمُ الكِتابَ حَقَّ تِلاوَتِهِ، وَجاهَدْتُمْ فِي اللهِ حَقَّ جِهادِهِ، صَلَواتُ اللهِ عَلَيْكُمْ وَعَلَى أَرْواحِكُمْ وَأَجْسادِكُمْ.",
  "زيارة الإمام السجاد (ع)": "السَّلامُ عَلَيْكَ يا زَيْنَ العابِدِينَ، السَّلامُ عَلَيْكَ يا زَيْنَ المُنْتَهجِينَ، السَّلامُ عَلَيْكَ يا إِمامَ المُمَجَّدِينَ، السَّلامُ عَلَيْكَ يا بَاقِرَ عِلْمِ النَّبِيِّينَ، السَّلامُ عَلَيْكَ يا سَيِّدَ السَّاجِدِينَ، السَّلامُ عَلَيْكَ يا أَبَا المَفَاخِرِ، صَلَواتُ اللهِ عَلَيْكَ وَعَلَى آبائِكَ وَأَبْنائِكَ الطَّاهِرِينَ.\n\nزيارة أئمة البقيع (عليهم السلام):\n\nالسَّلامُ عَلَيْكُمْ أَئِمَّةَ الهُدَى، السَّلامُ عَلَيْكُمْ أَهْلَ التَّقْوَى، السَّلامُ عَلَيْكُمْ أَيُّهَا الحُجَجُ عَلَى أَهْلِ الدُّنْيا، السَّلامُ عَلَيْكُمْ أَيُّهَا القُوَّامُ فِي البَرِيَّةِ بِالقِسْطِ، السَّلامُ عَلَيْكُمْ أَهْلَ الصَّفْوَةِ، السَّلامُ عَلَيْكُمْ آلَ رَسُولِ اللهِ، السَّلامُ عَلَيْكُمْ أَهْلَ النَّجْوَى.\n\nأَشْهَدُ أَنَّكُمْ قَدْ بَلَّغْتُمْ وَنَصَحْتُمْ وَصَبَرْتُمْ فِي ذاتِ اللهِ، وَكُذِّبْتُمْ وَأُسِيءَ إِلَيْكُمْ فَغَفَرْتُمْ، وَأَشْهَدُ أَنَّكُمُ الأَئِمَّةُ الرَّاشِدُونَ المَهْدِيُّونَ، وَأَنَّ طاعَتَكُمْ مَفْرُوضَةٌ، وَأَنَّ قَوْلَكُمُ الصِّدْقُ، وَأَنَّكُمْ دَعَوْتُمْ إِلى السَّبِيلِ الأَعْظَمِ، وَلَمْ تَمِيلُوا مِنْ هُدًى، وَلَمْ تَتَّبِعُوا هَوًى.\n\nأَشْهَدُ أَنَّكُمْ أَقَمْتُمُ الصَّلاةَ، وَآتَيْتُمُ الزَّكاةَ، وَأَمَرْتُمْ بِالمَعْرُوفِ، وَنَهَيْتُمْ عَنِ المُنْكَرِ، وَاتَّبَعْتُمُ الرَّسُولَ، وَتَلَوْتُمُ الكِتابَ حَقَّ تِلاوَتِهِ، وَجاهَدْتُمْ فِي اللهِ حَقَّ جِهادِهِ، صَلَواتُ اللهِ عَلَيْكُمْ وَعَلَى أَرْواحِكُمْ وَأَجْسادِكُمْ.",
  "زيارة الإمام الباقر (ع)": "السَّلامُ عَلَيْكَ يا بَاقِرَ عِلْمِ اللهِ، السَّلامُ عَلَيْكَ يا ظَاهِرَ أَمْرِ اللهِ، السَّلامُ عَلَيْكَ يا نَاطِقاً بِحُكْمِ اللهِ، السَّلامُ عَلَيْكَ يا مَعْدِنَ الصَّفْوَةِ، السَّلامُ عَلَيْكَ يا حُجَّةَ اللهِ عَلَى الخَلْقِ أَجْمَعِينَ، صَلَواتُ اللهِ عَلَيْكَ وَعَلَى أَهْلِ بَيْتِكَ الطَّاهِرِينَ.\n\nزيارة أئمة البقيع (عليهم السلام):\n\nالسَّلامُ عَلَيْكُمْ أَئِمَّةَ الهُدَى، السَّلامُ عَلَيْكُمْ أَهْلَ التَّقْوَى، السَّلامُ عَلَيْكُمْ أَيُّهَا الحُجَجُ عَلَى أَهْلِ الدُّنْيا، السَّلامُ عَلَيْكُمْ أَيُّهَا القُوَّامُ فِي البَرِيَّةِ بِالقِسْطِ، السَّلامُ عَلَيْكُمْ أَهْلَ الصَّفْوَةِ، السَّلامُ عَلَيْكُمْ آلَ رَسُولِ اللهِ، السَّلامُ عَلَيْكُمْ أَهْلَ النَّجْوَى.\n\nأَشْهَدُ أَنَّكُمْ قَدْ بَلَّغْتُمْ وَنَصَحْتُمْ وَصَبَرْتُمْ فِي ذاتِ اللهِ، وَكُذِّبْتُمْ وَأُسِيءَ إِلَيْكُمْ فَغَفَرْتُمْ، وَأَشْهَدُ أَنَّكُمُ الأَئِمَّةُ الرَّاشِدُونَ المَهْدِيُّونَ، وَأَنَّ طاعَتَكُمْ مَفْرُوضَةٌ، وَأَنَّ قَوْلَكُمُ الصِّدْقُ، وَأَنَّكُمْ دَعَوْتُمْ إِلى السَّبِيلِ الأَعْظَمِ، وَلَمْ تَمِيلُوا مِنْ هُدًى، وَلَمْ تَتَّبِعُوا هَوًى.\n\nأَشْهَدُ أَنَّكُمْ أَقَمْتُمُ الصَّلاةَ، وَآتَيْتُمُ الزَّكاةَ، وَأَمَرْتُمْ بِالمَعْرُوفِ، وَنَهَيْتُمْ عَنِ المُنْكَرِ، وَاتَّبَعْتُمُ الرَّسُولَ، وَتَلَوْتُمُ الكِتابَ حَقَّ تِلاوَتِهِ، وَجاهَدْتُمْ فِي اللهِ حَقَّ جِهادِهِ، صَلَواتُ اللهِ عَلَيْكُمْ وَعَلَى أَرْواحِكُمْ وَأَجْسادِكُمْ.",
  "زيارة الإمام الصادق (ع)": "السَّلامُ عَلَيْكَ يا جَعْفَرَ بْنَ مُحَمَّدٍ الصَّادِقَ، السَّلامُ عَلَيْكَ يا إِمامَ الهُدَى، السَّلامُ عَلَيْكَ يا العَلَمَ التَّقِيَّ، السَّلامُ عَلَيْكَ يا الحُجَّةَ عَلَى الوَرَى، السَّلامُ عَلَيْكَ يا مَنْ طَهَّرَهُ اللهُ مِنَ الرِّجْسِ وَطَهَّرَهُ تَطْهِيراً، صَلَّى اللهُ عَلَيْكَ وَعَلَى آبائِكَ وَأَبْنائِكَ المَعْصُومِينَ.\n\nزيارة أئمة البقيع (عليهم السلام):\n\nالسَّلامُ عَلَيْكُمْ أَئِمَّةَ الهُدَى، السَّلامُ عَلَيْكُمْ أَهْلَ التَّقْوَى، السَّلامُ عَلَيْكُمْ أَيُّهَا الحُجَجُ عَلَى أَهْلِ الدُّنْيا، السَّلامُ عَلَيْكُمْ أَيُّهَا القُوَّامُ فِي البَرِيَّةِ بِالقِسْطِ، السَّلامُ عَلَيْكُمْ أَهْلَ الصَّفْوَةِ، السَّلامُ عَلَيْكُمْ آلَ رَسُولِ اللهِ، السَّلامُ عَلَيْكُمْ أَهْلَ النَّجْوَى.\n\nأَشْهَدُ أَنَّكُمْ قَدْ بَلَّغْتُمْ وَنَصَحْتُمْ وَصَبَرْتُمْ فِي ذاتِ اللهِ، وَكُذِّبْتُمْ وَأُسِيءَ إِلَيْكُمْ فَغَفَرْتُمْ، وَأَشْهَدُ أَنَّكُمُ الأَئِمَّةُ الرَّاشِدُونَ المَهْدِيُّونَ، وَأَنَّ طاعَتَكُمْ مَفْرُوضَةٌ، وَأَنَّ قَوْلَكُمُ الصِّدْقُ، وَأَنَّكُمْ دَعَوْتُمْ إِلى السَّبِيلِ الأَعْظَمِ، وَلَمْ تَمِيلُوا مِنْ هُدًى، وَلَمْ تَتَّبِعُوا هَوًى.\n\nأَشْهَدُ أَنَّكُمْ أَقَمْتُمُ الصَّلاةَ، وَآتَيْتُمُ الزَّكاةَ، وَأَمَرْتُمْ بِالمَعْرُوفِ، وَنَهَيْتُمْ عَنِ المُنْكَرِ، وَاتَّبَعْتُمُ الرَّسُولَ، وَتَلَوْتُمُ الكِتابَ حَقَّ تِلاوَتِهِ، وَجاهَدْتُمْ فِي اللهِ حَقَّ جِهادِهِ، صَلَواتُ اللهِ عَلَيْكُمْ وَعَلَى أَرْواحِكُمْ وَأَجْسادِكُمْ.",
  "زيارة عاشوراء": "السَّلامُ عَلَيْكَ يا أَبَا عَبْدِ اللهِ، السَّلامُ عَلَيْكَ يَا ابْنَ رَسُولِ اللهِ، السَّلامُ عَلَيْكَ يَا ابْنَ أَمِيرِ المُؤْمِنِينَ وَابْنَ سَيِّدِ الوَصِيِّينَ، السَّلامُ عَلَيْكَ يَا ابْنَ فاطِمَةَ سَيِّدَةِ نِساءِ العالَمِينَ، السَّلامُ عَلَيْكَ يا ثارَ اللهِ وَابْنَ ثارِهِ وَالوِتْرَ المَوْتُورَ، السَّلامُ عَلَيْكَ وَعَلَى الأَرْواحِ الَّتِي حَلَّتْ بِفِنائِكَ، عَلَيْكُمْ مِنِّي جَمِيعاً سَلامُ اللهِ أَبَداً ما بَقِيتُ وَبَقِيَ اللَّيْلُ وَالنَّهارُ.\n\nيا أَبَا عَبْدِ اللهِ، لَقَدْ عَظُمَتِ الرَّزِيَّةُ وَجَلَّتْ وَعَظُمَتِ المُصِيبَةُ بِكَ عَلَيْنا وَعَلَى جَمِيعِ أَهْلِ الإِسْلامِ، وَجَلَّتْ وَعَظُمَتْ مُصِيبَتُكَ فِي السَّمَواتِ عَلَى جَمِيعِ أَهْلِ السَّمَواتِ، فَلَعَنَ اللهُ أُمَّةً أَسَّسَتْ أَساسَ الظُّلْمِ وَالجَوْرِ عَلَيْكُمْ أَهْلَ البَيْتِ، وَلَعَنَ اللهُ أُمَّةً دَفَعَتْكُمْ عَنْ مَقامِكُمْ وَأَزالَتْكُمْ عَنْ مَراتِبِكُمُ الَّتِي رَتَّبَكُمُ اللهُ فِيها، وَلَعَنَ اللهُ أُمَّةً قَتَلَتْكُمْ، وَلَعَنَ اللهُ المُمَهِّدِينَ لَهُمْ بِالَّتمْكِينِ مِنْ قِتالِكُمْ، بَرِئْتُ إِلى اللهِ وَإِلَيْكُمْ مِنْهُمْ وَمِنْ أَشْياعِهِمْ وَأَتْباعِهِمْ وَأَوْلِيائِهِمْ.\n\nيا أَبَا عَبْدِ اللهِ، إِنِّي سِلْمٌ لِمَنْ سالَمَكُمْ وَحَرْبٌ لِمَنْ حارَبَكُمْ إِلى يَوْمِ القِيامَةِ، وَلَعَنَ اللهُ آلَ زِيادٍ وَآلَ مَرْوانَ، وَلَعَنَ اللهُ بَنِي أُمَيَّةَ قاطِبَةً، وَلَعَنَ اللهُ ابْنَ مَرْجانَةَ، وَلَعَنَ اللهُ عُمَرَ بْنَ سَعْدٍ، وَلَعَنَ اللهُ شِمْراً، وَلَعَنَ اللهُ أُمَّةً أَجْلَبَتْ وَصَيَّخَتْ وَتَنَقَّبَتْ لِقِتالِكَ، بِأَبِي أَنْتَ وَأُمِّي، لَقَدْ عَظُمَ مُصابِي بِكَ، فَأَسْأَلُ اللهَ الَّذِي أَكْرَمَ مَقامَكَ وَأَكْرَمَنِي بِكَ أَنْ يَرْزُقَنِي طَلَبَ ثارِكَ مَعَ إِمامٍ مَنْصُورٍ مِنْ أَهْلِ بَيْتِ مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَآلِهِ.\n\nاللعن (يُكرر مائة مرة):\n\nاللَّهُمَّ الْعَنْ أَوَّلَ ظالِمٍ ظَلَمَ حَقَّ مُحَمَّدٍ وَآلِ مُحَمَّدٍ وَآخِرَ تابِعٍ لَهُ عَلَى ذلِكَ، اللَّهُمَّ الْعَنِ العِصابَةَ الَّتِي جاهَدَتِ الحُسَيْنَ وَشايَعَتْ وَباَيَعَتْ وَتابَعَتْ عَلَى قَتْلِهِ، اللَّهُمَّ الْعَنْهُمْ جَمِيعاً.\n\nالسلام (يُكرر مائة مرة):\n\nالسَّلامُ عَلَيْكَ يا أَبَا عَبْدِ اللهِ وَعَلَى الأَرْواحِ الَّتِي حَلَّتْ بِفِنائِكَ، عَلَيْكَ مِنِّي سَلامُ اللهِ أَبَداً ما بَقِيتُ وَبَقِيَ اللَّيْلُ وَالنَّهارُ، وَلا جَعَلَهُ اللهُ آخِرَ العَهْدِ مِنِّي لِزِيارَتِكُمْ، السَّلامُ عَلَى الحُسَيْنِ، وَعَلَى عَلِيِّ بْنِ الحُسَيْنِ، وَعَلَى أَوْلادِ الحُسَيْنِ، وَعَلَى أَصْحابِ الحُسَيْنِ.\n\nدعاء السجود في نهاية الزيارة:\n\nاللَّهُمَّ لَكَ الحَمْدُ حَمْدَ الشَّاكِرِينَ لَكَ عَلَى مُصابِهِمْ، الحَمْدُ لِلَّهِ عَلَى عَظِيمِ رَزِيَّتِي، اللَّهُمَّ ارْزُقْنِي شَفاعَةَ الحُسَيْنِ يَوْمَ الوُرُودِ، وَثَبِّتْ لِي قَدَمَ صِدْقٍ عِنْدَكَ مَعَ الحُسَيْنِ وَأَصْحابِ الحُسَيْنِ الَّذِينَ بَذَلُوا مُهَجَهُمْ دُونَ الحُسَيْنِ عَلَيْهِ السَّلامُ.",
  'زيارة وارث': "اَلسَّلامُ عَلَيْكَ يَا وَارِثَ آدَمَ صَفوَةِ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا وَارِثَ نُوحٍ نَّبِيِّ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا وَارِثَ إِبرَاهِيمَ خَلِيلِ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا وَارِثَ مُوسَى كَلِيمِ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا وَارِثَ عِيسَى رُوحِ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا وَارِثَ مُحَمَّدٍ حَبِيبِ اللهِ ، اَلسّّلامُ عَلَيْكَ يَا وَارِثَ أَمِيرِ المُؤمِنِينَ وَلِيِّ اللهِ ، اَلسَّلامُ عَلَيْكَ يَابْنَ مُحمَّدٍ المُصْطَفَى ، اَلسَّلامُ عَلَيْكَ يَابنَ عَليٍّ المُرْتَضَى ، اَلسَّلامُ عَلَيْكَ يَابْنَ فاطِمَةَ الزَّهْرَاءِ ، اَلسَّلامُ عَلَيْكَ يَابْنَ خَدِيجَةَ الْكُبْرَى ، اَلسَّلامُ عَلَيْكَ يَا ثَارَ اللهِ وَابْنَ ثَأْرِهِ وَالْوِتْرَ الْمُوْتُورَ ، أَشهَدُ أَنَّكَ قَدْ أَقَمْتَ الصَّلاةَ وَآتَيْتَ الزَّكَاةَ ، وَأمَرْتَ بِالْمَعرُوفِ وَنَهَيْتَ عَنِ المُنْكَرِ ، وَأَطَعْتَ اللهَ وَرَسُولَهُ حَتَّى أَتَاكَ الْيَقِينُ ، فَلَعَنَ اللهُ أُمَّةً قَتَلَتْكَ ، وَلَعَنَ اللهُ أُمَّةً ظَلَمَتْكَ ، وَلَعَنَ اللهُ أُمَّةً سَمِعَتِ بِذَلِكَ فَرَضِيَتْ بِهِ ، يَا مَولايَ يَا أَبَا عَبدِ اللهِ أَشْهَدُ أَنَّكَ كُنْتَ نُوراً فِي الأَصْلابِ الشَّامِخَةِ وَالأَرْحَامِ المُطَهَّرَةِ لَمْ تُنَجّسْكَ الْجَاهِلِيَّةُ بِأَنْجَاسِهَا ، وَلَمْ تُلْبِسْكَ مِن مُّدْلَهِمَّاتِ ثِيَابِهَا ، وَأَشْهَدُ أَنَّكَ مِنْ دَعَائِمِ الدِّينِ وَأَرْكَانِ الْمُؤمِنِينَ ، وَأَشْهَدُ أَنَّكَ الإِمَامُ البَرُّ التَّقِيُّ ، الرَّضِيُّ الزَّكِيُّ ، الْهَادِيُ الْمَهْدِيُّ ، وَأَشهَدُ أنَّ الأَئِمَّةَ مِن وُّلْدِكَ كَلِمَةُ التَّقْوَى ، وَأَعْلامُ الْهُدَى وَالْعُرْوَةُ الْوُثْقَى ، وَالْحُجَّةُ عَلَى أَهْلِ الدُّنيَا ، وَأُشهِدُ اللهَ وَمَلائِكَتَهُ وأَنْبِيَاءَهُ وَرُسُلَهُ أَنِّي بِكُم مُؤمِنٌ وَّبِإِيَابِكُمْ مُوْقِنٌ بِشَرَائِعِ دِينِي وَخوَاتِيمِ عَمَلِي وَقَلْبِي لِقَلْبِكُم سِلْمٌ وَأَمْرِي لِأَمْرِكُم مُتَّبِعٌ ، صَلَوَاتُ اللهِ عَلَيْكُم وَعَلَى أَرْوَاحِكُم وَعَلَى أَجْسَادِكُم وَعَلَى أَجْسَامِكُم ، وَعَلَى شَاهِدكُم وَعَلَى غَائِبِكُم وَعَلَى ظَاهِرِكُمْ وَعَلَى بَاطِنِكُمْ .\n\nبِأَبِي أَنْتَ وَأُمِّي يَابْنَ رَسُولِ اللهِ ، بِأَبِي أَنْتَ وَأُمِّي يَا أَبَا عَبْدِ اللهِ ، لَقَدْ عَظُمَتِ الرَّزِيَّةُ وَجَلَّتِ الْمُصِيبَةُ بِكَ عَلَيْنَا وَعَلَى جَميعِ أَهْلِ السَّمَاوَاتِ والْأَرْضِ ، فَلَعَنَ اللهُ أُمَّةً أَسْرَجَتْ وَأَلْجَمَتْ وَتَهَيَّأَتْ لِقِتَالِكَ ، يَا مَوْلايَ يَا أَبَا عَبْدِ اللهِ قَصَدتُّ حَرَمَكَ ، وَأَتَيْتُ إِلَى مَشْهَدِكَ ، أَسْألُ اللهَ بِالشَّأْنِ الَّذي لَكَ عِنْدَهُ وبِالْمَحَلِّ الَّذِي لَكَ لَدَيْهِ ، أَن يُّصَلِّيَ عَلَى مُحَمَّدٍ وَّآلِ مُحَمَّدٍ ، وَأَن يَّجْعَلَنِي مَعَكُمْ فِي الدُّنْيَا وَالْآخِرَةِ .\n\nثمّ قم وصِرْ إلى عند رجلَيْ القبر وقفْ عند رأس عليّ بن الحسين ـ عليه السلام ـ وقلْ :\n\nاَلسَّلامُ عَلَيْكَ يابْنَ رَسُولِ اللهِ ، اَلسَّلامُ عَلَيْكَ يابْنَ نَبِيِّ اللهِ ، اَلسَّلامُ عَلَيْكَ يابْنَ أَمِيرِ الْمُؤْمِنِينَ ، اَلسَّلامُ عَلَيْكَ يابْنَ الْحُسَيْنِ الشَّهِيدِ ، اَلسَّلامُ عَلَيْكَ أَيُّهَا الشَّهِيدُ ، السَّلامُ عَلَيْكَ أَيُّهَا الْمَظْلُومُ وَابْنُ الْمَظْلُومُ ، لَعَنَ اللهُ أُمَّةً قَتَلَتْكَ ، وَلَعَنَ اللهُ أُمَّةً ظَلَمَتْكَ ، وَلَعَنَ اللهُ أُمَّةً سَمِعَتْ بِذلِكَ فَرَضِيَتْ بِهِ . ثم انكب على القبر وقل : اَلسَّلامُ عَلَيْكَ يَا وَلِيَّ اللهِ وَابْنَ وَلِيِّهِ لَقَدْ عَظُمَتِ الْمُصِيبَةُ وَجَلَّتِ الرَّزِيَّةُ بِكَ عَلَيْنَا وَعَلَى جَمِيعِ الْمُسْلِمِينَ ؛ فَلَعَنَ اللهُ أُمَّةً قَتَلَتْكَ ، وَأَبْرَأُ إِلَى اللهِ وَإِلَيْكَ مِنْهُمْ .\n\nثمّ توجّه إلى الشهداء وقلْ :\n\nاَلسَّلامُ عَلَيْكُمْ يَا أَوْلِيَاءَ اللهِ وَأَحِبَّاءَهُ ، اَلسَّلامُ عَلَيْكُمْ يَا أَصْفِيَاءَ اللهِ وَأَوِدَّاءَهُ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصَارَ دِينِ اللهِ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصَارَ رَسُولِ اللهِ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصَارَ أَمِيرِ الْمُؤْمِنِينَ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصَارَ فاطِمَةَ سَيِّدَةِ نِسَاءِ الْعَالَمِينَ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصارَ أَبِي مُحَمَّدٍ الْحَسَنِ بْنِ عَلِيٍّ الْوَلِيِّ النَّاصِحِ ، اَلسَّلامُ عَلَيْكُمْ يَا أَنْصَارَ أَبِي عَبْدِ اللهِ ، بِأَبِي أَنْتُمْ وَأُمِّي ، طِبْتُمْ وَطَابَتِ الأَرْضُ الَّتِي فِيهَا دُفِنْتُمْ ، وَفُزْتُمْ فَوْزاً عَظِيماً ، فَيَا لَيْتَنِي كُنْتُ مَعَكُمْ فَأَفُوزَ مَعَكُمْ .",
  "زيارة الإمام الكاظم (ع)": "السَّلامُ عَلَيْكُما يا وَلِيَيِّ اللهِ وَصَفْوَتَهُ، السَّلامُ عَلَيْكُما يا حُجَّتَيِ اللهِ وَداعِيَيْهِ، السَّلامُ عَلَيْكُما يا نُورَيِ اللهِ فِي ظُلُماتِ الأَرْضِ، أَشْهَدُ أَنَّكُما قَدْ بَلَّغْتُما عَنِ اللهِ ما حَمَّلَكُما، وَحَفِظْتُما ما اسْتَوْدَعَكُما، وَأَحْلَلْتُما حَلالَ اللهِ، وَحَرَّمْتُما حَرامَ اللهِ، وَأَقَمْتُما صَلاةَ اللهِ، وَآتَيْتُما زَكاةَ اللهِ، وَجاهَدْتُما فِي سَبِيلِ اللهِ حَتَّى أَتاكُما اليَقِينُ.\n\nأَتَيْتُكُما زائِراً، عَارِفاً بِحَقِّكُما، مُوالِياً لِأَوْلِيائِكُما، مُعادِياً لِأَعْدائِكُما، مُسْتَبْصِراً بِالهُدَى الَّذِي أَنْتُما عَلَيْهِ، عارِفاً بِضَلالَةِ مَنْ خَالَفَكُما، فَاشْفَعا لِي عِنْدَ رَبِّكُما، فَإِنَّ لَكُما عِنْدَ اللهِ مَقاماً مَحْمُوداً وَجاهاً عَظِيماً.",
  "زيارة الإمام الجواد (ع)": "السَّلامُ عَلَيْكُما يا وَلِيَيِّ اللهِ وَصَفْوَتَهُ، السَّلامُ عَلَيْكُما يا حُجَّتَيِ اللهِ وَداعِيَيْهِ، السَّلامُ عَلَيْكُما يا نُورَيِ اللهِ فِي ظُلُماتِ الأَرْضِ، أَشْهَدُ أَنَّكُما قَدْ بَلَّغْتُما عَنِ اللهِ ما حَمَّلَكُما، وَحَفِظْتُما ما اسْتَوْدَعَكُما، وَأَحْلَلْتُما حَلالَ اللهِ، وَحَرَّمْتُما حَرامَ اللهِ، وَأَقَمْتُما صَلاةَ اللهِ، وَآتَيْتُما زَكاةَ اللهِ، وَجاهَدْتُما فِي سَبِيلِ اللهِ حَتَّى أَتاكُما اليَقِينُ.\n\nأَتَيْتُكُما زائِراً، عَارِفاً بِحَقِّكُما، مُوالِياً لِأَوْلِيائِكُما، مُعادِياً لِأَعْدائِكُما، مُسْتَبْصِراً بِالهُدَى الَّذِي أَنْتُما عَلَيْهِ، عارِفاً بِضَلالَةِ مَنْ خَالَفَكُما، فَاشْفَعا لِي عِنْدَ رَبِّكُما، فَإِنَّ لَكُما عِنْدَ اللهِ مَقاماً مَحْمُوداً وَجاهاً عَظِيماً.",
  "زيارة الإمام الرضا (ع)": "السَّلامُ عَلَيْكَ يا حُجَّةَ اللهِ، السَّلامُ عَلَيْكَ يا نُورَ اللهِ فِي ظُلُماتِ الأَرْضِ، السَّلامُ عَلَيْكَ يا عَمُودَ الدِّينِ، السَّلامُ عَلَيْكَ يا وارِثَ آدَمَ صَفْوَةِ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ نُوحٍ نَبِيِّ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ إِبْراهِيمَ خَلِيلِ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ إِسْماعِيلَ ذَبِيحِ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ مُوسَى كَلِيمِ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ عِيسَى رُوحِ اللهِ، السَّلامُ عَلَيْكَ يا وارِثَ مُحَمَّدٍ رَسُولِ اللهِ.\n\nأَشْهَدُ أَنَّكَ قَدْ أَقَمْتَ الصَّلاةَ، وَآتَيْتَ الزَّكاةَ، وَأَمَرْتَ بِالمَعْرُوفِ، وَنَهَيْتَ عَنِ المُنْكَرِ، وَعَبَدْتَ اللهَ مُخْلِصاً حَتَّى أَتاكَ اليَقِينُ، السَّلامُ عَلَيْكَ يا أَبَا الحَسَنِ وَرَحْمَةُ اللهِ وَبَرَكاتُهُ.\n\nأَتَيْتُكَ زائِراً شاخِصاً بَصَرِي، مُسْتَبْصِراً بِهُداكَ، عَارِفاً بِحَقِّكَ، مُقِرّاً بِفَضْلِكَ، مُوالِياً لِأَوْلِيائِكَ، مُعادِياً لِأَعْدائِكَ، فَاشْفَعْ لِي عِنْدَ رَبِّكَ.",
  "زيارة الإمام الهادي (ع)": "السَّلامُ عَلَيْكُما يا وَلِيَّيِ اللهِ، السَّلامُ عَلَيْكُما يا حُجَّتَيِ اللهِ، السَّلامُ عَلَيْكُما يا نُورَيِ اللهِ فِي ظُلُماتِ الأَرْضِ، السَّلامُ عَلَيْكُما يا إِمامَيِ الهُدَى، وَعَلَمَيِ التُّقَى، وَقائِدَيِ الوَرَى.\n\nأَشْهَدُ أَنَّكُما قَدْ أَقَمْتُما الصَّلاةَ، وَآتَيْتُما الزَّكاةَ، وَأَمَرْتُما بِالمَعْرُوفِ، وَنَهَيْتُما عَنِ المُنْكَرِ، وَجاهَدْتُما فِي اللهِ حَقَّ جِهادِهِ، حَتَّى أَتاكُما اليَقِينُ، صَلَّى اللهُ عَلَيْكُما وَعَلَى أَرْواحِكُما وَأَجْسادِكُما، وَرَحْمَةُ اللهِ وَبَرَكاتُهُ.",
  "زيارة الإمام الحسن العسكري (ع)": "السَّلامُ عَلَيْكُما يا وَلِيَّيِ اللهِ، السَّلامُ عَلَيْكُما يا حُجَّتَيِ اللهِ، السَّلامُ عَلَيْكُما يا نُورَيِ اللهِ فِي ظُلُماتِ الأَرْضِ، السَّلامُ عَلَيْكُما يا إِمامَيِ الهُدَى، وَعَلَمَيِ التُّقَى، وَقائِدَيِ الوَرَى.\n\nأَشْهَدُ أَنَّكُما قَدْ أَقَمْتُما الصَّلاةَ، وَآتَيْتُما الزَّكاةَ، وَأَمَرْتُما بِالمَعْرُوفِ، وَنَهَيْتُما عَنِ المُنْكَرِ، وَجاهَدْتُما فِي اللهِ حَقَّ جِهادِهِ، حَتَّى أَتاكُما اليَقِينُ، صَلَّى اللهُ عَلَيْكُما وَعَلَى أَرْواحِكُما وَأَجْسادِكُما، وَرَحْمَةُ اللهِ وَبَرَكاتُهُ.",
