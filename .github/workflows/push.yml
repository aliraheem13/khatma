name: reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - run: python push.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
